retained_fk_edges = [{ relation = "artifact_delta_old", attributes = ["artifact_sha256"] }, { relation = "prepared_artifact", attributes = ["artifact_sha256"] }, { relation = "catalog_artifact", attributes = ["artifact_id"], via = ["artifact_identity"] }]
owned_prunable_intermediates = ["artifact_location", "artifact_identity"]
required_via_paths = [{ relation = "catalog_artifact", attributes = ["artifact_id"], via = ["artifact_identity"] }]
phases = [
  { phase = "AB_LOCATIONS", order = 1, relations = ["artifact_location"] },
  { phase = "AB_IDENTITIES", order = 2, relations = ["artifact_identity"] },
  { phase = "AB_ROOT", order = 3, relations = ["artifact_blob"] },
]

[[cleanup_target]]
target_kind = "CANONICAL_VALUE"
mode = "SWEEP"
sweep_shard_count = 256
selection_order_id = "sha256_prefix_then_candidate_key_v1"
root_relation = "canonical_value_allocation"
root_key = ["value_sha256"]
key_codec = "target_kind_tag16_u64be_zero8_v1"
eligible_predicate_id = "canonical_value_unreferenced_v1"
