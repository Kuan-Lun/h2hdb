  "page_sha256 is raw SHA-256 of the exact owner-prefixed page frame; on every existing digest compare page bytes byte-for-byte and reject cross-owner reuse",
  "canonical_value_identity(value_sha256,root_page_sha256) is inserted last only after allocation domain/count congruence, complete deterministic tree validation, exact root owner/count equality, and incremental recomputation of the canonical wrapper digest; identity seal alone retains the canonical_value_upload claim until the first retention-blocking external consumer handoff transaction; a phase-owned dictionary or type row alone never releases the claim; existing canonical foreign keys reference only this final seal",
  "CANONICAL_VALUE cleanup is rooted at canonical_value_allocation; final-identity foreign keys and operational canonical_value_upload(generation,value_sha256), keyed only by that pair so multiple takeover generations may protect the same value, block cleanup; generation is SQL-bound to the ingest-generation owner; the first allocation plus upload claim commits atomically under the exact live coordination head, owner, and lease; source_root_v1 is the sole pre-mapping exception because its final identity is required before source_scope, source_build, and source_build_generation can exist, and the same live turn creates that mapping after sealing the root; every other digest domain requires its durable source_build_generation mapping before allocation or claim; a newer-generation resume exact-compares the existing allocation domain/count and every deterministic page conflict; every allocation, page, and seal holds the shared canonical-value maintenance gate and rechecks the live head/owner/lease/claim, while a cleanup cycle holds its exclusive form; inserting or validating the final identity never releases its upload claim by itself; the first retention-blocking external consumer and deletion of only that generation claim commit atomically, while a phase-owned dictionary or type row alone never releases the claim; for source_root_v1 that handoff transaction inserts source_scope, source_build, and source_build_generation before deleting the claim; independent bounded cleanup removes residual claims only after their generation is completed or strictly superseded, including a crash after identity seal but before consumer handoff and a crashed source_root_v1 pre-mapping claim whose generation has no source_build_generation row, and only then may source-build cleanup delete a mapping that does exist; finally delete an unblocked identity, parent edges, descriptors, owner pages, and allocation child-first; owner-prefixed pages are never shared across allocations",
  "encode the exact absolute POSIX source-root segment tuple; two-pass stream the arbitrary-total-length frame through iter_source_root_payload, source_root_digest, and canonical_value_digest_parts without materializing the complete value; persist the payload through the registered source_root_v1 canonical digest wrapper, recompute source_root_sha256, and byte-compare the complete domain and payload on every digest conflict; readers first consume the complete immutable canonical page stream through validate_source_root_parts and require an exact EOF receipt before replay may expose a component; decode_source_root is a convenience oracle only",
  "split the source-root-relative nested gallery directory into exact UTF-8 path segments; reject empty, dot, separator-containing, NUL-containing, or over-255-byte segments; frame every segment without normalization; two-pass stream the arbitrary-total-length frame through iter_source_relative_locator_payload and canonical_value_digest_parts under source_relative_locator_v1 without materializing the complete value; byte-compare on digest conflict; and require source_gallery_name to equal the exact final segment",
  "resolve a gallery path only by joining gallery_identity.locator_sha256 through source_locator_identity and canonical_value_identity; first consume the complete immutable canonical page stream through validate_source_relative_locator_parts to verify framing, strict UTF-8, digest-bound receipt, and exact EOF without exposing a component; then replay the same sealed page root into a provisional bounded consumer whose effects commit only after replay completion; verify the digest domain and final-segment name, and never reconstruct identity from a leaf name alone; decode_source_relative_locator is a convenience oracle only",
