canonical_tree_rule = "leaf records are strictly ordered by file_no, tag position, exact unsigned DIRECTORY name bytes, or METADATA byte offset; FILE file_no and TAG position are exact zero-based contiguous canonical ordinals across the whole component, DIRECTORY names come from os.fsencode with surrogateescape round-trip and use the exact opaque POSIX 1..255-byte direct-child dirent domain (NUL, slash, dot, and dot-dot forbidden; backslash and invalid UTF-8 allowed), and lstat without symlink following classifies REGULAR/DIRECTORY/SYMLINK/OTHER; DIRECTORY canonical_ordinal equals the zero-based sorted position and duplicate names are forbidden; for a nonempty component every leaf before the final leaf is full and the final leaf has 1..capacity entries including a full final leaf, so an exact capacity multiple never appends an empty page; FILE and TAG leaf capacity is 256, DIRECTORY leaf capacity is 192 so the 311-byte maximum record cannot exceed the 65536-byte page limit, METADATA leaf capacity is one deterministic 1..32768-byte chunk whose offset begins at zero and is exactly contiguous, every nonfinal METADATA chunk is exactly 32768 bytes and the final is 1..32768, branch pages have analogous ordered groups with capacity 256 and the root has minimal height with no unary wrapper; a single empty level-zero leaf exists if and only if a FILE, TAG, or DIRECTORY component has zero items, while the fixed-prefix METADATA stream is never empty; branch child digests are unique within a parent; branch count is the exact sum of child record counts or METADATA byte lengths; depth is at most eight and every portable identifier, size, record count, byte offset, and aggregate count is checked in unbounded host arithmetic then required to be at most signed-int63 without wrap, device/inode preserve full unsigned u64 raw bytes, and modified/changed nanoseconds preserve signed i64 two's-complement bytes"
materialization_rule = "decode every page exactly and materialize its single gallery_observation_page_descriptor row plus an optional gallery_observation_page_key_bounds row; FILE/TAG boundaries are exact u64be(file_no or position), DIRECTORY boundaries are exact opaque name bytes, METADATA boundaries are exact u64be(byte_offset), the bounds row is absent if and only if the page is the unique empty FILE/TAG/DIRECTORY tree leaf, and otherwise its first_key and last_key derive recursively from exact decoded records or child bounds and satisfy unsigned bytewise first_key less than or equal to last_key; adjacent METADATA leaves require the next offset to equal the previous offset plus the exact previous chunk length rather than only comparing bounds; for every branch page also materialize one gallery_observation_page_child row per child position with the exact child digest; in each bounded leaf write transaction require exact equality between every FILE record and the authoritative file_name_identity row after deriving file_role from exact name_bytes, plus content_blob, write the observation-file anchor, its exact zero-based contiguous file_no and file_sha256 facts, seal that family last, then write the gallery_observation_file_filesystem family seal-last; for every TAG record require the authoritative tag_term row plus its canonical tag-value payload, then write gallery_observation_tag; advance only receipted exact counters; establish an independent durable exact merge-join over canonical name bytes between every DIRECTORY REGULAR record and exactly one FILE record by exact name/file_key, size_bytes, device, inode, modified_ns, and changed_ns, require no FILE absent from DIRECTORY, and require every nonregular DIRECTORY record to have no FILE record; DIRECTORY leaf records are the sole row-level authority for nonregular exact direct-child facts while gallery_observation_directory remains an aggregate audit receipt whose count is checked against receipted DIRECTORY coverage; derive every count, component, and boundary only from normalized page authority, and reject unknown tags, mixed components, duplicate positions, count mismatch, cross-component mismatch, normalized-row mismatch, boundary mismatch, truncation, trailing bytes, or a noncanonical page/tree"
collision_obligation = "page_sha256 is raw SHA-256 of the exact already-domain-prefixed page_bytes frame; on an existing digest compare all page_bytes byte-for-byte before reuse; any payload or decoded descriptor mismatch performs zero durable writes"
seal_obligation = "gallery_observation_page_descriptor_seal reverse-references the descriptor anchor, raw immutable page payload, component, level, and subtree-count fact, and all semantic page readers require that descriptor seal; all observation children may reference gallery_observation_allocation while staged, but readers and source_build_gallery require the final gallery_observation seal inserted last after joining root page descriptors and proving exactly one METADATA, one FILE, one TAG, and one DIRECTORY gallery_observation_tree_root, complete canonical page-tree validation, exact receipted leaf-to-normalized-row coverage, completed FILE/DIRECTORY merge-join equality, root counts obtained only from page descriptors, and exact observation descriptor equality; final seal validates only bounded scalar checkpoints and never rescans a giant child relation"
cleanup_rule = "every bounded page insert or reuse transaction atomically inserts gallery_observation_allocation_page for the staging allocation, and final seal advances only from durable association receipts; observation cleanup removes those associations child-first; a GALLERY_OBSERVATION_PAGE sweep runs only behind the outer maintenance gate that excludes concurrent page association inserts, requires zero allocation associations, zero tree roots, and zero incoming child edges, deletes outgoing parent edges, then bounds seal, facts, and anchor, then descriptor seal, descriptor facts, raw page payload, and descriptor anchor in exact child-first order, skips FK-blocked rows, and repeats parent-level-first until convergence because every branch edge strictly decreases level"
