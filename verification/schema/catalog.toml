[analysis_candidate_contract]
content_relation = "analysis_content_owner_candidate"
gid_relation = "analysis_gid_candidate"
gallery_relation = "gallery_identity"
priority_attribute = "priority_key"
candidate_digest_attribute = "candidate_sha256"
stable_tie_break_attributes = ["scope_key", "locator_sha256"]
encoding_version = 1
framing = "u32be(encoding_version) || framed(nonunique policy comparator prefix fields)"
runtime_obligation = "construct every content and GID priority_key solely as a potentially nonunique comparator prefix from immutable snapshot facts and the registered policy encoder; obtain the final globally unique deterministic total order only by joining gallery_identity and ordering by priority_key, exact BINARY(32) scope_key, then exact BINARY(32) locator_sha256; keep candidate_sha256 audit-only; and reject encoding gallery_id or the unique gallery location into priority_key, incumbent state, leaf name, allocation order, collation, truncation, or caller bytes as comparator inputs"

[analysis_run_contract]
relation = "analysis_run"
natural_key = ["build_id", "policy_id"]
manifest_attribute = "input_manifest_sha256"
write_obligation = "derive input_manifest_sha256 deterministically from the sealed source_build_manifest and exact analysis_policy; create at most one analysis_id for (build_id, policy_id); and resume every retry against that same durable row"
attempt_rule = "execution attempts are operational history in a separate relation and never participate in the semantic analysis_run candidate key"

[long_value_storage_contract]
canonical_reference_relation = "canonical_value_identity"
canonical_reference_attribute = "value_sha256"
