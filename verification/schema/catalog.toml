runtime_obligation = "never authorize a seal, checkpoint, batch replay, READY revision, or head transition from any audit digest or checksum; for every bounded batch, derive input from the immutable snapshot and server-owned cursor, recompute the exact row projection, compare every materialized field, and in the same fenced transaction insert the immutable receipt and compare-and-swap generation/checkpoint; batch_key is only an opaque attempt/idempotency token and never semantic authority; insert an immutable component seal only after component-specific full-evaluator equality in that same transaction; before catalog head CAS, compare the exact immutable revision child projection and count rather than trusting a publication digest"
ready_obligation = "READY validation is bounded to exact registry, active-head, immutable receipt, and seal-marker consistency plus writer-hook name/version presence; it never scans the full corpus and never claims that an empty-database schema check enforces future high-cardinality writes"

