  "join every content_sha256 through canonical_value_identity, stream-validate the effective_content_v1 digest domain, declared file_count, unsigned-bytewise order, multiplicity, exact framed preimage, and exact EOF before exposing authority, and never use an unverified or non-injective grouping checksum as content identity",
  "construct the payload only from one COMPLETED analysis policy natural tuple and its fully sealed resolved snapshot; join gallery_id surrogates through gallery_identity.gallery_key; require every gallery entry to carry its exact observation identity, positive GID, and an explicit content_present byte where zero encodes an empty or metadata-only gallery and is distinct from every 32-byte digest; include every resolved spam decision as the exact occurrence_count, artist_count, maximum_gallery_artist_count, and derived excluded_flag fields without granting identity authority to evidence_sha256; include every content owner and GID winner exactly once as its group key plus stable winner gallery_key without granting identity authority to decision_sha256; require owner/winner gallery keys to be members of the same snapshot; validate the three declared aggregate counts against the encoded snapshot; obtain exact section counts, payload_byte_count, order, membership, and aggregate evidence in a bounded preflight/keyset receipt, then replay through iter_source_snapshot_manifest_payload_rows_ordered and source_snapshot_manifest_digest_ordered into canonical_value_digest_parts without materializing the snapshot; recompute the canonical digest and byte-compare the complete payload on collision",
  "derive input_manifest_sha256 deterministically from the sealed source_build_manifest and exact analysis_policy; create at most one analysis_id for (build_id, policy_id); and resume every retry against that same durable row",
  "execution attempts are operational history in a separate relation and never participate in the semantic analysis_run candidate key",
  "construct every content and GID priority_key solely as a potentially nonunique comparator prefix from immutable snapshot facts and the registered policy encoder; obtain the final globally unique deterministic total order only by joining gallery_identity and ordering by priority_key, exact BINARY(32) scope_key, then exact BINARY(32) locator_sha256; keep candidate_sha256 audit-only; and reject encoding gallery_id or the unique gallery location into priority_key, incumbent state, leaf name, allocation order, collation, truncation, or caller bytes as comparator inputs",
  "REBUILD iff both old and new rows exist and artifact_semantics_sha256 differs; artifact_name never participates in byte-semantic equality",
