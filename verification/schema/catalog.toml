rationale = "Arbitrary canonical payloads, including publication summary/language and artifact storage locator bytes, are streamed through deterministic bounded chunks rather than monolithic database values. Every remaining direct payload has an explicit cross-backend bound and may never become a logical or physical key/index without a separate identity design."

