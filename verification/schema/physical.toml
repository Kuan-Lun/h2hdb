semantic_obligation_id = "catalog.role-derivation.v1"

[[runtime_obligation_binding]]
path = "gallery_observation_identity_contract.write_obligation"
text = "after a complete scan, construct the exact bounded immutable descriptor from exact METADATA/FILE/TAG/DIRECTORY page-tree roots and descriptor-derived counts; METADATA count is the exact canonical metadata stream byte length while the other counts are exact record cardinalities; exclude metadata_fingerprint, scan_observation_sha256, metadata_sha256, raw_content_sha256, and directory_observation_sha256 because they are redundant audit or provisional digests and never semantic authority; require FILE and DIRECTORY exact merge-join coverage, every root/count to match a completely decoded canonical tree, and the streamed METADATA bytes to equal the normalized metadata/scan/page-count facts; persist the descriptor under the registered gallery_observation_v1 canonical digest policy, recompute observation_identity_sha256, byte-compare the full preimage on collision, and insert the final gallery_observation seal last"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "gallery_observation_identity_contract.reuse_obligation"
text = "source_build_gallery may reuse an observation_id only after joining the final gallery_observation seal and revalidating the complete current gallery against its exact canonical descriptor and collision-checked METADATA/FILE/TAG/DIRECTORY page trees; allocation, metadata_fingerprint, scan_observation_sha256, directory_observation_sha256, tree_observation_sha256, page roots, timestamps, or row counts alone never authorize reuse"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "effective_content_contract.write_obligation"
text = "production prepares effective content only as a database-owned private typed EffectiveContentPreparation, never as caller authority: from one immutable SEALED source_build snapshot and immutable COMPLETE analysis snapshot, stream only resolved non-excluded CONTENT file_sha256 values by an unsigned-bytewise keyset query into a deterministic external spool and typed receipt outside every canonical page transaction; exclude METADATA and resolved spam, preserve duplicate digests, and bind the receipt to the exact sealed build identity, sealed analysis identity, live ingest generation, file_count, byte_count, content_sha256, and private spool identity, while no public API accepts digest, count, sequence, or receipt authority; stream the exact permutation-invariant but multiplicity-sensitive frame through iter_effective_content_payload_ordered, effective_content_digest_ordered, and canonical_value_digest_parts without materializing the full sequence; bounded canonical page transactions validate and CAS the live-generation canonical_value_upload claim and resume only from database receipts; final candidate handoff runs in one transaction, locks and validates the private typed receipt, immutable SEALED build and COMPLETE analysis canonical identities, sealed canonical_value_identity, and the same current live-generation claim, writes the candidate, then deletes that claim; immutable snapshots permit deterministic spool and receipt reconstruction after response loss; every digest conflict recomputes content_sha256 and byte-compares the full preimage; no audit digest, caller-supplied digest/count/sequence/receipt, or unsealed snapshot authorizes write, resume, or handoff"
