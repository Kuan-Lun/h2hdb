[[runtime_obligation_binding]]
path = "canonical_digest_contract.write_obligation"
text = "resolve an exact registered stable ASCII digest_domain and obtain declared byte_count before hashing because the canonical wrapper places u64be(payload_length) before payload; the exact preimage deterministically yields its SHA-256 digest, while digest-to-preimage is only a stored relation FD established by UNIQUE, full-preimage byte comparison, rejection on mismatch, and the immutable final identity seal under the collision-checked stored-identity rule; if upstream length is unknown, pass zero uses an environment-owned durable bounded-I/O spool to count bytes; pass one frames declared byte_count, streams SHA-256 while verifying the consumed count and exact EOF, and rejects mismatch before allocation; pass two replays from offset zero into deterministic owner-scoped 32768-byte leaf chunks and fanout-256 pages in bounded transactions under canonical_value_allocation; byte-compare every idempotent page conflict; insert canonical_value_identity last only after exact tree validation; a crash may replay from zero in O(n) time but no database transaction or bind is unbounded"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "canonical_digest_contract.read_obligation"
text = "join through final canonical_value_identity and stream its owner-scoped page tree in exact offset order; recompute the domain-separated digest and exact byte_count incrementally, reject missing, duplicate, reordered, truncated, trailing, cross-owner, or noncanonical pages, and never reconstruct or compare identity from truncated or collation-folded text"
semantic_obligation_id = "catalog.canonical-reference-domains.v1"

[[runtime_obligation_binding]]
path = "canonical_value_page_contract.collision_obligation"
text = "page_sha256 is raw SHA-256 of the exact owner-prefixed page frame; on every existing digest compare page bytes byte-for-byte and reject cross-owner reuse; any payload, decoded-coordinate, or subtree-count mismatch performs zero durable writes"
semantic_obligation_id = "catalog.identity-codecs.v1"

