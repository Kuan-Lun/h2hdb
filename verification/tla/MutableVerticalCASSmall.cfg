\* Required finite safety profile.  TLC success is exhaustive only for these
\* exact two owner/stage keys, two batch keys, row counts zero/one, and the
\* selected generation/count bounds.  It is not an unbounded proof and does
\* not establish SQL, transaction, isolation, backend refinement, or liveness.
SPECIFICATION Spec

\* Safety-preserving fingerprint quotient for this invariant-only profile.
\* It must not be used as liveness or event-reachability evidence.
VIEW SafetyView

CONSTANTS
    Owners = {owner1}
    Stages = {stage1, stage2}
    BatchKeys = {batch1, batch2}
    NoBatchKey = noBatchKey
    RowCounts = {0, 1}
    PageLimits = {1, 2}
    DefaultPageLimit = 1
    MaxGeneration = 2
    MaxCount = 1
    MaxPageLimit = 2

INVARIANTS
    TypeOK
    VisibleTuplesAreTotal
    CheckpointEqualsLatestReceiptPoststate
    ReceiptGenerationsAreUnique
    ReceiptEquations
    AtomicCommitHasNoPublishedHalf
    ReplayIsObservational
    ReplayUsesStoredPageLimit
    CrashPreservesDurableState
    CrashLeavesNoTornTuple
    CleanupIsChildFirst
