text = "before a source build seals, require the provider-private typed discovery plan to have uploaded one complete source_build_expected_gallery sequence ordered by exact unsigned locator_sha256 bytes with positions zero through gallery_count minus one and no duplicate gallery, require source_build.scope_key to equal every joined gallery_identity.scope_key in both expected membership and source_build_gallery, verify every locator digest and exact framed nested locator payload, and reject cross-scope or extra membership through the source_build_gallery foreign key; only the empty terminal operational assembly receipt after an independent exact expected-versus-linked merge and gallery_observation_stat accumulation may insert build_manifest and CAS the build OPEN to SEALED, while discovery/tree/manifest digests remain audit-only"
