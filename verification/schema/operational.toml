[preparation_identity_contract]
preparation_relation = "operational_preparation"
policy_relation = "operational_policy"
deletion_generation_relation = "deletion_request_generation"
natural_key = ["build_id", "deletion_request_generation", "operational_policy_id"]
rule = "exact retry under one policy and one FK-backed deletion-request generation resumes; policy or authoritative deletion generation change creates a distinct immutable preparation, and publication accepts only the preparation whose generation still equals the singleton deletion-generation head"

[revision_allocator_contract]
relation = "revision_allocator"
streams = ["SOURCE", "CATALOG"]
current_state_rule = "next_revision_is_in_one_through_int63_maximum_with_maximum_reserved_as_the_exhausted_sentinel"
allocation_rule = "under_row_lock_or_exact_next_revision_cas_return_current_next_revision_then_increment_it_by_exactly_one_in_one_transaction; the exhausted sentinel fails closed without mutation"
publication_rule = "a published revision belongs to the matching stream and is_strictly_less_than_that_streams_current_next_revision"

[gallery_staging_contract]
version = 1
identity_allocator_relation = "identity_allocator"
identity_streams = ["GALLERY", "TAG"]
observation_allocator_relation = "gallery_observation_allocator"
staging_relation = "gallery_observation_staging"
claim_relation = "gallery_observation_staging_claim"
checkpoint_relation = "gallery_observation_staging_checkpoint"
request_relation = "gallery_observation_staging_request"
request_chunk_relation = "gallery_observation_staging_request_chunk"
request_predecessor_relation = "gallery_observation_staging_request_predecessor"
request_owner_relation = "gallery_observation_staging_request_owner"
page_request_relation = "gallery_observation_staging_page_request"
request_page_relation = "gallery_observation_staging_request_page"
receipt_relation = "gallery_observation_staging_receipt"
frontier_relation = "gallery_observation_staging_frontier"
match_checkpoint_relation = "gallery_observation_staging_match_checkpoint"
metadata_parser_relation = "gallery_observation_staging_metadata_parser"
canonical_upload_relation = "canonical_value_upload"
components = ["FILE", "TAG", "DIRECTORY", "METADATA"]
file_leaf_rows = 256
tag_leaf_rows = 256
directory_leaf_rows = 192
metadata_leaf_bytes = 32768
branch_fanout = 256
page_bytes_maximum = 65536
max_level = 8
portable_id_maximum = 9223372036854775807
allocator_rule = "under a row lock or exact current-next-ID CAS, return the current next ID only when it is in one through 2^63-2 and advance next ID by exactly one; 2^63-1 is the reserved exhausted sentinel and fails closed without mutation, and writers never use MAX-plus-one, auto-increment, deletion reuse, or backend-specific allocation"
observation_allocator_rule = "create the gallery-local allocator with next_observation_id one in the same transaction that allocates gallery identity; every observation allocation locks or CAS-compares exact next_observation_id and uses the same portable exhausted-sentinel rule without a redundant generation"
begin_rule = "one transaction locks and advances the gallery observation allocator, inserts gallery_observation_allocation, the unique immutable build_id gallery_id staging header, its claim bound to a live ingest generation, four level-zero checkpoints with processed_byte_count zero, match checkpoint, and bounded metadata parser state; rollback leaves none, while a lost successful response resolves the unique build_id gallery_id row and returns the same staging and observation identities without allocating again"
takeover_rule = "the immutable staging header stores no owner token; only a caller holding the exact current ingest coordination head, owner and unexpired lease may replace staging_claim.ingest_generation and increment claim_generation exactly once, and every COMMIT or REPLAY separately locks and matches that current head, owner, lease, ingest generation, and claim generation"
batch_rule = "one server-derived request_sha256 plus the complete bounded domain-separated request preimage split into deterministic at-most-32768-byte chunks is the sole request identity; every digest conflict byte-compares all chunks and exact EOF, never a BLOB prefix. The frame binds staging, live ingest and claim fences, component, level, exact checkpoint cursor and processed_byte_count, one-to-one predecessor, exact page bytes and digest, and terminal intent. REPLAY first locks and requires the exact current ingest head, matching owner, unexpired lease and claim plus the byte-identical latest request and unchanged decoded poststate including byte count, then returns the stored receipt with zero writes. Otherwise NEW requires the same outer fence, OPEN and exact current cursor/byte-count/predecessor, recomputes page bytes, digest, descriptor, bounds and children, inserts the allocation_page association and exact normalized facts, performs base-256 carry, then atomically replaces the latest receipt and advances cursor/byte-count or completes; same digest with different bytes, a forked predecessor, same prestate with changed body, stale or non-head owner, expired lease, caller cursor skip, overflow, and every other state fail closed"
request_subtype_rule = "every request identity has exactly one durable staging owner, one through three exact consecutive chunks whose nonfinal chunks are 32768 bytes, and exactly one PAGE or MATCH descriptor. Runtime reconstructs the complete preimage, validates its domain, hash, and byte limit, re-encodes the locked descriptor, current outer fences, optional one-to-one predecessor, terminal intent, and exact stored page bytes, and requires byte-for-byte equality; a digest-valid body with mismatched decoded fields is rejected"
predecessor_rule = "a predecessor edge is inserted only after locking both request_owner rows and proving both request identities belong to the same staging_id, the exact request frame names that prior digest, and the prior request has no successor; cross-staging predecessor edges fail closed, and cleanup deletes only outgoing edges owned by the selected staging while a corrupt cross-owner incoming edge is a blocker"
abandoned_retry_rule = "the build_id gallery_id alternate key and gallery observation allocation remain unique; retry resumes the same allocated staging identity, or bounded child-first cleanup removes the abandoned staging children and allocation before a new staging attempt is allocated"
page_rule = "FILE and TAG leaves carry exactly 256 records when nonterminal, DIRECTORY carries exactly 192, and METADATA carries exactly one contiguous chunk of 32768 bytes when nonterminal; a terminal leaf may be full, partial terminal is nonempty except the unique zero-length whole-tree leaf, exact multiples create no extra empty leaf, branch fanout is 256, every decoded exact page frame is at most 65536 bytes, and checked cursor advance is record count for FILE TAG DIRECTORY or byte count for METADATA"
ordering_rule = "FILE and TAG page records, DIRECTORY canonical ordinals, and DIRECTORY exact name-byte order are globally zero-based contiguous or strictly canonical as their codec requires; METADATA offsets start at zero and each next offset equals prior offset plus exact chunk length. Every bounded commit joins the prior exact request page and descriptor or proves it is first, so adjacent checks inductively establish global order with no seal-time leaf scan and no page-derived facts repeated in checkpoint relations"
normalized_fact_rule = "each level-zero FILE TAG or DIRECTORY commit decodes the exact page and inserts or verifies byte-equal normalized file-name, content size, observation file, tag, and directory facts before checkpoint advance in the same transaction. FILE records use the exact zero-based contiguous ordinal sequence 0..n-1: insert or exact-compare file-name anchor, name-bytes fact, role fact, and seal; then observation-file anchor, ordinal fact, digest fact, and seal; then filesystem anchor, device, inode, modified-ns, changed-ns, and seal, always writing each seal last and reading only sealed views. TAG records insert or verify tag anchor, natural identity, and seal before association. Every FILE record obtains database-verified FileContentReceipt size_bytes and checked-adds it to processed_byte_count; every other component keeps both receipt byte-count fields and checkpoint processed_byte_count exactly zero. DIRECTORY terminal inserts its anchor and both aggregate members before its PK-only seal. Each METADATA chunk runs the concrete bounded incremental framing and strict-UTF-8 parser from durable prior state; terminal requires DONE, empty carry/tail, positive gid and scan version, no truncation or trailing bytes, and exact equality to bounded metadata and page-count rows"
file_directory_rule = "after FILE and DIRECTORY complete, one durable checkpoint traverses FILE canonically in batches of at most 256; for every unique FILE file_key it resolves exact name bytes and performs a bounded DIRECTORY-tree exact-key lookup of depth at most eight, requiring one REGULAR record with byte-equal size and raw device inode modified and changed values. COMPLETE requires matched_count equals FILE count equals DIRECTORY regular_count; this handles FILE name order such as z then a without an invalid linear merge"
frontier_rule = "server-owned base-256 carry lazily creates internal checkpoints at levels one through eight and retains at most 255 pending request positions at each level for each of four components, at most 8160 rows per staging; branch commits recompute ordered child descriptors and checked subtree sums, atomically write page edges, allocation_page association, frontier mutation and receipt, and exact replay is zero-write. Finalization never writes a unary root wrapper: one sole child is reused directly as root; a final one-through-256-child branch is written only as a nonroot FLUSH_CARRY when an earlier same-level page exists, while a new root branch requires two-through-256 children. Completion writes at most eight final pages per component, after which bounded checkpoint and latest-request joins identify one durable minimal-height root"
directory_rule = "DIRECTORY leaf entries are sorted by exact opaque POSIX dirent name bytes with duplicate names rejected; names have length one through 255, contain no NUL or slash, and are not dot or dot-dot; encode u64be zero-based canonical ordinal, u32be name-byte length plus exact name bytes, u64be size, device, inode, modified-ns, changed-ns, and u32be file type; an audit directory digest cannot authorize observation reuse and nonregular children are absent from FILE"
seal_rule = "under the exact current ingest head, matching outer owner, unexpired lease and claim fence, inspect only bounded checkpoints, latest request receipts, parser state, frontier and root descriptors; require four COMPLETE streams with exact counts and roots, metadata DONE and scalar congruence, FILE processed_byte_count backed by its empty terminal receipt, non-FILE processed_byte_count zero, and FILE-to-DIRECTORY verification COMPLETE. Insert or exact-compare the scan anchor and its digest, version, and source-file-count members, then insert the PK-only scan seal last. Collision-check the canonical observation descriptor, then atomically insert gallery_observation, its stat anchor and exact terminal FILE-count and byte-count members, the PK-only stat seal last, and source_build_gallery last and mark SEALED, or require the byte-equal sealed observation-stat view before linking it and mark REUSED; a REUSED fresh allocation remains eligible for bounded child-first cleanup after that other durable link"
visibility_rule = "readers join only final source_build_gallery and gallery_observation rows; no OPEN ABANDONED or partially allocated staging row is visible as a source-build gallery"
canonical_upload_rule = "canonical_value_upload has sole key generation plus value_sha256. The source_root_v1 bootstrap domain may allocate and claim under the exact current ingest head, live owner and lease, and shared maintenance slot before a source_build_generation mapping exists; every non-bootstrap allocation and claim requires the mapping first. Every page and identity seal locks and rechecks head, owner, lease, claim, and shared maintenance authority while CANONICAL_VALUE cleanup holds exclusive ownership for its whole cycle; takeover resumes only after exact domain, byte_count and deterministic page conflict comparison. Identity seal byte-validates but retains the claim. The first retention-blocking external consumer and deletion of only the callers claim commit atomically under the same fence; a phase-owned dictionary or type row alone never releases the claim. For source_root_v1 that handoff transaction inserts source_scope, source_build, and source_build_generation before deleting the claim. A crash before consumer handoff leaves the claim durable, and residual claims are independently deleted only for completed or strictly superseded generations"
durable_parser_phases = ["PREFIX", "VERSION", "GID", "TITLE_TAG", "TITLE_LENGTH", "TITLE", "COMMENT_TAG", "COMMENT_LENGTH", "COMMENT", "UPLOAD_ACCOUNT_TAG", "UPLOAD_ACCOUNT_LENGTH", "UPLOAD_ACCOUNT", "UPLOAD_TIME", "DOWNLOAD_TIME", "MODIFIED_TIME", "SCAN_VERSION", "SOURCE_FILE_COUNT", "PAGE_COUNT_PRESENCE", "PAGE_COUNT", "DONE"]
runtime_parser_phase_rule = "only the in-process decoder aliases TITLE_TEXT, COMMENT_TEXT, ACCOUNT_TAG, ACCOUNT_LENGTH, and ACCOUNT_TEXT map respectively to the persisted TITLE, COMMENT, UPLOAD_ACCOUNT_TAG, UPLOAD_ACCOUNT_LENGTH, and UPLOAD_ACCOUNT states; database rows and public validators accept only the exact ordered durable_parser_phases registry, with ASCII case-sensitive equality and no LENGTH, runtime alias, unknown value, trimming, or normalization"
directory_audit_framing = "SHA256(ascii('h2hdb-vnext-directory-observation-audit-v1\\0') || raw32(DIRECTORY root_page_sha256) || u64be(item_count_int63))"
metadata_audit_framing = "SHA256(ascii('h2hdb-vnext-metadata-observation-audit-v1\\0') || raw32(METADATA root_page_sha256) || u64be(byte_count_int63))"
scan_audit_framing = "SHA256(ascii('h2hdb-vnext-scan-observation-audit-v1\\0') || raw32(FILE root_page_sha256) || u64be(FILE item_count_int63) || raw32(TAG root_page_sha256) || u64be(TAG item_count_int63) || raw32(METADATA root_page_sha256) || u64be(METADATA byte_count_int63) || raw32(DIRECTORY root_page_sha256) || u64be(DIRECTORY item_count_int63))"
audit_authority_rule = "gallery_directory_audit_digest, gallery_metadata_audit_digest, and gallery_scan_audit_digest validate these exact fixed frames and component order for diagnostics only; directory_observation_sha256, metadata_fingerprint, and scan_observation_sha256 never authorize observation identity, reuse, parser completion, source membership, sealing, or response-loss progress, all of which require typed roots, exact persisted counters, receipts, checkpoints, and canonical identity"

