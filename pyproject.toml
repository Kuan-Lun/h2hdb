[build-system]
requires = ["hatchling>=1.32.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "h2hdb"
version = "0.23.0.4"
description = "Database, coordination, and revision catalog core for H2HDB"
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = { text = "GNU Affero General Public License v3" }
dependencies = [
    "mysql-connector-python>=26.7.0,<27.0.0",
    "pydantic>=2.13.4,<3.0.0",
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "pymarkdownlnt>=0.9.39",
    "pytest>=9.1.1",
    "hypothesis>=6.165.10,<7.0.0",
    "testcontainers>=4.15.0",
    "build>=1.5.0",
    "packaging>=26.3",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/h2hdb"
Source = "https://github.com/Kuan-Lun/h2hdb"
Tracker = "https://github.com/Kuan-Lun/h2hdb/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/h2hdb"]

[tool.black]
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E203/E226 conflict with Black's formatting choices; E501 is redundant with
# Black's line-length enforcement and would otherwise fire on long inline SQL.
extend-ignore = ["E203", "E226", "E501"]
