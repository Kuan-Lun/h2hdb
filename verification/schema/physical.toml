[[runtime_obligation_binding]]
path = "publication_atomic_contract.runtime_obligation"
text = "in one fenced publication protocol, validate the exact selected publication child set and publication_count; stream the exact strict-UTF-8 METADATA comment bytes without normalization or trimming through catalog_summary_digest_parts into catalog_summary_utf8_v1; select catalog_language_utf8_v1 from the nonempty exact tag-value bytes at the minimum gallery tag position whose namespace is the case-sensitive UTF-8 bytes language, or use the exact ASCII bytes und when absent, without normalization or trimming, and stream through catalog_language_digest_parts; build both canonical trees under the live generation upload claim; validate all six exactly-once artifact input component kinds and exact canonical payload bytes, artifact old/new delta classification, prepared artifact byte digest/size/member plan/exact ZIP comment and bounded protection token; validate the complete artifact_locator_bytes_v1 frame is at most 4096 bytes before exposing or storing any segment, stream it through iter_artifact_locator_payload and canonical_value_digest_parts exactly as u32be(codec_version=1) || u32be(segment_count) || repeated(u32be(segment_utf8_length) || strict_utf8_segment), rejecting empty/dot/NUL/separator segments, and store its canonical locator reference; readers validate exact EOF within the same 4096-byte cap before exposing a segment; the monolithic digest helpers are bounded convenience oracles and never the production write path for arbitrary summary/language bytes; compare every immutable revision child field and digest/count before making READY; publish only by compare-and-swap from the candidate-pinned base head to the reserved revision, and never expose a partial revision or perform an unbounded bind"
