[file_identity_contract]
relation = "file_name_identity"
key_attribute = "file_key"
name_attribute = "name_bytes"
role_attribute = "file_role"
algorithm_version = 1
framing = "ascii('h2hdb-vnext-file-key\\0') || u32be(algorithm_version) || u32be(name_length) || name_bytes"
collision_model = "collision_checked_stored_identity"
role_classifier_version = 1
metadata_name = "galleryinfo.txt"
write_obligation = "derive file_key deterministically by SHA-256 over the exact versioned framed name_bytes, reject caller-supplied keys, and establish digest-to-name only as a stored FD through UNIQUE, byte-compare the full name_bytes, rejection on mismatch, and immutable identity use after an observation seal under the collision-checked stored-identity rule; classify file_role as METADATA if and only if name_bytes is the exact ASCII byte sequence galleryinfo.txt; every other valid direct-child dirent is CONTENT; persist anchor, exact unique name bytes, and derived role before inserting the PK-only file-name seal last"
read_obligation = "read only the sealed file-name projection, recompute file_key and file_role from exact name_bytes on READY validation, and reject unknown algorithm/classifier versions, Unicode normalization, case folding, trimming, or collation-based filename identity"

[gallery_observation_identity_contract]
relation = "gallery_observation"
gallery_attribute = "gallery_id"
identifier_attribute = "observation_id"
digest_attribute = "observation_identity_sha256"
canonical_value_relation = "canonical_value_identity"
canonical_digest_attribute = "value_sha256"
digest_domain = "gallery_observation_v1"
encoding_version = 1
framing = "u32be(encoding_version) || raw32(METADATA root_page_sha256) || u64be(METADATA exact_byte_count) || raw32(FILE root_page_sha256) || u64be(FILE item_count) || raw32(TAG root_page_sha256) || u64be(TAG item_count) || raw32(DIRECTORY root_page_sha256) || u64be(DIRECTORY item_count)"
write_obligation = "after a complete scan, construct the exact bounded immutable descriptor from exact METADATA/FILE/TAG/DIRECTORY page-tree roots and descriptor-derived counts; METADATA count is the exact canonical metadata stream byte length while the other counts are exact record cardinalities; exclude metadata_fingerprint, scan_observation_sha256, metadata_sha256, raw_content_sha256, and directory_observation_sha256 because they are redundant audit or provisional digests and never semantic authority; require FILE and DIRECTORY exact merge-join coverage, every root/count to match a completely decoded canonical tree, and the streamed METADATA bytes to equal the normalized metadata/scan/page-count facts; persist the descriptor under the registered gallery_observation_v1 canonical digest policy, recompute observation_identity_sha256, byte-compare the full preimage on collision, and insert the final gallery_observation seal last"
reuse_obligation = "source_build_gallery may reuse an observation_id only after joining the final gallery_observation seal and revalidating the complete current gallery against its exact canonical descriptor and collision-checked METADATA/FILE/TAG/DIRECTORY page trees; allocation, metadata_fingerprint, scan_observation_sha256, directory_observation_sha256, tree_observation_sha256, page roots, timestamps, or row counts alone never authorize reuse"

