rule = "every staged leaf branch and root page commit atomically inserts its allocation_page association. Under the exclusive maintenance fence, one bounded transaction locks one page and rechecks no allocation association, final root, or incoming child reference, deletes only at most 256 outgoing parent_sha256 edges, then bounds, descriptor, and page; it never follows or deletes an incoming child_sha256 edge, and observation cleanup removes associations rather than global pages"

