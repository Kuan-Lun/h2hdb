  "page_sha256 is raw SHA-256 of the exact already-domain-prefixed page_bytes frame; on an existing digest compare all page_bytes byte-for-byte before reuse",
  "decode every page exactly and materialize its single gallery_observation_page_descriptor row plus an optional gallery_observation_page_key_bounds row; FILE/TAG boundaries are exact u64be(file_no or position), DIRECTORY boundaries are exact opaque name bytes, METADATA boundaries are exact u64be(byte_offset), the bounds row is absent if and only if the page is the unique empty FILE/TAG/DIRECTORY tree leaf, and otherwise its first_key and last_key derive recursively from exact decoded records or child bounds; adjacent METADATA leaves require the next offset to equal the previous offset plus the exact previous chunk length rather than only comparing bounds; for every branch page also materialize one gallery_observation_page_child row per child position with the exact child digest; in each bounded leaf write transaction require exact equality between every FILE record and file_name_identity plus content_blob plus gallery_observation_file plus gallery_observation_file_filesystem, and every TAG record and tag_term plus its canonical tag-value payload plus gallery_observation_tag, then advance only receipted exact counters; establish an independent durable exact merge-join over canonical name bytes between every DIRECTORY REGULAR record and exactly one FILE record by exact name/file_key, size_bytes, device, inode, modified_ns, and changed_ns, require no FILE absent from DIRECTORY, and require every nonregular DIRECTORY record to have no FILE record; DIRECTORY leaf records are the sole row-level authority for nonregular exact direct-child facts while gallery_observation_directory remains an aggregate audit receipt whose count is checked against receipted DIRECTORY coverage; derive every count, component, and boundary only from normalized page authority, and reject unknown tags, mixed components, duplicate positions, count mismatch, cross-component mismatch, normalized-row mismatch, boundary mismatch, truncation, trailing bytes, or a noncanonical page/tree",
  "all observation children may reference gallery_observation_allocation while staged, but readers and source_build_gallery require the final gallery_observation seal inserted last after joining root page descriptors and proving exactly one METADATA, one FILE, one TAG, and one DIRECTORY gallery_observation_tree_root, complete canonical page-tree validation, exact receipted leaf-to-normalized-row coverage, completed FILE/DIRECTORY merge-join equality, root counts obtained only from page descriptors, and exact observation descriptor equality; final seal validates only bounded scalar checkpoints and never rescans a giant child relation",
