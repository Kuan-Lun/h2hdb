  { determinant = ["catalog_occurrence_sha256"], dependent = ["revision", "publication_key", "gallery_id", "summary_sha256", "language_sha256", "modified_at", "source_title_sha256"] },
  { determinant = ["revision", "publication_key"], dependent = ["catalog_occurrence_sha256", "gallery_id", "summary_sha256", "language_sha256", "modified_at", "source_title_sha256"] },
]
projections = [
  { relation = "catalog_publication_occurrence_identity", attributes = ["catalog_occurrence_sha256", "revision", "publication_key"] },
  { relation = "catalog_publication_storage", attributes = ["catalog_occurrence_sha256", "gallery_id", "summary_sha256", "language_sha256", "modified_at", "source_title_sha256"] },
]
rationale = "Split one catalog occurrence into its collision-checked revision/publication identity and its complete physical gallery/scalar/title payload. The shared occurrence digest is a key of both projections, so the join is lossless and both revision-scoped occurrence dependencies are preserved; the separately declared gallery_id -> publication_key chain supplies the global dependency without repeating it in a base."

