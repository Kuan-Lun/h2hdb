[[runtime_obligation_binding]]
path = "effective_content_contract.read_obligation"
text = "join every content_sha256 through canonical_value_identity, stream-validate the effective_content_v1 digest domain, declared file_count, unsigned-bytewise order, multiplicity, exact framed preimage, and exact EOF before exposing authority, and never use an unverified or non-injective grouping checksum as content identity"
semantic_obligation_id = "catalog.canonical-reference-domains.v1"

[[runtime_obligation_binding]]
path = "source_snapshot_manifest_contract.write_obligation"
text = "construct the payload only from one OPEN snapshot-ready analysis whose exact policy natural tuple and all five immutable component seals freeze its fully resolved snapshot; component rows are immutable once the fifth seal exists even while canonical preparation runs; join gallery_id surrogates through gallery_identity.gallery_key; require every gallery entry to carry its exact observation identity, positive GID, and an explicit content_present byte where zero encodes an empty or metadata-only gallery and is distinct from every 32-byte digest; include every resolved spam decision as the exact occurrence_count, artist_count, maximum_gallery_artist_count, and derived excluded_flag fields without granting identity authority to evidence_sha256; include every content owner and GID winner exactly once as its group key plus stable winner gallery_key without granting identity authority to decision_sha256; require owner/winner gallery keys to be members of the same snapshot; validate the three declared aggregate counts against the encoded snapshot; obtain exact section counts, payload_byte_count, order, membership, and aggregate evidence in a bounded preflight/keyset receipt, then replay through iter_source_snapshot_manifest_payload_rows_ordered and source_snapshot_manifest_digest_ordered into canonical_value_digest_parts without materializing the snapshot; recompute the canonical digest and byte-compare the complete payload on collision"
