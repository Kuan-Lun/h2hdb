\* Manual/nightly finite profile.  This larger state space adds a second
\* staging/value and two leaf positions/parser units.  TLC success remains
\* bounded evidence, not an unbounded theorem or implementation refinement.
SPECIFICATION Spec

CONSTANTS
    Owners = {owner1, owner2}
    Stagings = {staging1, staging2}
    Headers = {header1, header2}
    RequestBytes = {requestBytes1, requestBytes2, requestBytes3}
    CommitRequestBytes = {requestBytes1, requestBytes2}
    RequestDigests = {requestDigest1, requestDigest2}
    Values = {sourceRootValue, value1, value2}
    SourceRootValue = sourceRootValue
    Components = {fileComponent, tagComponent, directoryComponent, metadataComponent}
    FileComponent = fileComponent
    TagComponent = tagComponent
    DirectoryComponent = directoryComponent
    MetadataComponent = metadataComponent
    NoOwner = noOwner
    NoHeader = noHeader
    NoValue = noValue
    NoObservation = noObservation
    NoReplayFingerprint = noReplayFingerprint
    SeedObservation = 0
    MaxTime = 2
    LeaseSpan = 1
    MaxOuterGeneration = 2
    MaxClaimGeneration = 2
    MaxObservation = 2
    MaxPagePosition = 1
    MetadataUnits = 2

INVARIANTS
    TypeOK
    ImmutableStagingAllocationAndHeader
    ObservationAllocationIsMonotonicAndUnique
    ExactPageSlotIdentity
    ExactRequestBytesNotDigestAlone
    ComponentRootsHaveMinimalHeight
    StaleOwnerCannotMutateOrReplay
    ReplayIsObservational
    ResponseLossLeavesCommitDurable
    ChangedRequestIsRejected
    SealOnlyAfterCompleteRootsParserAndMatch
    ReuseNeverSealsOrDeletesProvisionalObservation
    BoundedReuseCleanup
    CleanupNeverDeletesLiveStagingOrUpload
    CanonicalUploadClaimBlocksGc
    CanonicalUploadBootstrapAndMappingOrder
    CanonicalUploadHandoffIsAtomic
    StaleCanonicalUploadCleanupIsFenced
    StaleCanonicalUploadCleanupEnablesValueGc
    OrphanCanonicalIdentityCleanupIsFenced
    OrphanCanonicalIdentityCleanupEnablesValueGc
    CanonicalConsumerCleanupIsFenced
    ExternalRetentionBlockerPreventsCleanupAndGc
    SourceBuildMappingCleanupIsFenced
