[[vertical_family]]
name = "gallery_observation_metadata_vertical"
anchor_relation = "gallery_observation_metadata_anchor"
seal_relation = "gallery_observation_metadata_seal"
view_relation = "gallery_observation_metadata"
key_attributes = ["gallery_id", "observation_id"]
visibility = "sealed_total"
members = [
  { relation = "gallery_source_name_access", key_attributes = ["gallery_id"], value_attribute = "source_gallery_name", join = { source_relation = "gallery_observation_metadata_seal", source_attributes = ["gallery_id"], member_attributes = ["gallery_id"] }, project = false },
  { relation = "source_gallery_name_gid", key_attributes = ["source_gallery_name"], value_attribute = "gid", join = { source_relation = "gallery_source_name_access", source_attributes = ["source_gallery_name"], member_attributes = ["source_gallery_name"] }, project = true },
  { relation = "gallery_upload_time", key_attributes = ["gid"], value_attribute = "upload_time", join = { source_relation = "source_gallery_name_gid", source_attributes = ["gid"], member_attributes = ["gid"] }, project = true },
  { relation = "gallery_observation_download_time", key_attributes = ["gallery_id", "observation_id"], value_attribute = "download_time", join = { source_relation = "gallery_observation_metadata_seal", source_attributes = ["gallery_id", "observation_id"], member_attributes = ["gallery_id", "observation_id"] }, project = true },
  { relation = "gallery_observation_modified_time", key_attributes = ["gallery_id", "observation_id"], value_attribute = "modified_time", join = { source_relation = "gallery_observation_metadata_seal", source_attributes = ["gallery_id", "observation_id"], member_attributes = ["gallery_id", "observation_id"] }, project = true },
]
semantic_fds = [
  { determinant = ["gallery_id"], dependent = ["source_gallery_name"] },
  { determinant = ["source_gallery_name"], dependent = ["gid"] },
  { determinant = ["gid"], dependent = ["upload_time"] },
  { determinant = ["gallery_id", "observation_id"], dependent = ["download_time", "modified_time"] },
]
rationale = "The filesystem parser deterministically extracts GID from the exact source-gallery basename, so source_gallery_name determines gid and gallery_id reaches that basename through its immutable locator. GID identifies the upstream gallery upload timestamp, while download and metadata-file modification timestamps remain local-observation facts."
write_obligation = "parse and validate the exact source_gallery_name-to-GID mapping; insert or exact-compare the immutable GID upload timestamp; derive gallery_source_name_access only from gallery_identity joined through source_locator_identity; insert observation-local download and modified timestamps; then insert the PK-only seal last after every FK-total join target exists"

