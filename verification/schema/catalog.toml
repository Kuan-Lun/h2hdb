contract_version = 1
name = "h2hdb-vnext-catalog"
description = "Logical vNext catalog contract; physical indexes and SQL types are specified separately."

# FD-sensitive names are classified explicitly.  In particular, an audit or
# observational digest is not assumed injective and therefore implies no FD.
# Only canonical_identity_digest and payload_digest carry identity semantics.
[[attribute_semantic]]
name = "analysis_id"
classification = "surrogate_identifier"
rationale = "Opaque identifier for one analysis run; uniqueness is declared only by relation keys."

[[attribute_semantic]]
name = "artist_count"
classification = "aggregate_count"
rationale = "Derived cardinality scoped by the owning relation key; it is not an identifier."

[[attribute_semantic]]
name = "artist_tag_id"
classification = "domain_identifier"
rationale = "Role-qualified reference to tag_id; its FDs arise only from declared foreign and candidate keys."

[[attribute_semantic]]
name = "artifact_sha256"
classification = "payload_digest"
rationale = "Domain-separated digest of immutable artifact bytes; artifact_blob is the sole digest-to-size authority."

[[attribute_semantic]]
name = "batch_key"
classification = "idempotency_key"
rationale = "Stage-scoped retry key and not a globally unique identifier."

[[attribute_semantic]]
name = "build_id"
classification = "surrogate_identifier"
rationale = "Opaque source-build identifier; global uniqueness is declared where it is a candidate key."

[[attribute_semantic]]
name = "byte_count"
classification = "aggregate_count"
rationale = "Build-scoped derived byte total; it determines no row outside its declared key."

[[attribute_semantic]]
name = "candidate_id"
classification = "surrogate_identifier"
rationale = "Opaque publication-candidate identifier."

[[attribute_semantic]]
name = "candidate_sha256"
classification = "audit_digest"
rationale = "Comparator-input checksum for audit/replay; no injectivity or reverse FD is assumed."

[[attribute_semantic]]
name = "content_byte_count"
classification = "aggregate_count"
rationale = "Gallery-scoped derived byte total and not a content identity."

[[attribute_semantic]]
name = "content_file_count"
classification = "aggregate_count"
rationale = "Gallery-scoped derived file total and not a content identity."

[[attribute_semantic]]
name = "content_sha256"
classification = "comparator_key"
rationale = "Policy-scoped effective-gallery grouping digest; grouping does not assume global injectivity or determine artifact bytes."

[[attribute_semantic]]
name = "decision_sha256"
classification = "audit_digest"
rationale = "Winner-decision checksum; it is not assumed injective and does not identify the winner independently."

[[attribute_semantic]]
name = "evidence_sha256"
classification = "audit_digest"
rationale = "Checksum of exclusion evidence; it is not assumed injective and implies no reverse FD."

[[attribute_semantic]]
name = "file_count"
classification = "aggregate_count"
rationale = "Build-scoped derived file total."

[[attribute_semantic]]
name = "file_key"
classification = "canonical_identity_digest"
rationale = "Canonical digest of filename bytes; file_name_identity declares both digest and bytes as alternate keys."

[[attribute_semantic]]
name = "file_observation_id"
classification = "surrogate_identifier"
rationale = "Opaque identifier for a single source-file observation."

[[attribute_semantic]]
name = "file_sha256"
classification = "payload_digest"
rationale = "Domain-separated digest of immutable file bytes; content_blob is the sole digest-to-size authority."

[[attribute_semantic]]
name = "gallery_count"
classification = "aggregate_count"
rationale = "Build-scoped derived gallery total."

[[attribute_semantic]]
name = "gallery_id"
classification = "surrogate_identifier"
rationale = "Opaque identifier for a gallery occurrence in a source build."

[[attribute_semantic]]
name = "gallery_key"
classification = "canonical_identity_digest"
rationale = "Canonical digest of gallery-name bytes; gallery_identity declares digest and name as alternate keys."

[[attribute_semantic]]
name = "input_manifest_sha256"
classification = "audit_digest"
rationale = "Pinned analysis-input checksum; it is intentionally not treated as a globally injective manifest identity."

[[attribute_semantic]]
name = "input_sha256"
classification = "audit_digest"
rationale = "Batch/checkpoint input checksum for replay detection; it implies no reverse FD."

[[attribute_semantic]]
name = "item_count"
classification = "aggregate_count"
rationale = "Revision-scoped publication item total."

[[attribute_semantic]]
name = "item_sha256"
classification = "audit_digest"
rationale = "Publication-item checksum; no global uniqueness or injectivity is assumed."

[[attribute_semantic]]
name = "locator"
classification = "locator"
rationale = "Provider-specific artifact address; identity and uniqueness are scoped by declared relation keys only."

[[attribute_semantic]]
name = "manifest_policy_id"
classification = "surrogate_identifier"
rationale = "Opaque manifest-policy identifier with a separately declared natural policy tuple key."

[[attribute_semantic]]
name = "manifest_sha256"
classification = "audit_digest"
rationale = "Canonicalization checksum retained for comparison; without a typed payload relation it is not assumed injective."

[[attribute_semantic]]
name = "metadata_observation_sha256"
classification = "observational_digest"
rationale = "Scanner observation checksum only; it is not assumed injective and does not determine gid or canonical metadata."

[[attribute_semantic]]
name = "metadata_sha256"
classification = "audit_digest"
rationale = "Gallery metadata checksum; no reverse FD is assumed without a canonical metadata payload relation."

[[attribute_semantic]]
name = "occurrence_count"
classification = "aggregate_count"
rationale = "Key-scoped multiplicity derived from exact occurrence rows."

[[attribute_semantic]]
name = "output_sha256"
classification = "audit_digest"
rationale = "Batch/checkpoint output checksum for replay validation; it is not a payload identity."

[[attribute_semantic]]
name = "owner_gallery_id"
classification = "domain_identifier"
rationale = "Reference to the selected owner gallery, unique only under the decision relation key."

[[attribute_semantic]]
name = "policy_id"
classification = "surrogate_identifier"
rationale = "Opaque analysis-policy identifier with a separately declared natural policy tuple key."

[[attribute_semantic]]
name = "priority_key"
classification = "ordering_key"
rationale = "Deterministic comparator value scoped by a candidate; equal values do not imply candidate identity."

[[attribute_semantic]]
name = "publication_id"
classification = "domain_identifier"
rationale = "Catalog-facing identifier whose uniqueness is revision-scoped by declared keys."

[[attribute_semantic]]
name = "publication_key"
classification = "natural_key"
rationale = "Stable publication key whose uniqueness is explicitly candidate- or revision-scoped."

[[attribute_semantic]]
name = "publication_sha256"
classification = "audit_digest"
rationale = "Revision/publication checksum; no reverse FD is assumed."

[[attribute_semantic]]
name = "receipt_id"
classification = "surrogate_identifier"
rationale = "Opaque durable receipt identifier."

[[attribute_semantic]]
name = "row_count"
classification = "aggregate_count"
rationale = "Batch-scoped affected-row total."

[[attribute_semantic]]
name = "scope_key"
classification = "natural_key"
rationale = "Opaque source-scope value; it is not globally unique without an explicitly declared composite key."

[[attribute_semantic]]
name = "source_locator"
classification = "locator"
rationale = "Build-scoped source address; (build_id, source_locator) is an alternate source_gallery key."

[[attribute_semantic]]
name = "source_manifest_sha256"
classification = "audit_digest"
rationale = "Receipt checksum of the source manifest; no injectivity or reverse FD is assumed."

[[attribute_semantic]]
name = "tag_id"
classification = "surrogate_identifier"
rationale = "Opaque normalized-tag identifier with a separately declared namespace/value natural key."

[[attribute_semantic]]
name = "winner_gallery_id"
classification = "domain_identifier"
rationale = "Reference to the selected GID winner, unique only under the decision relation key."

