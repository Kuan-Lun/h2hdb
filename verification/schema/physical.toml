[[runtime_obligation_binding]]
path = "analysis_resolution_contract.batch_rule"
text = "initialize all fifteen registered stages in exact stage_order with generation one, the exact codec-specific absent-key genesis cursor, processed_count zero, and OPEN state; every hard-capped batch locks one checkpoint, derives the next exact keyset page server-side using only that stage's registered cursor codec, inserts one complete immutable response receipt, and CAS-advances generation, cursor, processed_count, and state in the same transaction; committed_generation is exactly start_generation plus one and next_processed_count is exactly start_processed_count plus row_count; exact batch_key replay and exact start_generation replay field-compare and return the full stored tuple without writes; terminal is one if and only if the derived page is empty, row_count is zero, next_cursor equals start_cursor, next_processed_count equals start_processed_count, and next_state is COMPLETE, while every nonterminal receipt has positive row_count and next_state OPEN; caller stage, cursor, count, terminal, state, digest, sequence, or receipt bytes never authorize mutation"
semantic_obligation_id = "catalog.overlay-resolution-seal.v1"

[[runtime_obligation_binding]]
path = "analysis_resolution_contract.cursor_codec_rule"
text = "analysis_gallery_v1 is u8(version=1) || u8(tag=0x47) || u8(key_present) || raw8(gallery_id_u64be_or_zero); analysis_digest_v1 is u8(version=1) || u8(tag=0x44) || u8(key_present) || raw32(digest_or_zero); analysis_gid_v1 is u8(version=1) || u8(tag=0x49) || u8(key_present) || raw8(gid_u64be_or_zero); each corresponding analysis_gallery_live_v1, analysis_digest_live_v1, or analysis_gid_live_v1 appends u64be(live_row_count_int63) used only by the independent component validator; key_present is exactly zero for the all-zero absent-key genesis and one for a positive gallery_id/gid or exact digest key; exact EOF is required, gallery/GID keysets compare unsigned integers, digest keysets compare unsigned bytes, and runtime validates the stage-selected codec before every query or CAS"
semantic_obligation_id = "catalog.overlay-resolution-seal.v1"

[[runtime_obligation_binding]]
path = "analysis_candidate_contract.runtime_obligation"
text = "production streams the exact canonical title pages through StrictUtf8ScalarCounter and count_analysis_title_scalars to obtain one fixed AnalysisTitleScalarReceipt without materializing unbounded title bytes; the private production _encode_streamed_candidate_priority adapter first validates the exact metadata tree, then drives a second bounded page stream into that receipt and must remain byte-equal to the public reference encoder; encode_analysis_candidate_priority and validate_analysis_candidate_priority accept only that fixed scalar receipt, while decode_analysis_candidate_priority validates the stored frame over immutable snapshot facts; analysis_candidate_has_already_uploaded implements the exact ASCII-only marker rule; analysis_candidate_total_order_key implements the unsigned lexicographic maximum over priority_key, scope_key, and locator_sha256; analysis_content_candidate_digest and analysis_gid_candidate_digest construct candidate_sha256 solely as the exact audit frame; reject monolithic production title bytes, gallery_id, unique gallery location, incumbent state, leaf name, allocation order, Unicode database behavior, collation, truncation, caller bytes, or candidate_sha256 as comparator authority"
semantic_obligation_id = "catalog.incremental-impact.v1"

[[runtime_obligation_binding]]
path = "artifact_delta_contract.rebuild_rule"
text = "REBUILD iff both old and new rows exist and artifact_semantics_sha256 differs; the GID-derived artifact name is normalized outside delta state"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "artifact_delta_contract.unchanged_rule"
text = "UNCHANGED iff both old and new rows exist and artifact_semantics_sha256 is exactly equal; artifact names are not delta state because publication_identity derives them only from immutable positive GID"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "artifact_delta_contract.rename_rule"
text = "artifact_name is globally derived from immutable positive GID in publication_identity and is absent from artifact input, delta, operation, prepared, and catalog occurrence relations; a GID change is a different publication identity, never an artifact rename"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "artifact_byte_producer_contract.runtime_obligation"
text = "construct the policy-v2 component from the closed ZIP writer policy, registered exact producer fingerprint, and max_image_short_side; recompute the raw producer fingerprint frame, reject unsupported or nonpositive resize bounds, bump artifact_algorithm_version for every possible bit change unless certified byte-equivalent, and never reuse an artifact input across an algorithm/resize/producer tuple change"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "artifact_member_plan_contract.runtime_obligation"
text = "construct exactly one member_plan component for every artifact input; entry_position starts at zero and is contiguous across every source entry including excluded entries; protocol version one admits no generated archive member and the ZIP comment is not a member; entry_kind is SOURCE_FILE=0; source_role is METADATA=0 or CONTENT=1 and is derived exactly from file_name_identity; excluded_flag and archive_name_presence are exactly 0 or 1; excluded entries have presence zero; derive archive_member_name_bytes only from entry_position/source_role/transform_kind/excluded_flag with artifact_archive_member_name and reject caller names or mismatched encoded proof bytes; transform_kind is RAW_COPY=0, GIF_NORMALIZE=1, or JPEG_NORMALIZE=2 and is derived from the exact case-insensitive ASCII suffix; every source_file_sha256 is collision-free payload identity whose exact size and bytes are rehashed and compared during prepare; reject every unknown tag, impossible role/transform/presence combination, noncontiguous position, or trailing byte; first persist a bounded preflight/spool receipt proving entry_count, payload_byte_count and ordered projection, then replay through iter_artifact_member_plan_payload and artifact_member_plan_digest_ordered into canonical_value_digest_parts; build effective_content from an unsigned-bytewise keyset projection through iter_artifact_effective_content_payload_ordered and artifact_effective_content_digest_ordered; never materialize either full high-cardinality payload; recompute the canonical plan payload digest and require byte-for-byte equality on collision"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "artifact_member_plan_contract.ready_obligation"
text = "before candidate seal and catalog publication, decode member_plan with the closed enum registry and prove exact equality with the ordered source snapshot, source sizes and rehashed payload identities, resolved per-file exclusion decisions, archive naming, and transform decisions; prove that no generated member exists and that the ZIP comment is not a member; separately reconstruct the unique ZIP comment envelope from the source_manifest and effective_content component digests; effective_content digest alone is never equality authority"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "artifact_name_contract.runtime_obligation"
text = "derive artifact_name only from the exact positive GID with artifact_name(gid); reject caller bytes, plus signs, zero, leading zeros, whitespace, alternate extensions, Unicode decimal digits, and names above the signed-int63 domain"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "artifact_locator_contract.runtime_obligation"
text = "derive all three segments from artifact_sha256, stream the complete artifact_locator_bytes_v1 canonical frame, reject caller components and uppercase hex, and exact-compare both candidate keys on every collision"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "artifact_protection_token_contract.runtime_obligation"
text = "the repository accepts no caller receipt or token authority; construct receipt and token from joined exact fields, decode exact EOF, recompute receipt, require storage_codec_version in the closed registry, require the embedded locator to equal artifact_locator for the embedded blob, require embedded size to equal artifact_blob.size_bytes, and compare every field on replay"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.selection_rule"
text = "BUILD_SELECTION streams every immutable source_build_gallery member of candidate.analysis_id in unsigned positive gallery_id keyset order and inserts a row if and only if the gallery is its analysis_content_owner_resolved owner for its nonexcluded effective CONTENT digest, treating a gallery with no nonexcluded CONTENT digest as its own owner, and the same gallery is the analysis_gid_winner_resolved winner for its exact metadata GID; derive publication_key only with publication-key.v1 from that positive GID; publication_selection stores no audit digest; VALIDATE_SELECTION independently streams the same predicate, exact merge-compares candidate_id, gallery_id, and publication_key against the materialization, and only its empty terminal receipt owns publication_count"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.cursor_codec_rule"
text = "publication_gallery_v1 is empty at genesis or u64be(positive gallery_id); publication_key_v1 is empty at genesis or raw32(publication_key); publication_catalog_child_v1 is empty at genesis or u8(version=1) || u8(child_kind: PUBLICATION=0,ORDER=1,TITLE=2,CONTENT=3,CONTRIBUTOR=4,CONTRIBUTOR_SORT_AS=5,SUBJECT=6,ARTIFACT=7) || raw32(publication_key) || u16be(subkey_length) || bounded subkey, where subkey is empty for singleton publication/title/content, u64be(position) for order/contributor/contributor_sort_as/subject, and u16be(artifact_id_length) || exact artifact_id bytes for artifact; exact EOF is required; gallery IDs compare unsigned integers and every other key compares unsigned bytes; the locked registered stage selects the codec and caller cursor bytes never select or alter a query"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.batch_rule"
text = "initialize all seventeen provider-seeded publication stages in exact stage_order with generation one, empty cursor, processed_count zero, and OPEN state; stages 2 through 16 require the immediately preceding stage COMPLETE, BUILD_SELECTION additionally requires candidate OPEN plus its COMPLETE five-seal analysis, and FINALIZE_ARTIFACTS requires publication_receipt DB_COMMITTED; every hard-capped maximum-128 batch locks one checkpoint, derives the next exact keyset page server-side, inserts the full immutable pre/post publication_batch_receipt, and CAS-advances generation, cursor, processed_count, and state in one transaction; committed_generation equals start_generation plus one and next_processed_count equals start_processed_count plus row_count; exact retry by batch_key or start_generation field-compares and returns the complete stored tuple without writes; terminal is one if and only if the server-derived page is empty with row_count zero, unchanged cursor/count, and next_state COMPLETE, while nonterminal means positive row_count and next_state OPEN; no caller stage, cursor, count, state, terminal, digest, sequence, or receipt is authority"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.projection_seal_rule"
text = "after VALIDATE_DUPLICATE_LOSER becomes COMPLETE, one short seal transaction locks the candidate and terminal checkpoints for VALIDATE_SELECTION, VALIDATE_CATALOG_PROJECTION, VALIDATE_ARTIFACT_INPUT_DELTA, VALIDATE_PREPARED_ARTIFACT, VALIDATE_CREATE, VALIDATE_REBUILD, VALIDATE_DELETE, VALIDATE_UNCHANGED, VALIDATE_NEW_GALLERY, VALIDATE_CHANGED_GALLERY, VALIDATE_REMOVED_GALLERY, and VALIDATE_DUPLICATE_LOSER; require VALIDATE_CATALOG_PROJECTION terminal COMPLETE after its independent exact child merge but never compare its child processed_count with publication count; take publication_count only from terminal VALIDATE_SELECTION, require prepared_artifact_count equals create_count plus rebuild_count, and require artifact_input_count equals create_count plus rebuild_count plus unchanged_count; copy only the named O(1) terminal validation scalars into publication_candidate_projection_seal and then CAS candidate OPEN to SEALED in the same transaction; never SUM receipts or child relations, trust an audit digest, or seal from a BUILD stage"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.runtime_obligation"
text = "in one fenced publication protocol, validate the exact selected publication child set and publication_count; assign every selected publication exactly one contiguous zero-based catalog_publication_order position under the exact registered title-sort bytes with publication_key as the stable tie break, and require the order-row count to equal publication_count; stream the exact strict-UTF-8 METADATA comment bytes without normalization or trimming through catalog_summary_digest_parts into catalog_summary_utf8_v1; select catalog_language_utf8_v1 from the nonempty exact tag-value bytes at the minimum gallery tag position whose namespace is the case-sensitive UTF-8 bytes language, or use the exact ASCII bytes und when absent, without normalization or trimming, and stream through catalog_language_digest_parts; build both canonical trees under the live generation upload claim; validate all six exactly-once artifact input component kinds and exact canonical payload bytes, artifact old/new delta classification, prepared artifact byte digest/size/member plan/exact ZIP comment and bounded protection token; validate the complete artifact_locator_bytes_v1 frame is at most 4096 bytes before exposing or storing any segment, stream it through iter_artifact_locator_payload and canonical_value_digest_parts exactly as u32be(codec_version=1) || u32be(segment_count) || repeated(u32be(segment_utf8_length) || strict_utf8_segment), rejecting empty/dot/NUL/separator segments, and store its canonical locator reference; readers validate exact EOF within the same 4096-byte cap before exposing a segment; the monolithic digest helpers are bounded convenience oracles and never the production write path for arbitrary summary/language bytes; before candidate state SEALED, bounded stage receipts plus an independent full evaluator must validate exact selection, order, every reserved-revision catalog child, artifact delta, artifact input, and prepared coverage, then insert publication_candidate_projection_seal with exact publication_count, artifact_input_count, prepared_artifact_count, CREATE/REBUILD/DELETE/UNCHANGED counts, and new_galleries/changed_galleries/removed_galleries/duplicate_losers; the final pointer transaction joins candidate.analysis_id through analysis_snapshot_manifest to the exact source_revision snapshot, joins the unique publication_candidate_preparation to its COMPLETE matching-policy current-generation effect seal, and compares only O(1) projection-seal, catalog_revision, and publication_receipt scalars before activation and head CAS, never COUNT or SUM over child rows; compare every immutable revision child field and digest/count before sealing the projection; publish only by compare-and-swap from the candidate-pinned base head to the reserved revision, never trust a caller/audit digest or guessed scalar, never expose a partial revision, and never perform an unbounded bind"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.finalization_rule"
text = "after the pointer transaction commits publication_receipt state DB_COMMITTED, never mass-update prepared_artifact; the fixed FINALIZE_ARTIFACTS checkpoint uses an exact publication_key keyset cursor, processed_count, monotone generation, and OPEN or COMPLETE state; each hard-capped transaction locks that checkpoint, derives the next contiguous PREPARED rows server-side, releases their exact protection tokens, advances them to COMMITTED, inserts a full publication_batch_receipt response tuple, and CAS-advances cursor/count/generation together; exact batch_key retry returns the byte-for-byte latest stored response without writes; an empty terminal batch alone writes terminal=1 and COMPLETE with processed_count equal to projection-seal prepared_artifact_count; only that terminal authority permits the same transaction to advance publication_receipt from DB_COMMITTED to PROJECTION_FINALIZED"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "title_sort_contract.runtime_obligation"
text = "resolve title_sort_policy_id through the publication-pinned display_title_policy_id; compute exact Unicode casefold bytes only with the registered title_sort_algorithm_version and unicode_data_version implementation; persist and collision-check both title and sort bytes through canonical_value_identity; reject unknown runtime Unicode tables; and require a new policy for every casefold byte change"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "transition_authority_contract.runtime_obligation"
text = "never authorize a seal, checkpoint, batch replay, READY revision, or head transition from any audit digest or checksum; for every bounded batch, derive input from the immutable snapshot and server-owned cursor, recompute the exact row projection, compare every materialized field, and in the same fenced transaction insert the immutable receipt and compare-and-swap generation/checkpoint; batch_key is only an opaque attempt/idempotency token and never semantic authority; insert an immutable component seal only after component-specific full-evaluator equality in that same transaction; before catalog head CAS, compare the exact immutable revision child projection and count rather than trusting a publication digest"
semantic_obligation_id = "catalog.state-machines.v1"

[[runtime_obligation_binding]]
path = "transition_authority_contract.ready_obligation"
text = "READY validation is bounded to exact registry, active-head, immutable receipt, and seal-marker consistency plus writer-hook name/version presence; it never scans the full corpus and never claims that an empty-database schema check enforces future high-cardinality writes"
semantic_obligation_id = "catalog.state-machines.v1"

[[runtime_obligation_binding]]
path = "byte_domain.source_gallery_name.runtime_obligation"
text = "require the exact final decoded source-relative-locator UTF-8 segment, rejecting empty names, separators, dot components, NUL, invalid UTF-8, or encoded length above 255"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.name_bytes.runtime_obligation"
text = "persist the exact dirent bytes and reject empty values, separators, dot components, or length above 255"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.artifact_name.runtime_obligation"
text = "derive only ascii('h2h-') || canonical positive signed-int63 decimal GID without leading zeros || ascii('.cbz'); reject caller-supplied names and exact-compare the derived bytes in publication_identity"
semantic_obligation_id = "catalog.artifact-semantics.v1"

[[runtime_obligation_binding]]
path = "byte_domain.adapter_id.runtime_obligation"
text = "accept only exact nonempty ASCII adapter identifiers from artifact_storage_codec and reject encoded length above 64"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.producer_equivalence_class.runtime_obligation"
text = "accept only exact nonempty bounded bytes from the closed producer registry and reject caller-defined certification classes"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.writer_id.runtime_obligation"
text = "accept only exact nonempty writer identity bytes included in the registered producer fingerprint frame"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.python_abi.runtime_obligation"
text = "accept only exact nonempty Python ABI/build bytes included in the registered producer fingerprint frame"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.pillow_build.runtime_obligation"
text = "accept only exact nonempty Pillow build bytes included in the registered producer fingerprint frame"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.libjpeg_build.runtime_obligation"
text = "accept only exact nonempty libjpeg build bytes included in the registered producer fingerprint frame"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.zlib_build.runtime_obligation"
text = "accept only exact nonempty zlib build bytes included in the registered producer fingerprint frame"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.publication_id.runtime_obligation"
text = "construct only urn:h2h:gallery:<uint64-gid>, reject caller-supplied identifiers, and verify the encoded result is at most 64 bytes"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "byte_domain.artifact_id.runtime_obligation"
text = "construct only urn:h2h:artifact:cbz:<uint64-gid>:sha256:<64-lowerhex>, reject caller-supplied identifiers, and verify at most 128 bytes"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "byte_domain.namespace.runtime_obligation"
text = "validate exact UTF-8 namespace bytes without trimming or case folding and reject encoded length above 128"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.digest_domain.runtime_obligation"
text = "accept only an exact registered stable ASCII digest_domain whose versioned name selects one codec, require domains to be globally distinct without a database surrogate in any digest preimage, and reject encoded length above 64"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "byte_domain.unicode_data_version.runtime_obligation"
text = "accept only an exact registered Unicode Character Database version used by the title-sort implementation and reject encoded length above 32"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.source_provider.runtime_obligation"
text = "accept only registered provider identifiers and reject encoded length above 64"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "byte_domain.channel.runtime_obligation"
text = "accept only registered channel identifiers and reject encoded length above 64"
semantic_obligation_id = "catalog.source-baseline-channel.v1"

[[runtime_obligation_binding]]
path = "byte_domain.stage.runtime_obligation"
text = "accept only the stage enum for the owning state machine and reject encoded length above 64"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "byte_domain.stage_order.runtime_obligation"
text = "accept only the exact zero-padded ASCII order key provider-seeded for the registered stage and reject every noncanonical or out-of-registry value"
semantic_obligation_id = "catalog.overlay-resolution-seal.v1"

[[runtime_obligation_binding]]
path = "byte_domain.cursor_codec.runtime_obligation"
text = "accept only the exact provider-seeded cursor codec identifier for the registered stage and dispatch through a closed production codec map"
semantic_obligation_id = "catalog.overlay-resolution-seal.v1"

[[runtime_obligation_binding]]
path = "byte_domain.state_component.runtime_obligation"
text = "accept exactly the five registered overlay component identifiers and reject encoded length above 64"
semantic_obligation_id = "catalog.overlay-resolution-seal.v1"

[[runtime_obligation_binding]]
path = "byte_domain.file_role.runtime_obligation"
text = "accept exactly the ASCII bytes CONTENT or METADATA and reject every other encoding"
semantic_obligation_id = "catalog.role-derivation.v1"

[[runtime_obligation_binding]]
path = "byte_domain.role.runtime_obligation"
text = "validate exact UTF-8 role bytes and reject encoded length above 64"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.priority_key.runtime_obligation"
text = "construct only with the versioned canonical comparator encoder and reject output above 512 bytes"
semantic_obligation_id = "catalog.incremental-impact.v1"

[[runtime_obligation_binding]]
path = "byte_domain.batch_key.runtime_obligation"
text = "construct only with the versioned framed batch-key encoder and reject output above 512 bytes"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "byte_domain.metadata_fingerprint.runtime_obligation"
text = "construct exactly raw8(device_u64) || raw8(inode_u64) || u64be(size_int63) || i64be(modified_ns) || i64be(changed_ns), require exactly 40 bytes, and keep the fingerprint audit-only"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.cursor.runtime_obligation"
text = "construct only from the closed stage-specific server cursor codecs, reject caller-defined cursor bytes, and reject output above 2048 bytes"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.start_cursor.runtime_obligation"
text = "persist only the exact pre-CAS server-owned stage cursor copied from the locked checkpoint, reject caller-defined cursor bytes, and reject output above 2048 bytes"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.next_cursor.runtime_obligation"
text = "persist only the exact post-batch server-derived stage cursor committed by the checkpoint CAS, reject caller-defined cursor bytes, and reject output above 2048 bytes"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "byte_domain.protection_token.runtime_obligation"
text = "construct and decode exactly the fixed 184-byte artifact-protection v1 frame, require exact EOF and derived receipt equality, resolve the embedded storage codec through artifact_storage_codec, and compare candidate, publication, blob, content-addressed locator, storage generation, and blob size against joined authority; caller token bytes are never authority"
semantic_obligation_id = "catalog.physical-domains.v1"

[[runtime_obligation_binding]]
path = "overlay.shadow_tombstone_exclusion"
text = "in the same transaction, reject any overlay business key present in both its shadow and tombstone table for the same analysis_id; the COMPLETE/READY scan must recheck all five component pairs"
semantic_obligation_id = "catalog.overlay-resolution-seal.v1"

[[runtime_obligation_binding]]
path = "overlay.ancestry_exactness"
text = "before an analysis becomes COMPLETE/READY, verify ancestry is self-at-depth-zero, acyclic, contiguous through every depth, bounded to 0..16, and policy-compatible with its anchor; a depth-zero genesis or compaction has self-only ancestry"
semantic_obligation_id = "catalog.overlay-resolution-seal.v1"

[[runtime_obligation_binding]]
path = "overlay.full_evaluator_equality"
text = "before sealing each overlay component or publishing from it, compare the resolved SQL view with the full evaluator for exact key/value equality, not only row counts or changed rows"
semantic_obligation_id = "catalog.overlay-resolution-seal.v1"

[canonical_digest_protocol]
policy_relation = "canonical_digest_policy"
value_relation = "canonical_value_identity"
digest_attribute = "value_sha256"
allocation_relation = "canonical_value_allocation"
page_relation = "canonical_value_page"
descriptor_relation = "canonical_value_page_descriptor"
parent_relation = "canonical_value_page_parent"
root_attribute = "root_page_sha256"
byte_count_attribute = "byte_count"
algorithm = "SHA-256"
framing = "ascii('h2hdb-vnext-canonical-value\\0') || u32be(codec_version) || u32be(digest_domain_length) || digest_domain_ascii || u64be(payload_length) || payload"
enforcement = "bounded_stream_recompute_tree_validate_and_collision_compare"

[canonical_value_page_protocol]
codec_version = 1
prefix = "h2hdb-vnext-canonical-value-page\\0"
maximum_page_bytes = 65536
chunk_maximum_bytes = 32768
branch_capacity = 256
maximum_level = 8
maximum_byte_count = 9223372036854775807
framing = "ascii('h2hdb-vnext-canonical-value-page\\0') || u32be(version=1) || raw32(owner_value_sha256) || u8(node: LEAF=0,BRANCH=1) || u8(level=0..8) || u64be(page_position_int63) || u64be(subtree_byte_count_int63) || u32be(entry_count) || exact_records"
enforcement = "raw_sha256_exact_page_compare_and_owner_tree_seal"

[source_locator_protocol]
identity_relation = "source_locator_identity"
gallery_relation = "gallery_identity"
digest_attribute = "locator_sha256"
name_attribute = "source_gallery_name"
