\* Finite complete-policy takeover profile.  Each policy atom represents the
\* whole resolved tuple.  TLC success is bounded to these constants and is not
\* Python, SQL, adapter, SQLite, or MariaDB refinement evidence.
SPECIFICATION Spec

CONSTANTS
    Policies = {1, 2}
    MaxGeneration = 4
    MaxBuilds = 4

INVARIANTS
    TypeOK
    OnePolicyPerBuild
    CommitRequiresCompleteAnalysis
    AtMostOnePendingCommit
    RecoveryPrecedesSourceHandoff
    MappingIsAnalyzable
    RetiredBuildNeverPublishes
    MappingsBounded
    SuccessfulReturnHasRequestedPolicy

PROPERTIES
    ConvergesBeforeReturn
