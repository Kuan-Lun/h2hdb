[[runtime_obligation_binding]]
path = "gallery_observation_page_contract.collision_obligation"
text = "page_sha256 is raw SHA-256 of the exact already-domain-prefixed page_bytes frame; on an existing digest compare all page_bytes byte-for-byte before reuse"
