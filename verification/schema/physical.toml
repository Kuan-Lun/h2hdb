[canonical_digest_protocol]
policy_relation = "canonical_digest_policy"
value_relation = "canonical_value_identity"
digest_attribute = "value_sha256"
allocation_relation = "canonical_value_allocation"
page_relation = "canonical_value_page"
descriptor_relation = "canonical_value_page_descriptor"
parent_relation = "canonical_value_page_parent"
root_attribute = "root_page_sha256"
byte_count_attribute = "byte_count"
algorithm = "SHA-256"
framing = "ascii('h2hdb-vnext-canonical-value\\0') || u32be(codec_version) || u32be(digest_domain_length) || digest_domain_ascii || u64be(payload_length) || payload"
enforcement = "bounded_stream_recompute_tree_validate_and_collision_compare"

[canonical_value_page_protocol]
