coverage_version = 1
invariant_sources = [
  "verification/schema/catalog.toml",
  "verification/schema/operational.toml",
]

# Proof engines are pinned by repository-owned lock files. pytest evidence
# records identify executable checks, not the per-merge execution profile. The
# exact-tree release receipt covers only the bounded "not deep" pytest merge
# profile; manual deep execution must be reported separately.
[tools]
python = "3.14.6"
lean_toolchain = "lean-toolchain"
tlc_lock = "verification/tools.lock.toml"
pytest = "9.1.1"
ci_workflow = ".github/workflows/verify.yml"

[[evidence]]
id = "fd.operational.closed-world"
