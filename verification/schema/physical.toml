text = "construct exactly one member_plan component for every artifact input; entry_position starts at zero and is contiguous across every source entry including excluded entries; protocol version one admits no generated archive member and the ZIP comment is not a member; entry_kind is SOURCE_FILE=0; source_role is METADATA=0 or CONTENT=1 and is derived exactly from file_name_identity; excluded_flag and archive_name_presence are exactly 0 or 1; excluded entries have presence zero and no archive member name; emitted entries have presence one and unique exact archive member name bytes in the non-excluded subsequence; transform_kind is RAW_COPY=0, GIF_NORMALIZE=1, or JPEG_NORMALIZE=2 and is derived from the exact case-insensitive ASCII suffix; every source_file_sha256 is collision-free payload identity whose exact size and bytes are rehashed and compared during prepare; reject every unknown tag, impossible presence combination, noncontiguous position, or trailing byte; first persist a bounded preflight/spool receipt proving entry_count, payload_byte_count, ordered projection, and unique archive names, then replay through iter_artifact_member_plan_payload and artifact_member_plan_digest_ordered into canonical_value_digest_parts; build effective_content from an unsigned-bytewise keyset projection through iter_artifact_effective_content_payload_ordered and artifact_effective_content_digest_ordered; never materialize either full high-cardinality payload; recompute the canonical plan payload digest and require byte-for-byte equality on collision"
