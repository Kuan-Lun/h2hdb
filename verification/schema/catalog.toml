  { relation = "source_build_discovery_tree_observation_sha256", key_attributes = ["build_id"], value_attribute = "tree_observation_sha256", join = { source_relation = "source_build_discovery_seal", source_attributes = ["build_id"], member_attributes = ["build_id"] }, project = true },
