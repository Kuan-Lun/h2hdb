\* Fast smoke profile.  TLC success is exhaustive only for this exact
\* one-candidate, one-batch-key, two-publication-generation, and
\* three-finalization-generation instance.  It is bounded safety evidence,
\* not an unbounded proof; it establishes neither liveness nor SQL/backend
\* refinement.
SPECIFICATION Spec

\* Safety-preserving fingerprint quotient for invariant checking only.
VIEW SafetyView

CONSTANTS
    Candidates = {candidate1}
    BatchKeys = {batch1}
    NoCandidate = noCandidate
    NoRevision = noRevision
    MaxGeneration = 2
    MaxFinalizationGeneration = 3

INVARIANTS
