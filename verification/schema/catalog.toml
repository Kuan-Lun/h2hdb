]
initialization = "depth_zero_full_shadow"
snapshot_resolution = "analysis_run_build_join"
delta_basis = "exact_old_new_build_membership"
read_resolution = "nearest_ancestor_wins"
compaction = "depth_zero_full_shadow_at_limit_or_policy_change"
compaction_ancestry = "self_only"
published_baseline_prune_rule = "retain analysis_baseline as the exact working comparison input for every OPEN run and every positive-depth sealed suffix; when the publication finalization terminal transaction derives a COMPLETE self-only depth-zero analysis from the current immutable commit, candidate, source-revision provenance and snapshot binding, atomically insert the PUBLISHED marker and exact-delete that analysis's one baseline row. Row absence on the first terminal handoff is valid only for true generation-one genesis; retained terminal response replay returns before transient lineage is consulted and performs zero DML. Positive-depth baselines are never pruned independently of their ancestry"
cleanup_guard = "no_reachable_descendants"
cleanup_transition = "remove_component_completion_seal_then_facts_then_ancestry_then_analysis_descriptor"
stage_relation = "analysis_stage"
checkpoint_relation = "analysis_checkpoint"
batch_receipt_relation = "analysis_batch_receipt"
cursor_codec_rule = "analysis_gallery_v1 is u8(version=1) || u8(tag=0x47) || u8(key_present) || raw8(gallery_id_u64be_or_zero); analysis_digest_v1 is u8(version=1) || u8(tag=0x44) || u8(key_present) || raw32(digest_or_zero); analysis_gid_v1 is u8(version=1) || u8(tag=0x49) || u8(key_present) || raw8(gid_u64be_or_zero); each corresponding analysis_gallery_live_v1, analysis_digest_live_v1, or analysis_gid_live_v1 appends u64be(live_row_count_int63) used only by the independent component validator; key_present is exactly zero for the all-zero absent-key genesis and one for a positive gallery_id/gid or exact digest key; exact EOF is required, gallery/GID keysets compare unsigned integers, digest keysets compare unsigned bytes, and runtime validates the stage-selected codec before every query or CAS"
batch_rule = "initialize all fifteen registered stages in exact stage_order with generation one, the codec-specific absent-key cursor, processed_count zero and OPEN state; every maximum-128 batch locks one wide checkpoint, derives the next exact server-side keyset page, inserts one immutable wide current receipt under both generation and batch candidate keys, generation-CASes the complete wide checkpoint, and deletes the safely acknowledged predecessor receipt in the same bounded transaction. The read-only current receipt projection derives committed_generation, next_processed_count, terminal and next_state; exact retained batch-key or generation replay ignores retry max_rows, reruns with stored page_limit, exact-compares every field and performs zero DML. Once an exact successor or terminal component handoff is durable, the superseded receipt is pruned and an older retry returns stale/not-found with zero DML; no time-based replay window or lifetime history is retained. Terminal is exactly an empty derived page with unchanged cursor/count and COMPLETE next state; every nonterminal page has positive row_count and OPEN next state; caller stage, cursor, count, state, digest, sequence, key, max_rows or receipt bytes never authorize mutation"

