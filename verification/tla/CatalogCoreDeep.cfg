\* Nightly/manual scope.  The Cartesian action space is intentionally much
\* larger than CatalogCoreSmall.cfg and is not suitable for a required PR job.
SPECIFICATION Spec

CONSTANTS
    Owners = {owner1, owner2}
    Builds = {build1, build2}
    Artifacts = {artifact1, artifact2}
    Revisions = {revision1, revision2}
    NoOwner = noOwner
    NoBuild = noBuild
    NoArtifact = noArtifact
    NoRevision = noRevision
    MaxTime = 2
    LeaseSpan = 1
    MaxGeneration = 2

INVARIANTS
    TypeOK
    StaleGenerationCannotMutate
    StaleGenerationCannotPublish
    HeadPointsOnlyToSealedAndAnalyzedBuild
    ActiveAndProtectedArtifactsCannotBeGc
    DatabaseHeadMatchesPublishedRevision
    PublishedArtifactsWerePreparedAndProtected
    ChangedDecisionArtifactsReadyBeforePublish
