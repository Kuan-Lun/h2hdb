text = "publication_gallery_v1 is empty at genesis or u64be(positive gallery_id); publication_key_v1 is empty at genesis or raw32(publication_key); publication_catalog_child_v1 is empty at genesis or u8(version=1) || u8(child_kind: PUBLICATION=0,ORDER=1,TITLE=2,CONTENT=3,CONTRIBUTOR=4,SUBJECT=5,ARTIFACT=6) || raw32(publication_key) || u16be(subkey_length) || bounded subkey, where subkey is empty for singleton publication/title/content/artifact and u64be(position) for order/contributor/subject; exact EOF is required; gallery IDs compare unsigned integers and every other key compares unsigned bytes; the locked registered stage selects the codec and caller cursor bytes never select or alter a query"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.batch_rule"
text = "the registry remains exactly seventeen ordered stages, with candidate-owned wide checkpoints only for the first sixteen; FINALIZE_ARTIFACTS uses the permanent receipt-owned checkpoint. Every maximum-128 candidate batch locks one wide checkpoint, derives the next exact server-side keyset page, inserts one immutable wide current receipt under both generation and batch candidate keys, generation-CASes the complete wide checkpoint, and deletes the safely acknowledged predecessor receipt in the same bounded transaction. The read-only current receipt projection derives committed_generation, next_processed_count, terminal and next_state; exact retained batch-key or generation replay compares every field with zero DML. Once an exact successor or terminal projection handoff is durable, the superseded receipt is pruned and an older retry returns stale/not-found with zero DML; no time-based replay window or lifetime history is retained. Terminal is exactly an empty page with unchanged cursor/count and COMPLETE next state; every nonterminal page has positive row_count and OPEN next state; caller values never authorize mutation"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.projection_seal_rule"
text = "after VALIDATE_DUPLICATE_LOSER becomes COMPLETE, one short certification transaction locks the candidate definition seal and terminal checkpoints for VALIDATE_SELECTION, VALIDATE_CATALOG_PROJECTION, VALIDATE_ARTIFACT_INPUT_DELTA, VALIDATE_PREPARED_ARTIFACT, VALIDATE_CREATE, VALIDATE_REBUILD, VALIDATE_DELETE, VALIDATE_UNCHANGED, VALIDATE_NEW_GALLERY, VALIDATE_CHANGED_GALLERY, VALIDATE_REMOVED_GALLERY, and VALIDATE_DUPLICATE_LOSER; require VALIDATE_CATALOG_PROJECTION terminal COMPLETE after its independent exact child merge but never compare its child processed_count with publication count; take publication_count only from terminal VALIDATE_SELECTION, require prepared_artifact_count equals create_count plus rebuild_count, and require artifact_input_count equals create_count plus rebuild_count plus unchanged_count; insert only the PK-only publication_candidate_projection_seal certification marker after all equations hold, so graph-derived candidate lifecycle becomes SEALED; the logical projection derives only create_count, rebuild_count, delete_count, new_galleries, and changed_galleries by fixed O(1) terminal-receipt joins, while every other receipt-owned count remains derived at its authority; never copy terminal validation scalars; never SUM receipts or child relations, trust an audit digest, or seal from a BUILD stage"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.runtime_obligation"
text = "in one fenced publication protocol, validate the exact selected publication child set and publication_count; assign every selected publication exactly one contiguous zero-based catalog_publication_order position under the exact registered title-sort bytes with publication_key as the stable tie break, and require the order-row count to equal publication_count; stream the exact strict-UTF-8 METADATA comment bytes without normalization or trimming through catalog_summary_digest_parts into catalog_summary_utf8_v1; select catalog_language_utf8_v1 from the nonempty exact tag-value bytes at the minimum gallery tag position whose namespace is the case-sensitive UTF-8 bytes language, or use the exact ASCII bytes und when absent, without normalization or trimming, and stream through catalog_language_digest_parts; build both canonical trees under the live generation upload claim; validate all six exactly-once artifact input component kinds and exact canonical payload bytes, artifact old/new delta classification, prepared artifact byte digest/size/member plan/exact ZIP comment and bounded protection token; validate the complete artifact_locator_bytes_v1 frame is at most 4096 bytes before exposing or storing any segment, stream it through iter_artifact_locator_payload and canonical_value_digest_parts exactly as u32be(codec_version=1) || u32be(segment_count) || repeated(u32be(segment_utf8_length) || strict_utf8_segment), rejecting empty/dot/NUL/separator segments, and store its canonical locator reference; readers validate exact EOF within the same 4096-byte cap before exposing a segment; the monolithic digest helpers are bounded convenience oracles and never the production write path for arbitrary summary/language bytes; before graph-derived candidate lifecycle SEALED, bounded stage receipts plus an independent full evaluator must validate exact selection, order, every reserved-revision catalog child, artifact delta, artifact input, and prepared coverage, then insert only the PK-only publication_candidate_projection_seal after exact publication_count, artifact_input_count, prepared_artifact_count, CREATE/REBUILD/DELETE/UNCHANGED counts, and new_galleries/changed_galleries/removed_galleries/duplicate_losers equations hold; derive the five logical projection counts only through fixed terminal-receipt joins; the final pointer transaction joins candidate.analysis_id through analysis_snapshot_manifest to the exact source_revision snapshot, joins the unique publication_candidate_preparation to its COMPLETE matching-policy current-generation effect seal, and compares only O(1) certification, terminal receipt, catalog_revision, and publication_receipt scalars before activation and head CAS, never COUNT or SUM over child rows; compare every immutable revision child field and digest/count before sealing the projection; publish only by compare-and-swap from the candidate-pinned base head to the reserved revision, never trust a caller/audit digest or guessed scalar, never expose a partial revision, and never perform an unbounded bind"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_atomic_contract.finalization_rule"
text = "after the pointer transaction exposes publication_receipt DB_COMMITTED, FINALIZE_ARTIFACTS uses the permanent receipt-owned wide checkpoint. Issue reads one exact generation and bounded PREPARED page without mutation; external token release is idempotent; commit exact-revalidates acknowledgements, advances only acknowledged rows, inserts one immutable wide current finalization receipt, generation-CASes the complete wide checkpoint, and deletes its safely acknowledged predecessor in one bounded transaction. Retained batch-key or start-generation replay returns the exact derived response with zero DML; pruned retries return stale/not-found. The empty terminal page writes the COMPLETE checkpoint and publication_commit_finalization marker together and retains that terminal current receipt so its committed_at remains finalized_at authority; no arbitrary historical receipt, MAX, marker timestamp or transient candidate state is accepted"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_commit_contract.runtime_obligation"
text = "publication_commit is the sole complete immutable commit authority; the catalog/source descriptors and operational effect exist first, a fresh writer inserts publication_commit_anchor, initializes the one-row permanent finalization checkpoint from that anchor, and inserts the complete wide publication_commit last after the generation successor and all policy/count/timestamp facts are validated; replay is candidate/preparation-key local O(1); candidate_id recovery is permanent and independent of transient candidates; the common head stores only one receipt and CASes in the same transaction; operational_activation is a derived read-only inline projection, not a SQL schema object, and is never inserted or updated; finalization remains one append-only marker inserted with the retained current terminal FINALIZE_ARTIFACTS receipt"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "publication_commit_contract.ready_obligation"
text = "full SchemaAdmin.check scans only the retained current/reachable publication window and validates every wide commit plus anchor/checkpoint insertion graph, candidate/revision/source/generation/preparation candidate-key uniqueness, contiguous successor edges inside that window, successor equals predecessor plus one, no fork/orphan/gap after the compacted floor, the unique maximum no-successor head, baseline/protection references, published projections, derived activation and finalization; generation zero is required only before first compaction and the oldest retained positive node may be the floor without an incoming edge; quick check_readiness remains epoch-only O(1) and no OPDS hot path scans even the retained window"
semantic_obligation_id = "catalog.publication-atomicity.v1"

[[runtime_obligation_binding]]
path = "batch_receipt_projection.analysis.write_obligation"
text = "for analysis batches persist one positive page_limit at or below the server cap of 128; derive committed_generation as start_generation plus one and next_processed_count as start_processed_count plus row_count under int63 overflow preconditions; row_count is zero iff terminal and next_state COMPLETE, while nonterminal requires a strict codec successor and OPEN next state. A fresh batch inserts one complete wide current receipt and generation-CASes one complete wide checkpoint, deleting a safely acknowledged predecessor in the same bounded transaction; the latest retained current receipt poststate equals the exact checkpoint. Retained replay must never trust retry caller max_rows or batch_key: it reruns only with the stored page_limit, recomputes and compares every derived field with zero DML; retry after successor/component safe acknowledgement and pruning returns stale/not-found with zero DML"
