  "construct the policy component from the registered byte-producer bundle, exact producer fingerprint, and max_image_short_side; reject unsupported or nonpositive resize bounds, bump artifact_algorithm_version for every possible bit change unless certified byte-equivalent, and never reuse an artifact input across a policy tuple change",
