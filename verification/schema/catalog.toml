[artifact_member_plan_contract]
semantic_relation = "artifact_semantic_input"
component_attribute = "member_plan_component_sha256"
component_kind = "member_plan"
canonical_value_relation = "canonical_value_identity"
canonical_digest_attribute = "value_sha256"
plan_version = 1
framing = "ascii('h2hdb-vnext-artifact-member-plan\\0') || u32be(plan_version) || u64be(entry_count) || repeated(u64be(entry_position) || u8(entry_kind) || u32be(source_name_length) || source_name_bytes || raw32(payload_sha256) || u64be(payload_size) || u8(source_role) || u8(excluded_flag) || u8(archive_name_presence) || if_present(u32be(archive_name_length) || archive_name_bytes) || u8(transform_kind))"
entry_fields = [
  "entry_position",
  "entry_kind_source_file",
  "exact_source_name_bytes",
  "source_file_sha256",
  "source_size_bytes",
  "source_role",
  "excluded_flag",
  "optional_exact_archive_member_name_bytes_absent_when_excluded",
  "transform_kind",
]
runtime_obligation = "construct exactly one member_plan component for every artifact input; entry_position starts at zero and is contiguous across every source entry including excluded entries; protocol version one admits no generated archive member and the ZIP comment is not a member; entry_kind is SOURCE_FILE=0; source_role is METADATA=0 or CONTENT=1 and is derived exactly from file_name_identity; excluded_flag and archive_name_presence are exactly 0 or 1; excluded entries have presence zero and no archive member name; emitted entries have presence one and unique exact archive member name bytes in the non-excluded subsequence; transform_kind is RAW_COPY=0, GIF_NORMALIZE=1, or JPEG_NORMALIZE=2 and is derived from the exact case-insensitive ASCII suffix; every source_file_sha256 is collision-free payload identity whose exact size and bytes are rehashed and compared during prepare; reject every unknown tag, impossible presence combination, noncontiguous position, or trailing byte; first persist a bounded preflight/spool receipt proving entry_count, payload_byte_count, ordered projection, and unique archive names, then replay through iter_artifact_member_plan_payload and artifact_member_plan_digest_ordered into canonical_value_digest_parts; build effective_content from an unsigned-bytewise keyset projection through iter_artifact_effective_content_payload_ordered and artifact_effective_content_digest_ordered; never materialize either full high-cardinality payload; recompute the canonical plan payload digest and require byte-for-byte equality on collision"
ready_obligation = "before candidate seal and catalog publication, decode member_plan with the closed enum registry and prove exact equality with the ordered source snapshot, source sizes and rehashed payload identities, resolved per-file exclusion decisions, archive naming, and transform decisions; prove that no generated member exists and that the ZIP comment is not a member; separately reconstruct the unique ZIP comment envelope from the source_manifest and effective_content component digests; effective_content digest alone is never equality authority"

[artifact_member_plan_enum]
entry_kind = { SOURCE_FILE = 0 }
source_role = { METADATA = 0, CONTENT = 1 }
transform_kind = { RAW_COPY = 0, GIF_NORMALIZE = 1, JPEG_NORMALIZE = 2 }
boolean_tags = { FALSE = 0, TRUE = 1 }
position_rule = "entry_position equals zero-based array index without gaps"
source_rule = "every v1 entry is a source file; exact nonempty source_name_bytes, raw32 source_file_sha256, and u64 source_size_bytes are always present; no generated identity or generated payload fields exist"
transform_rule = "GIF_NORMALIZE iff exact source suffix casefolds to .gif; JPEG_NORMALIZE iff it casefolds to .avif/.bmp/.jpeg/.jpg/.png/.webp; RAW_COPY otherwise"

