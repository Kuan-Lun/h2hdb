content_gid_relation = "source_gallery_name_gid"
content_coordinate_relation = "gallery_identity"
content_ordering_rule = "within each content_sha256 group select the unsigned lexicographically greatest tuple (prefer_not_already_uploaded, title_scalar_count, download_time, derived gid, derived scope_key, derived locator_sha256), all descending; derive gid through gallery_source_name_access joined to source_gallery_name_gid and scope_key/locator_sha256 through gallery_identity; no persisted packed priority or audit digest is authority"
gid_candidate_membership_relation = "analysis_gid_candidate_resolved"
gid_winner_selection_relation = "analysis_gid_winner_selection"
gid_winner_shadow_relation = "analysis_gid_winner_shadow"
gid_keyset_relation = "analysis_impacted_gid"
