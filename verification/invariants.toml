# Each required invariant has all six evidence layers.  `supporting` is
# deliberately weaker than `covered`; it does not turn BCNF, a generic binding
# negative control, or whole-schema SQLite refinement into a protocol proof.

# Data-plane runtime, fault, and integration layers remain blocked until a
# production vNext writer exists.  The executable manifest and schema checks
# below are retained as partial evidence, never promoted into transaction proof.

[[invariant]]
id = "catalog.identity-codecs.v1"
fd = { status = "supporting", evidence = ["fd.data.closed-world"] }
lean = { status = "supporting", evidence = ["lean.data.all-bcnf"] }
