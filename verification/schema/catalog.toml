  "gallery_id",
  "publication_key",
  "summary_sha256",
  "language_sha256",
  "modified_at",
  "download_time",
  "content_sha256",
]
fds = [
  { determinant = ["gallery_id"], dependent = ["publication_key"] },
  { determinant = ["revision", "gallery_id"], dependent = ["publication_key", "summary_sha256", "language_sha256", "modified_at", "download_time", "content_sha256"] },
  { determinant = ["revision", "publication_key"], dependent = ["gallery_id", "summary_sha256", "language_sha256", "modified_at", "download_time", "content_sha256"] },
]
projections = [
  { relation = "catalog_publication", attributes = ["revision", "publication_key", "gallery_id", "summary_sha256", "language_sha256", "modified_at", "download_time"] },
  { relation = "catalog_publication_content", attributes = ["revision", "publication_key", "content_sha256"] },
]
rationale = "Separate optional effective-content identity from the mandatory publication row. Positive content rows reconstruct losslessly by the publication key; row absence remains distinct from an invented empty content digest."

