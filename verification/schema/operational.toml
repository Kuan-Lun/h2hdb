contract_version = 1
name = "h2hdb-vnext-operational"
description = "Logical vNext operational/control-plane contract. Data-plane snapshot, catalog, and artifact facts remain owned by catalog.toml."
scope = "operational_control_plane"
excluded_data_plane_components = [
  "immutable source observations and source snapshot membership",
  "analysis evidence, overlays, and resolved evaluator state",
  "source revision history and source head",
  "catalog publications, artifacts, catalog revision history, and publication head",
]

[fencing_contract]
model = "verification/tla/CatalogCore.tla"
head_relation = "ingest_coordination_head"
generation_relation = "ingest_generation"
owner_relation = "ingest_generation_owner"
lease_relation = "ingest_generation_lease"
build_authorization_relation = "source_build_generation"
authorization_rule = "current_generation_and_exact_owner_and_unexpired_lease"
takeover_rule = "strictly_greater_generation"
stale_rule = "no_mutation"
history_cleanup_rule = "under the exclusive maintenance gate, keyset-delete at most the fixed batch bound of ingest generations strictly older than the current head only after source_build_generation, canonical_value_upload, staging claims, handoff, and every live lease or owner resume authority are absent; delete handoff, lease, owner, then generation child-first with row-lock recheck, while current and completed head references always block"

[maintenance_gate_contract]
slot_count = 64
head_relation = "maintenance_gate_head"
generation_relation = "maintenance_gate_generation"
owner_relation = "maintenance_gate_owner"
holder_relation = "maintenance_gate_holder"
authorization_rule = "exact_holder_owner_and_owner_generation_equals_head_generation_and_unexpired_owner_lease"
shared_claim_rule = "current_shared_owner_holds_exactly_one_slot"
exclusive_claim_rule = "current_exclusive_owner_holds_every_slot_zero_through_sixty_three"
reclaim_rule = "replace_a_slot_only_by_transactional_cas_on_the_exact_observed_owner_after_its_generation_is_stale_or_its_lease_is_expired"
stale_rule = "stale_generation_or_expired_owner_authorizes_no_mutation"
canonical_value_rule = "every canonical-value allocation, upload-claim, bounded page, and final-seal transaction holds and rechecks one shared maintenance slot; CANONICAL_VALUE cleanup holds the exclusive generation for its complete multi-phase cycle, so no live producer can claim, write, or reseal between destructive phases"
history_cleanup_rule = "under a newer live exclusive gate generation, keyset-delete at most the fixed batch bound of expired non-head owners after their holder slots are absent, then delete an unreferenced non-head maintenance generation only after no owner or head references it; every batch row-locks and rechecks head, owner lease, and exact generation, so current or live shared and exclusive authority always blocks"

[bounded_work_contract]
cursor_authority = "server_owned_checkpoint"
page_commit = "decision_rows_and_receipt_and_checkpoint_cas_in_one_transaction"
terminal_rule = "empty_page_receipt_before_complete"
preparation_policy_relation = "operational_policy"
preparation_checkpoint_relation = "operational_preparation_checkpoint"
preparation_receipt_relation = "operational_preparation_batch_receipt"
cleanup_policy_relation = "cleanup_job"
cleanup_checkpoint_relation = "cleanup_checkpoint"
cleanup_receipt_relation = "cleanup_batch_receipt"

[queue_history_contract]
deletion_attempt_relation = "deletion_request_attempt"
deletion_head_relation = "deletion_request_head"
deletion_url_relation = "deletion_request_url"
consumption_relation = "operational_deletion_consumption_event"
rule = "the current head may rotate or disappear without deleting immutable attempts referenced by consumption events; URL is an optional exact payload satellite"

[canonical_hash_cache_contract]
canonical_value_relation = "canonical_value_identity"
canonical_allocation_relation = "canonical_value_allocation"
canonical_page_relation = "canonical_value_page"
canonical_digest_attribute = "value_sha256"
canonical_policy_attribute = "digest_domain"
canonical_byte_count_attribute = "byte_count"
canonical_root_attribute = "root_page_sha256"
observation_relation = "hash_cache_observation"
source_digest_attribute = "source_identity_sha256"
fingerprint_digest_attribute = "fingerprint_sha256"
source_domain = "filesystem_source_identity_v1"
fingerprint_domain = "filesystem_fingerprint_v1"
write_obligation = "under an exact live canonical_value_upload claim, use the registered distinct digest_domain, stream the exact versioned canonical preimage through bounded canonical_value_page rows, recompute SHA-256 and byte_count, reject every mismatch, and on digest or page conflict byte-compare the complete streamed page tree before accepting final canonical_value_identity; no database surrogate participates"
read_obligation = "join each digest to final canonical_value_identity and canonical_value_allocation, validate the expected registered domain and byte_count, stream and recompute the exact root page tree, and never accept a digest without that complete exact preimage authority"

[operational_event_integrity_contract]
base_relation = "operational_event"
removed_subtype_relation = "operational_removed_gid_event"
deletion_subtype_relation = "operational_deletion_consumption_event"
removed_event_type = "REMOVED_GID"
deletion_event_type = "DELETION_CONSUMPTION"
subtype_rule = "every base event has exactly one subtype and that subtype agrees with event_type"
ack_head_relation = "operational_event_ack_head"
ack_rule = "one consumer high-water sequence per source revision advances monotonically only to an existing event in that same revision and only after that consumer has durable acknowledgement evidence for every existing event in the revision at or below the target sequence"

[source_build_generation_contract]
reservation_relation = "source_build_generation"
rule = "first begin or resume transactionally reserves at most one build for a generation; a strictly greater takeover generation may reserve the same build; a no-build generation has no row"
cleanup_rule = "before SOURCE_BUILD cleanup creates a job and before every destructive batch, each mapped generation must be durably completed or strictly superseded by the current coordination head; an unfinished current generation or any owner, lease, or handoff resume authority blocks phase one, while completed or superseded mappings and their residual canonical uploads are bounded owned children and make progress"

[cleanup_attempt_contract]
job_relation = "cleanup_job"
attempt_attribute = "cycle_generation"
allocation_rule = "advance positive portable int63 cycle_generation monotonically on the one reusable job row per fixed shard under lock or exact CAS; fail closed before 2^63 and derive cleanup_id exactly as SHA256(h2hdb-cleanup-cycle-v1 NUL target_kind)[0:7] || u8(shard_no) || u64be(cycle_generation), atomically remove the prior completion when opening, require exact recomputed cleanup_id plus checkpoint generation on every mutation, require completion cycle_generation equals job cycle_generation and job state COMPLETE on replay, and reject every stale generation"

[cleanup_reachability_contract]
version = 1
target_registry_relation = "cleanup_target_kind"
sweep_registry_relation = "cleanup_sweep_target"
phase_registry_relation = "cleanup_phase"
job_relation = "cleanup_job"
checkpoint_relation = "cleanup_checkpoint"
target_key_bytes = 32
registry_rule = "target kinds and phases are exact provider-seeded rows; runtime dispatch is a closed-world map from registered IDs to versioned writer functions and never interpolates a relation, predicate, blocker, or phase from database text"
eligibility_rule = "under the maintenance gate and one transaction, decode the exact target key, lock the target when present, evaluate the registered eligibility predicate and every registered blocker, and create a cleanup job only when no retention root reaches the target"
phase_rule = "a checkpoint phase must belong to its jobs target kind; complete phases in strictly increasing phase_order; each batch deletes only the registered relation set child-first and commits rows, receipt, and checkpoint CAS atomically"
completion_rule = "a cleanup job becomes COMPLETE only after every registered phase has a durable empty terminal receipt, the target root phase completed, and a final blocker recheck still finds no reachable retention root"
compaction_rule = "each page commit atomically advances checkpoint generation and replaces the prior ambiguity receipt so at most one receipt per live checkpoint is retained; terminal transaction updates cleanup_job COMPLETE and completed_at, upserts the shard latest cleanup_completion generation/final chain/deleted count, deletes live receipts then checkpoints, and makes completion the response-loss replay authority; stale generations cannot resume"

[cleanup_sweep_protocol]
version = 1
shard_count = 256
target_key_codec = "target_kind_tag16_u64be_zero8_v1"
cleanup_id_codec = "target_kind_tag7_u8_shard_u64be_cycle_v1"
cleanup_id_domain = "h2hdb-cleanup-cycle-v1"
cycle_generation_minimum = 1
cycle_generation_overflow = "fail_closed_before_2^63"
active_receipts_per_checkpoint = 1
history_rule = "one reusable job and latest completion per fixed shard; long-lived audit history belongs in a separate append-only audit stream, not cleanup control tables"

[hash_cache_cleanup_contract]
version = 1
policy_relation = "cleanup_job"
max_age_attribute = "hash_cache_max_age_microseconds"
cycle_cutoff_attribute = "cycle_cutoff_at"
gate_rule = "exclusive maintenance gate excludes concurrent hash-cache readers and writers"
eligibility_rule = "observed_at <= cycle_cutoff_at - hash_cache_max_age_microseconds with checked nonnegative subtraction"

[[cleanup_target]]
target_kind = "SOURCE_BUILD"
mode = "SWEEP"
sweep_shard_count = 256
selection_order_id = "uuid_first_byte_then_uuid_v1"
root_relation = "source_build"
root_key = ["build_id"]
key_codec = "target_kind_tag16_u64be_zero8_v1"
eligible_predicate_id = "source_build_unreferenced_v1"
blocker_query_id = "source_build_retention_roots_v1"
writer_hook = "h2hdb.cleanup.source_build.v1"
retention_roots = ["analysis_run.build_id", "source_working_build.build_id", "operational_preparation.build_id", "gallery_observation_staging.build_id", "a source_build_generation mapping whose generation is neither completed nor strictly superseded"]
retained_fk_edges = [{ relation = "analysis_run", attributes = ["build_id"] }]
operational_blockers = [{ relation = "source_working_build", attributes = ["build_id"] }, { relation = "operational_preparation", attributes = ["build_id"] }, { relation = "gallery_observation_staging", attributes = ["build_id"] }]
phases = [
  { phase = "SB_CANONICAL_UPLOAD", order = 1, relations = ["canonical_value_upload"] },
  { phase = "SB_GALLERY", order = 2, relations = ["build_manifest", "source_build_discovery", "source_build_gallery"] },
  { phase = "SB_SATELLITES", order = 3, relations = ["source_build_base_source", "source_build_channel"] },
  { phase = "SB_GENERATION", order = 4, relations = ["source_build_generation"] },
  { phase = "SB_ROOT", order = 5, relations = ["source_build"] },
]
conditional_child_rules = [{ relation = "source_build_generation", upload_relation = "canonical_value_upload", generation_attribute = "generation", coordination_head_relation = "ingest_coordination_head", generation_relation = "ingest_generation", owner_relation = "ingest_generation_owner", handoff_relation = "ingest_generation_handoff", rule = "before job creation, phase one, and every destructive batch, lock and recheck every mapping for the selected build; any mapping not durably completed and not strictly superseded by the current coordination head blocks the whole job before deletion. For an eligible mapping, bounded cleanup deletes residual canonical_value_upload claims after the same completed-or-superseded recheck and finally deletes the mapping; current owner, lease, or handoff resume authority always rejects" }]
terminal_staging_rule = "every remaining staging FK blocks SOURCE_BUILD job creation. OPEN is a live blocker; SEALED and REUSED are pending work for the independent GALLERY_OBSERVATION_STAGING compactor, which preserves final membership and data facts. Therefore SB_GALLERY starts only after terminal control rows are compacted, eliminating the staging-to-membership cleanup cycle"

[[cleanup_target]]
target_kind = "ANALYSIS_RUN"
mode = "SWEEP"
sweep_shard_count = 256
selection_order_id = "uuid_first_byte_then_uuid_v1"
root_relation = "analysis_run"
root_key = ["analysis_id"]
key_codec = "target_kind_tag16_u64be_zero8_v1"
eligible_predicate_id = "analysis_run_unpublished_leaf_v1"
blocker_query_id = "analysis_descendant_reachability_v1"
writer_hook = "h2hdb.cleanup.analysis_run.v1"
retention_roots = ["publication_candidate.analysis_id", "analysis_baseline.base_analysis_id", "analysis_state_anchor.anchor_analysis_id", "analysis_state_ancestry.ancestor_analysis_id"]
conditional_blockers = ["source_head.source_revision->source_revision_provenance.analysis_id when the revision is the active channel head"]
retained_fk_edges = [{ relation = "analysis_baseline", attributes = ["base_analysis_id"] }, { relation = "analysis_state_anchor", attributes = ["anchor_analysis_id"] }, { relation = "analysis_state_ancestry", attributes = ["ancestor_analysis_id"] }, { relation = "publication_candidate", attributes = ["analysis_id"] }]
phases = [
  { phase = "AR_BATCH", order = 1, relations = ["source_revision_provenance", "analysis_batch_receipt"] },
  { phase = "AR_SEALS", order = 2, relations = ["analysis_state_component_seal"] },
  { phase = "AR_OVERLAY", order = 3, relations = ["analysis_file_hash_decision_shadow", "analysis_file_hash_decision_tombstone", "analysis_content_owner_candidate_shadow", "analysis_content_owner_candidate_tombstone", "analysis_content_owner_shadow", "analysis_content_owner_tombstone", "analysis_gid_candidate_shadow", "analysis_gid_candidate_tombstone", "analysis_gid_winner_shadow", "analysis_gid_winner_tombstone"] },
  { phase = "AR_EVIDENCE", order = 4, relations = ["analysis_file_hash_artist_contribution", "analysis_file_hash_artist_stat", "analysis_file_hash_gallery_artist_stat", "analysis_file_hash_decision", "analysis_changed_gallery", "analysis_changed_file_hash", "analysis_exclusion_delta", "analysis_impacted_gallery", "analysis_impacted_content", "analysis_impacted_gid", "analysis_content_owner_candidate", "analysis_content_owner", "analysis_gid_candidate", "analysis_gid_winner"] },
  { phase = "AR_CHECKPOINT", order = 5, relations = ["analysis_checkpoint"] },
  { phase = "AR_ANCESTRY", order = 6, relations = ["analysis_state_ancestry"] },
  { phase = "AR_LINKS", order = 7, relations = ["analysis_state_anchor", "analysis_baseline"] },
  { phase = "AR_ROOT", order = 8, relations = ["analysis_run"] },
]

[[cleanup_target]]
target_kind = "PUBLICATION_CANDIDATE"
mode = "SWEEP"
sweep_shard_count = 256
selection_order_id = "uuid_first_byte_then_uuid_v1"
root_relation = "publication_candidate"
root_key = ["candidate_id"]
key_codec = "target_kind_tag16_u64be_zero8_v1"
eligible_predicate_id = "publication_candidate_inactive_v1"
blocker_query_id = "publication_candidate_retention_roots_v1"
writer_hook = "h2hdb.cleanup.publication_candidate.v1"
retention_roots = ["catalog_working_candidate.candidate_id", "publication_head.revision->publication_receipt.revision where publication_receipt.reserved_revision=publication_candidate.reserved_revision", "publication_receipt.reserved_revision where state is not FINALIZED"]
retained_fk_edges = []
semantic_blockers = [{ relation = "publication_receipt", attributes = ["reserved_revision"], root_attributes = ["reserved_revision"], semantic_obligation_id = "catalog.retention.v1" }]
operational_blockers = [{ relation = "catalog_working_candidate", attributes = ["candidate_id"] }]
phases = [
  { phase = "PC_DELTAS", order = 1, relations = ["artifact_delta_new", "artifact_delta_old", "artifact_operation", "prepared_artifact"] },
  { phase = "PC_INPUT", order = 2, relations = ["artifact_input"] },
  { phase = "PC_SELECTION", order = 3, relations = ["publication_selection"] },
  { phase = "PC_BATCH", order = 4, relations = ["publication_batch_receipt"] },
  { phase = "PC_CHECKPOINT", order = 5, relations = ["publication_checkpoint"] },
  { phase = "PC_BASES", order = 6, relations = ["publication_candidate_base_catalog", "publication_candidate_base_source"] },
  { phase = "PC_ROOT", order = 7, relations = ["publication_candidate"] },
]

[[cleanup_target]]
target_kind = "OPERATIONAL_PREPARATION"
mode = "SWEEP"
sweep_shard_count = 256
selection_order_id = "uuid_first_byte_then_uuid_v1"
root_relation = "operational_preparation"
root_key = ["preparation_id"]
key_codec = "target_kind_tag16_u64be_zero8_v1"
eligible_predicate_id = "operational_preparation_terminal_detached_v1"
blocker_query_id = "operational_preparation_resume_authority_v1"
writer_hook = "h2hdb.cleanup.operational_preparation.v1"
retention_roots = ["exclusive maintenance gate is held", "state ABANDONED requires activation absent", "COMPLETE remains conservatively retained because activation lacks an exact effect-completeness receipt", "FAILED is never eligible and requires a fenced transition to ABANDONED"]
outliving_relations = ["operational_activation", "operational_event", "operational_event_ack", "operational_event_ack_head"]
rationale = "Activation intentionally has no preparation FK. Once durably persisted it, its events, and acknowledgements outlive source storage. Until activation has an exact effect-completeness receipt, COMPLETE preparation remains retained; cleanup accepts only durable ABANDONED state with activation absent under the exclusive gate, never a caller boolean or unscoped maintenance_work_state."
phases = [
  { phase = "OP_BATCH", order = 1, relations = ["operational_preparation_batch_receipt"] },
  { phase = "OP_CHECKPOINT", order = 2, relations = ["operational_preparation_checkpoint"] },
  { phase = "OP_ROOT", order = 3, relations = ["operational_preparation"] },
]

[[cleanup_target]]
target_kind = "GALLERY_OBSERVATION"
mode = "SWEEP"
sweep_shard_count = 256
selection_order_id = "gallery_id_mod_256_then_gallery_id_observation_id_v1"
root_relation = "gallery_observation_allocation"
root_key = ["gallery_id", "observation_id"]
key_codec = "target_kind_tag16_u64be_zero8_v1"
eligible_predicate_id = "gallery_observation_unreferenced_v1"
blocker_query_id = "gallery_observation_retention_roots_v1"
writer_hook = "h2hdb.cleanup.gallery_observation.v1"
retention_roots = ["source_build_gallery exact gallery and observation identity", "analysis or publication retained references outside the observation-local subtree", "OPEN staging with a live outer ingest claim", "SEALED staging linked to this allocation", "REUSED staging until its build link durably names a different sealed observation"]
retained_fk_edges = [{ relation = "source_build_gallery", attributes = ["gallery_id", "observation_id"] }]
conditional_blockers = [{ relation = "gallery_observation_staging", claim_relation = "gallery_observation_staging_claim", state_attribute = "state", ingest_generation_attribute = "ingest_generation", claim_generation_attribute = "claim_generation", owner_relation = "ingest_generation_owner", lease_relation = "ingest_generation_lease", rule = "under row locks and exact header plus claim recheck, cleanup rejects OPEN with a live outer lease and every SEALED allocation linked by source_build_gallery; ABANDONED is eligible only after its claim generation is stale, while REUSED becomes eligible only after the durable build link names a different sealed observation; every bounded batch rechecks the same header state, ingest generation, and claim generation" }]
predecessor_selectors = [{ relation = "gallery_observation_staging_request_predecessor", attribute = "request_sha256", owner_relation = "gallery_observation_staging_request_owner", owner_attribute = "request_sha256" }]
predecessor_blockers = [{ relation = "gallery_observation_staging_request_predecessor", incoming_attribute = "prior_request_sha256", successor_attribute = "request_sha256", owner_relation = "gallery_observation_staging_request_owner", owner_request_attribute = "request_sha256", owner_staging_attribute = "staging_id", rule = "lock both request_owner rows; an incoming edge whose successor owner differs from the selected staging blocks cleanup and is never deleted by that staging" }]
phases = [
  { phase = "GO_STAGING_RECEIPT_FRONTIER", order = 1, relations = ["gallery_observation_staging_receipt", "gallery_observation_staging_frontier", "gallery_observation_staging_match_receipt"] },
  { phase = "GO_STAGING_PAGE_ASSOCIATION", order = 2, relations = ["gallery_observation_staging_request_page"] },
  { phase = "GO_STAGING_REQUEST_DESCRIPTOR", order = 3, relations = ["gallery_observation_staging_page_request", "gallery_observation_staging_match_request", "gallery_observation_staging_request_predecessor", "gallery_observation_staging_request_chunk"] },
  { phase = "GO_STAGING_REQUEST_IDENTITY", order = 4, relations = ["gallery_observation_staging_request_owner", "gallery_observation_staging_request"] },
  { phase = "GO_STAGING_CHECKPOINT", order = 5, relations = ["gallery_observation_staging_checkpoint", "gallery_observation_staging_match_checkpoint", "gallery_observation_staging_metadata_parser"] },
  { phase = "GO_STAGING_CLAIM", order = 6, relations = ["gallery_observation_staging_claim"] },
  { phase = "GO_STAGING_ROOT", order = 7, relations = ["gallery_observation_staging"] },
  { phase = "GO_FACTS", order = 8, relations = ["gallery_observation_file_hash_occurrence", "gallery_observation_artist", "gallery_manifest", "gallery_observation_tag", "gallery_observation_file_filesystem"] },
  { phase = "GO_FILES", order = 9, relations = ["gallery_observation_file"] },
  { phase = "GO_DESCRIPTOR", order = 10, relations = ["gallery_observation", "gallery_observation_tree_root", "gallery_observation_allocation_page", "gallery_observation_metadata", "gallery_observation_scan", "gallery_observation_discovery_fingerprint", "gallery_observation_metadata_digest", "gallery_observation_raw_content", "gallery_observation_page_count", "gallery_observation_directory"] },
  { phase = "GO_ROOT", order = 11, relations = ["gallery_observation_allocation"] },
]

[[cleanup_target]]
target_kind = "GALLERY_OBSERVATION_STAGING"
mode = "SWEEP"
sweep_shard_count = 256
selection_order_id = "uuid_first_byte_then_uuid_v1"
root_relation = "gallery_observation_staging"
root_key = ["staging_id"]
key_codec = "target_kind_tag16_u64be_zero8_v1"
eligible_predicate_id = "gallery_observation_staging_terminal_v1"
blocker_query_id = "gallery_observation_staging_live_or_unsealed_v1"
writer_hook = "h2hdb.cleanup.gallery_observation_staging.v1"
retention_roots = ["OPEN staging", "SEALED without an exact source_build_gallery link to its own final observation", "REUSED without an exact source_build_gallery link to a different byte-equal sealed observation", "any changed header or claim fence during a batch"]
retained_fk_edges = []
compaction_rule = "under the exclusive maintenance gate, keyset-select terminal staging headers in fixed digest shards; lock and recheck header, claim, exact source_build_gallery outcome, and final observation. SEALED is eligible only after the link names its own final allocation; REUSED only after the link names a different final observation. Delete at most the fixed batch bound child-first; predecessor_selectors delete only outgoing rows whose request_sha256 owner is this staging. Runtime locks both owners and rejects every cross-owner predecessor at insertion; any corrupt incoming edge from another staging is a cleanup blocker and is never deleted by this staging. Preserve gallery_observation_allocation, allocation_page, normalized facts, roots, pages, and final membership. OPEN always blocks; after compaction only live OPEN staging blocks SOURCE_BUILD cleanup. A REUSED allocation with no remaining staging header, final gallery_observation, or source_build_gallery reference is an exact GALLERY_OBSERVATION orphan eligible for bounded data cleanup"
predecessor_selectors = [{ relation = "gallery_observation_staging_request_predecessor", attribute = "request_sha256", owner_relation = "gallery_observation_staging_request_owner", owner_attribute = "request_sha256" }]
predecessor_blockers = [{ relation = "gallery_observation_staging_request_predecessor", incoming_attribute = "prior_request_sha256", successor_attribute = "request_sha256", owner_relation = "gallery_observation_staging_request_owner", owner_request_attribute = "request_sha256", owner_staging_attribute = "staging_id", rule = "lock both request_owner rows; an incoming edge whose successor owner differs from the selected staging blocks cleanup and is never deleted by that staging" }]
phases = [
  { phase = "GOS_RECEIPT_FRONTIER", order = 1, relations = ["gallery_observation_staging_receipt", "gallery_observation_staging_frontier", "gallery_observation_staging_match_receipt"] },
  { phase = "GOS_PAGE_ASSOCIATION", order = 2, relations = ["gallery_observation_staging_request_page"] },
  { phase = "GOS_REQUEST_DESCRIPTOR", order = 3, relations = ["gallery_observation_staging_page_request", "gallery_observation_staging_match_request", "gallery_observation_staging_request_predecessor", "gallery_observation_staging_request_chunk"] },
  { phase = "GOS_REQUEST_IDENTITY", order = 4, relations = ["gallery_observation_staging_request_owner", "gallery_observation_staging_request"] },
  { phase = "GOS_CHECKPOINT", order = 5, relations = ["gallery_observation_staging_checkpoint", "gallery_observation_staging_match_checkpoint", "gallery_observation_staging_metadata_parser"] },
  { phase = "GOS_CLAIM", order = 6, relations = ["gallery_observation_staging_claim"] },
  { phase = "GOS_ROOT", order = 7, relations = ["gallery_observation_staging"] },
]

[[cleanup_target]]
target_kind = "ARTIFACT_BLOB"
