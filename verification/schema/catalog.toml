contract_version = 1
name = "h2hdb-vnext-catalog"
description = "Logical vNext catalog data-plane contract; physical indexes, SQL types, and operational control-plane schemas are specified separately."
scope = "catalog_data_plane"
excluded_operational_components = [
  "schema migration and compatibility bookkeeping",
  "connector and transaction implementation details",
  "ingest leases, token fencing, and the database gate",
  "download, removed-GID, and source-deletion operational queues",
  "runtime redownload state and maintenance scheduling",
  "filesystem discovery progress and the file-hash cache",
  "artifact-store filesystem protection and Komga projection journals",
  "bounded cleanup and pruning orchestration",
]

[canonical_digest_contract]
policy_relation = "canonical_digest_policy"
value_relation = "canonical_value_identity"
digest_attribute = "value_sha256"
allocation_relation = "canonical_value_allocation"
page_relation = "canonical_value_page"
descriptor_relation = "canonical_value_page_descriptor"
parent_relation = "canonical_value_page_parent"
root_attribute = "root_page_sha256"
byte_count_attribute = "byte_count"
algorithm = "SHA-256"
algorithm_version = 1
encoding = "opaque_bytes"
framing = "ascii('h2hdb-vnext-canonical-value\\0') || u32be(codec_version) || u32be(digest_domain_length) || digest_domain_ascii || u64be(payload_length) || payload"
collision_model = "collision_free_identity_domain"
write_obligation = "resolve an exact registered stable ASCII digest_domain and obtain declared byte_count before hashing because the canonical wrapper places u64be(payload_length) before payload; if upstream length is unknown, pass zero uses an environment-owned durable bounded-I/O spool to count bytes; pass one frames declared byte_count, streams SHA-256 while verifying the consumed count and exact EOF, and rejects mismatch before allocation; pass two replays from offset zero into deterministic owner-scoped 32768-byte leaf chunks and fanout-256 pages in bounded transactions under canonical_value_allocation; byte-compare every idempotent page conflict; insert canonical_value_identity last only after exact tree validation; a crash may replay from zero in O(n) time but no database transaction or bind is unbounded"
read_obligation = "join through final canonical_value_identity and stream its owner-scoped page tree in exact offset order; recompute the domain-separated digest and exact byte_count incrementally, reject missing, duplicate, reordered, truncated, trailing, cross-owner, or noncanonical pages, and never reconstruct or compare identity from truncated or collation-folded text"

[canonical_value_page_contract]
codec_version = 1
prefix = "h2hdb-vnext-canonical-value-page\\0"
maximum_page_bytes = 65536
chunk_maximum_bytes = 32768
branch_capacity = 256
maximum_level = 8
maximum_byte_count = 9223372036854775807
framing = "ascii('h2hdb-vnext-canonical-value-page\\0') || u32be(version=1) || raw32(owner_value_sha256) || u8(node: LEAF=0,BRANCH=1) || u8(level=0..8) || u64be(page_position_int63) || u64be(subtree_byte_count_int63) || u32be(entry_count) || exact_records"
leaf_record = "u64be(byte_offset_int63) || u32be(chunk_length) || exact_chunk_bytes; leaf entry_count is one for nonempty values and zero only for the unique empty value leaf; offsets start zero and are contiguous; every nonfinal chunk is exactly 32768 bytes and final chunk is 1..32768 including an exact-multiple full final chunk"
branch_record = "raw32(child_page_sha256) || u64be(child_subtree_byte_count_int63); child digests are unique and same-owner child page level is parent level minus one"
canonical_tree_rule = "page_position is zero-based contiguous independently at every level; every nonfinal branch is full fanout 256, the final branch has 1..256 children, root height is minimal with no unary root wrapper, subtree counts use unbounded host arithmetic then signed-int63 without wrap, and the page frame includes owner_value_sha256 so pages cannot be shared across canonical values and every nonroot deterministic page has exactly one parent"
collision_obligation = "page_sha256 is raw SHA-256 of the exact owner-prefixed page frame; on every existing digest compare page bytes byte-for-byte and reject cross-owner reuse"
seal_obligation = "canonical_value_identity(value_sha256,root_page_sha256) is inserted last only after allocation domain/count congruence, complete deterministic tree validation, exact root owner/count equality, and incremental recomputation of the canonical wrapper digest; identity seal alone retains the canonical_value_upload claim until the first retention-blocking external consumer handoff transaction; a phase-owned dictionary or type row alone never releases the claim; existing canonical foreign keys reference only this final seal"
cleanup_rule = "CANONICAL_VALUE cleanup is rooted at canonical_value_allocation; final-identity foreign keys and operational canonical_value_upload(generation,value_sha256), keyed only by that pair so multiple takeover generations may protect the same value, block cleanup; generation is SQL-bound to the ingest-generation owner; the first allocation plus upload claim commits atomically under the exact live coordination head, owner, and lease; source_root_v1 is the sole pre-mapping exception because its final identity is required before source_scope, source_build, and source_build_generation can exist, and the same live turn creates that mapping after sealing the root; every other digest domain requires its durable source_build_generation mapping before allocation or claim; a newer-generation resume exact-compares the existing allocation domain/count and every deterministic page conflict; every allocation, page, and seal holds the shared canonical-value maintenance gate and rechecks the live head/owner/lease/claim, while a cleanup cycle holds its exclusive form; inserting or validating the final identity never releases its upload claim by itself; the first retention-blocking external consumer and deletion of only that generation claim commit atomically, while a phase-owned dictionary or type row alone never releases the claim; for source_root_v1 that handoff transaction inserts source_scope, source_build, and source_build_generation before deleting the claim; independent bounded cleanup removes residual claims only after their generation is completed or strictly superseded, including a crash after identity seal but before consumer handoff and a crashed source_root_v1 pre-mapping claim whose generation has no source_build_generation row, and only then may source-build cleanup delete a mapping that does exist; finally delete an unblocked identity, parent edges, descriptors, owner pages, and allocation child-first; owner-prefixed pages are never shared across allocations"

