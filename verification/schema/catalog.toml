[effective_content_contract]
reference_attribute = "content_sha256"
canonical_value_relation = "canonical_value_identity"
canonical_digest_attribute = "value_sha256"
digest_domain = "effective_content_v1"
encoding_version = 1
framing = "ascii('h2hdb-vnext-effective-content\\0') || u32be(encoding_version) || u64be(file_count) || repeated raw32(file_sha256) in unsigned bytewise ascending file_sha256 order after joining file_name_identity and retaining only resolved non-excluded CONTENT entries; duplicate digests remain repeated"
collision_model = "collision_checked_stored_identity"
write_obligation = "production prepares effective content only as a database-owned private typed EffectiveContentPreparation, never as caller authority: from one immutable SEALED source_build snapshot and immutable COMPLETE analysis snapshot, stream only resolved non-excluded CONTENT file_sha256 values by an unsigned-bytewise keyset query into a deterministic external spool and typed receipt outside every canonical page transaction; exclude METADATA and resolved spam, preserve duplicate digests, and bind the receipt to the exact sealed build identity, sealed analysis identity, live ingest generation, file_count, byte_count, content_sha256, and private spool identity, while no public API accepts digest, count, sequence, or receipt authority; the exact framed sequence deterministically yields content_sha256, while digest-to-sequence is only a stored relation FD established by UNIQUE, full-preimage comparison, rejection on mismatch, and the immutable canonical_value_identity seal under the collision-checked stored-identity rule; stream the exact permutation-invariant but multiplicity-sensitive frame through iter_effective_content_payload_ordered, effective_content_digest_ordered, and canonical_value_digest_parts without materializing the full sequence; bounded canonical page transactions validate and CAS the live-generation canonical_value_upload claim and resume only from database receipts; final candidate handoff runs in one transaction, locks and validates the private typed receipt, immutable SEALED build and COMPLETE analysis canonical identities, sealed canonical_value_identity, and the same current live-generation claim, writes the candidate, then deletes that claim; immutable snapshots permit deterministic spool and receipt reconstruction after response loss; every digest conflict recomputes content_sha256 and byte-compares the full preimage; no audit digest, caller-supplied digest/count/sequence/receipt, or unsealed snapshot authorizes write, resume, or handoff"
read_obligation = "join every content_sha256 through canonical_value_identity, stream-validate the effective_content_v1 digest domain, declared file_count, unsigned-bytewise order, multiplicity, exact framed preimage, and exact EOF before exposing authority, and never use an unverified or non-authoritative grouping checksum as content identity"

