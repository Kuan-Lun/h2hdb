text = "construct the payload only from one COMPLETED analysis policy natural tuple and its fully sealed resolved snapshot; join gallery_id surrogates through gallery_identity.gallery_key; require every gallery entry to carry its exact observation identity, positive GID, and an explicit content_present byte where zero encodes an empty or metadata-only gallery and is distinct from every 32-byte digest; include every resolved spam decision as the exact occurrence_count, artist_count, maximum_gallery_artist_count, and derived excluded_flag fields without granting identity authority to evidence_sha256; include every content owner and GID winner exactly once as its group key plus stable winner gallery_key without granting identity authority to decision_sha256; require owner/winner gallery keys to be members of the same snapshot; validate the three declared aggregate counts against the encoded snapshot; obtain exact section counts, payload_byte_count, order, membership, and aggregate evidence in a bounded preflight/keyset receipt, then replay through iter_source_snapshot_manifest_payload_rows_ordered and source_snapshot_manifest_digest_ordered into canonical_value_digest_parts without materializing the snapshot; recompute the canonical digest and byte-compare the complete payload on collision"
