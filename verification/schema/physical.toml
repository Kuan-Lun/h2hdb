[[runtime_obligation_binding]]
path = "source_snapshot_manifest_contract.handoff_obligation"
text = "analysis completion accepts only a database-owned private typed canonical snapshot plan derived from the OPEN snapshot-ready analysis; after bounded canonical upload seals source_snapshot_manifest_identity, one transaction locks and validates that typed plan, the same OPEN analysis and all five immutable component seals, the sealed canonical identity, and the live-generation canonical_value_upload claim, inserts analysis_snapshot_manifest(analysis_id,snapshot_manifest_sha256), deletes exactly that claim, and CAS-transitions analysis_run from OPEN to COMPLETE with completed_at; all three mutations commit or roll back together; response loss replays by the analysis_id natural key and accepts only COMPLETE plus exact binding digest equality with the claim absent, and no caller digest, input_manifest_sha256, audit digest, count, or receipt is output authority"
