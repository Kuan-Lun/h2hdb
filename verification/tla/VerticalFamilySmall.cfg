\* Required finite profile.  TLC success is exhaustive only for these exact
\* two family keys and two member kinds.  It is not an unbounded proof and
\* does not establish Python, SQL, transaction, isolation, or backend
\* refinement.
SPECIFICATION Spec

\* Safety-preserving fingerprint quotient for this invariant-only profile.
\* It must not be used as liveness or event-reachability evidence.
VIEW SafetyView

CONSTANTS
    Keys = {key1, key2}
    Members = {sharedMember, localMember}
    SharedMember = sharedMember

INVARIANTS
    TypeOK
    VisibleImpliesAllMembers
    PartialNeverVisible
    SealOnlyIfTotal
    SealImmutable
    ReplayObservational
    CrashPreservesDurableState
    CleanupNeverLeavesVisiblePartial
    ChildFirstCleanup
    SharedMemberRetention
