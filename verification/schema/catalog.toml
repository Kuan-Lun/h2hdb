[[decomposition]]
name = "catalog_publication_and_title_basis"
universal_attributes = [
  "revision",
  "gallery_id",
  "publication_key",
  "source_title_sha256",
  "source_gallery_name",
  "summary_sha256",
  "language_sha256",
  "modified_at",
  "download_time",
]
fds = [
  { determinant = ["gallery_id"], dependent = ["publication_key"] },
  { determinant = ["source_gallery_name"], dependent = ["publication_key"] },
  { determinant = ["revision", "gallery_id"], dependent = ["publication_key", "source_title_sha256", "source_gallery_name", "summary_sha256", "language_sha256", "modified_at", "download_time"] },
  { determinant = ["revision", "publication_key"], dependent = ["gallery_id", "source_title_sha256", "source_gallery_name", "summary_sha256", "language_sha256", "modified_at", "download_time"] },
]
projections = [
  { relation = "catalog_publication", attributes = ["revision", "publication_key", "gallery_id", "summary_sha256", "language_sha256", "modified_at", "download_time"] },
  { relation = "catalog_publication_title", attributes = ["revision", "publication_key", "source_title_sha256", "source_gallery_name"] },
]
rationale = "Expose the historical publication and title read shapes from the normalized occurrence storage. The publication occurrence key determines the shared intersection, while gallery_id -> publication_key and source_gallery_name -> publication_key are declared explicitly in their respective logical projections; the binary read decomposition is lossless and dependency-preserving without claiming either denormalized view is a physical BCNF base."

[[decomposition]]
name = "publication_identity_and_gallery_upload_time"
universal_attributes = [
  "publication_key",
  "gid",
  "upload_time",
]
fds = [
  { determinant = ["publication_key"], dependent = ["gid", "upload_time"] },
  { determinant = ["gid"], dependent = ["publication_key", "upload_time"] },
]
projections = [
  { relation = "publication_identity", attributes = ["publication_key", "gid"] },
  { relation = "gallery_upload_time", attributes = ["gid", "upload_time"] },
]
rationale = "Separate the collision-checked publication-key/GID bijection from immutable upstream upload time. Their shared GID is a key of both projections, so the join is lossless and catalog published_at is a total read-time alias of upload_time rather than stored occurrence state."

[[decomposition]]
name = "catalog_publication_and_optional_content"
universal_attributes = [
