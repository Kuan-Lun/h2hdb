[[attribute_semantic]]
name = "batch_key"
classification = "idempotency_key"
rationale = "Server-derived domain-separated SHA-256 of the frozen exact staging request frame including checkpoint prestate, page body identity, and terminal intent; caller text never chooses retry identity or cursor authority."

[[attribute_semantic]]
name = "build_id"
classification = "domain_discriminator"
rationale = "Reference to an immutable source build owned by the data-plane contract."

[[attribute_semantic]]
name = "candidate_id"
classification = "domain_identifier"
rationale = "Reference to a publication candidate owned by the data-plane contract."

[[attribute_semantic]]
name = "cleanup_id"
classification = "surrogate_identifier"
rationale = "Opaque identity of one bounded cleanup job."

[[attribute_semantic]]
name = "frozen_root_key"
classification = "protocol_identity"
rationale = "Canonical versioned cleanup-protocol frame for one registered typed root tuple. Runtime decodes it back to the declared root columns before SQL comparison; it is not business payload, EAV, JSON, or a device for hiding ordinary attributes."

[[attribute_semantic]]
name = "frozen_root_count"
classification = "bounded_aggregate_count"
rationale = "Immutable count of the complete per-cycle frozen root set, hard-capped by max_rows_per_transaction and 256."

[[attribute_semantic]]
name = "frozen_root_set_sha256"
classification = "protocol_seal_digest"
rationale = "Domain-separated digest of cleanup_id plus the complete sorted length-framed frozen_root_key set; it seals membership but is not root identity authority."

[[attribute_semantic]]
name = "retained_request_count"
classification = "bounded_aggregate_count"
rationale = "Seeded singleton accounting authority for exact retained staging request identities. Fresh insert reserves one only after replay resolution; every retirement or generic-cleanup request deletion releases exactly the actual affected-row count in the same transaction."

[[attribute_semantic]]
name = "phase_order"
classification = "ordinal"
rationale = "Positive child-first ordinal unique within a registered cleanup target kind."

[[attribute_semantic]]
name = "cycle_generation"
classification = "fencing_counter"
rationale = "Monotone fixed-shard cleanup cycle fence checked by every checkpoint, receipt, completion, mutation, and replay."

[[attribute_semantic]]
name = "shard_no"
classification = "ordering_key"
rationale = "Bounded 0..255 sweep shard coordinate; it is not a per-data-row cleanup identity."

[[attribute_semantic]]
name = "deleted_count"
classification = "aggregate_count"
rationale = "Monotonic count scoped to one cleanup checkpoint; it is not an identity."

[[attribute_semantic]]
name = "event_id"
classification = "surrogate_identifier"
rationale = "Opaque immutable operational-event identity."

[[attribute_semantic]]
name = "event_sha256"
classification = "audit_digest"
rationale = "Checksum of canonical event payload used for replay auditing, not as an identity."

[[attribute_semantic]]
name = "file_sha256"
classification = "payload_reference_digest"
rationale = "Reference to immutable bytes whose digest authority is content_blob in catalog.toml."

[[attribute_semantic]]
name = "fingerprint_sha256"
classification = "domain_identifier"
rationale = "Role-qualified foreign key to canonical_value_identity.value_sha256 under the registered filesystem_fingerprint_v1 policy; the external relation owns digest-to-exact-preimage authority."

[[attribute_semantic]]
name = "final_chain_sha256"
classification = "audit_digest"
rationale = "Terminal rolling receipt-chain digest retained for compact response-loss replay, operational effect completeness, and audit; cleanup identity remains cleanup_id."

[[attribute_semantic]]
name = "event_count"
classification = "aggregate_count"
rationale = "Exact contiguous event-prefix cardinality sealed for one preparation; zero is valid only with no event rows and the registered empty-chain digest."

[[attribute_semantic]]
name = "gallery_id"
classification = "domain_identifier"
rationale = "Stable gallery identity owned by the data-plane contract."

[[attribute_semantic]]
name = "next_id"
classification = "fencing_counter"
rationale = "Positive portable int63 next identity in a named GALLERY, TAG, or shared POLICY stream; it is allocator state and never a database auto-increment value."

[[attribute_semantic]]
name = "request_sha256"
classification = "idempotency_key"
rationale = "Server-derived SHA-256 identity of one bounded, domain-separated exact request preimage. Deterministic child chunks are the collision authority, and exact replay never trusts this digest without complete concatenated byte equality and subtype re-encoding."

[[attribute_semantic]]
name = "prior_request_sha256"
classification = "idempotency_key"
rationale = "Nullable link to the exact previously committed request preimage; it is a monotone checkpoint precondition, not caller-provided cursor authority."

[[attribute_semantic]]
name = "regular_count"
classification = "aggregate_count"
rationale = "Exact DIRECTORY level-zero aggregate of decoded REGULAR records; every other component or level keeps zero, and bounded seal compares it to the independently matched FILE count."

[[attribute_semantic]]
name = "next_observation_id"
classification = "fencing_counter"
rationale = "Positive portable int63 next observation identity scoped to exactly one gallery; the current value is returned then advanced by exact generation CAS."

[[attribute_semantic]]
name = "observation_id"
classification = "domain_identifier"
rationale = "Positive gallery-local observation allocation identity; final visibility additionally requires a collision-checked canonical observation descriptor."

[[attribute_semantic]]
name = "staging_id"
classification = "surrogate_identifier"
rationale = "Opaque identity of one durable giant-gallery staging attempt; build/gallery and gallery/observation alternate keys prevent duplicate concurrent attempts."

[[attribute_semantic]]
name = "page_sha256"
classification = "payload_reference_digest"
rationale = "Reference to an immutable, domain-separated, exact canonical page owned by the data-plane contract; runtime recomputes page bytes and digest before accepting it."

[[attribute_semantic]]
name = "matched_count"
classification = "aggregate_count"
rationale = "Monotone exact count of FILE records verified by bounded keyed DIRECTORY lookup against reader-visible facts."

[[attribute_semantic]]
name = "start_matched_count"
classification = "aggregate_count"
rationale = "Exact precommit match count decoded from a committed lookup request; it is paired with staging identity and exact cursor bytes, never accepted as a standalone cursor."

[[attribute_semantic]]
name = "title_byte_count"
classification = "aggregate_count"
rationale = "Exact parsed UTF-8 byte length of the METADATA title field; arbitrary title bytes remain solely in the authenticated page tree."

[[attribute_semantic]]
name = "comment_byte_count"
classification = "aggregate_count"
rationale = "Exact parsed UTF-8 byte length of the METADATA comment field; arbitrary comment bytes remain solely in the authenticated page tree."

[[attribute_semantic]]
name = "upload_account_byte_count"
classification = "aggregate_count"
rationale = "Exact parsed UTF-8 byte length of the METADATA upload-account field; arbitrary text remains solely in the authenticated page tree."

[[attribute_semantic]]
name = "source_file_count"
classification = "aggregate_count"
rationale = "Exact bounded scalar parsed from METADATA and compared with the normalized observation scan row at seal."

[[attribute_semantic]]
name = "page_count"
classification = "aggregate_count"
rationale = "Exact bounded optional scalar parsed from METADATA and compared with the normalized page-count row at seal."

[[attribute_semantic]]
name = "value_sha256"
classification = "payload_reference_digest"
rationale = "Reference to an allocated canonical-value page graph; final identity and complete streamed byte comparison, not this digest alone, authorize use."

[[attribute_semantic]]
name = "input_sha256"
classification = "audit_digest"
rationale = "Exact page-input checksum; it detects retry drift but is not a row identity."

[[attribute_semantic]]
name = "receipt_input_sha256"
classification = "audit_digest"
rationale = "Exact latest cleanup page-input checksum stored atomically with the checkpoint poststate; it detects retry drift but is not row identity."

[[attribute_semantic]]
name = "receipt_batch_key"
classification = "idempotency_key"
rationale = "Caller attempt key retained only for exact replay of the latest cleanup checkpoint transition."

[[attribute_semantic]]
name = "receipt_start_cursor"
classification = "ordering_key"
rationale = "Server-owned pre-transition cursor for the latest cleanup checkpoint receipt; cursor_bytes is its exact post-transition cursor."

[[attribute_semantic]]
name = "receipt_prior_chain_sha256"
classification = "audit_digest"
rationale = "Exact pre-transition cleanup chain stored on the same checkpoint so runtime can recompute its current chain_sha256."

[[attribute_semantic]]
name = "receipt_prior_deleted_count"
classification = "aggregate_count"
rationale = "Exact pre-transition cleanup deletion count; deleted_count must equal it plus receipt_row_count."

[[attribute_semantic]]
name = "receipt_row_count"
classification = "aggregate_count"
rationale = "Exact bounded row count for the latest transition stored on its checkpoint; zero denotes the terminal empty page."

[[attribute_semantic]]
name = "manifest_sha256"
classification = "audit_digest"
rationale = "Schema-epoch manifest checksum; epoch and singleton state remain the authority."

[[attribute_semantic]]
name = "operational_policy_id"
classification = "surrogate_identifier"
rationale = "Opaque identity of one preparation semantics and batching policy."

[[attribute_semantic]]
name = "output_sha256"
classification = "audit_digest"
rationale = "Exact page-decision checksum for idempotent replay, not an identity."

[[attribute_semantic]]
name = "owner_token"
classification = "idempotency_key"
rationale = "Unpredictable owner capability whose exact generation binding is explicitly relational."

[[attribute_semantic]]
name = "preparation_id"
classification = "surrogate_identifier"
rationale = "Opaque identity of one immutable operational preparation attempt."

[[attribute_semantic]]
name = "row_count"
classification = "aggregate_count"
rationale = "Exact number of rows committed by one bounded batch receipt."

[[attribute_semantic]]
name = "final_deleted_count"
classification = "aggregate_count"
rationale = "Exact total deletion count retained only on a COMPLETE cleanup job as its latest-cycle replay result."

[[attribute_semantic]]
name = "chain_sha256"
classification = "audit_digest"
rationale = "Rolling checksum of committed checkpoint receipts; it is never accepted as coverage without the durable receipt sequence."

[[attribute_semantic]]
name = "processed_count"
classification = "aggregate_count"
rationale = "Monotonic preparation row count scoped by one checkpoint."

[[attribute_semantic]]
name = "start_processed_count"
classification = "aggregate_count"
rationale = "Exact immutable pre-batch source-build discovery count; authority requires the matching locked checkpoint and complete receipt tuple."

[[attribute_semantic]]
name = "next_processed_count"
classification = "aggregate_count"
rationale = "Exact database-derived post-batch source-build discovery count equal to start_processed_count plus row_count."

[[attribute_semantic]]
name = "processed_gallery_count"
classification = "aggregate_count"
rationale = "Monotone assembly count of exact expected membership rows independently matched to final observations."

[[attribute_semantic]]
name = "processed_file_count"
classification = "aggregate_count"
rationale = "Monotone assembly sum of immutable gallery_observation_stat.file_count values with checked int63 addition."

[[attribute_semantic]]
name = "processed_byte_count"
classification = "aggregate_count"
rationale = "Exact FILE size accumulator in gallery staging or build assembly; it is server-derived with checked int63 addition and zero for non-FILE gallery checkpoints."

[[attribute_semantic]]
name = "terminal_byte_count"
classification = "aggregate_count"
rationale = "Immutable terminal FILE byte-count authority captured by the staging seal CAS, retained after checkpoints are retired, and compared with the final observation stat before every bounded retirement or generic cleanup batch."

[[attribute_semantic]]
name = "start_gallery_count"
classification = "aggregate_count"
rationale = "Immutable assembly receipt prestate for matched expected gallery membership."

[[attribute_semantic]]
name = "next_gallery_count"
classification = "aggregate_count"
rationale = "Database-derived assembly receipt poststate for matched expected gallery membership."

[[attribute_semantic]]
name = "start_file_count"
classification = "aggregate_count"
rationale = "Immutable assembly receipt prestate for exact accumulated observation file counts."

[[attribute_semantic]]
name = "next_file_count"
classification = "aggregate_count"
rationale = "Database-derived assembly receipt poststate for exact accumulated observation file counts."

[[attribute_semantic]]
name = "start_byte_count"
classification = "aggregate_count"
rationale = "Immutable assembly receipt prestate for exact accumulated observation byte counts."

[[attribute_semantic]]
name = "next_byte_count"
classification = "aggregate_count"
rationale = "Database-derived assembly receipt poststate for exact accumulated observation byte counts."

[[attribute_semantic]]
name = "start_processed_byte_count"
classification = "aggregate_count"
rationale = "Exact gallery FILE checkpoint byte-count prestate captured by its latest response-loss receipt; non-FILE values are zero."

[[attribute_semantic]]
name = "next_processed_byte_count"
classification = "aggregate_count"
rationale = "Exact gallery FILE checkpoint byte-count poststate derived from verified FileContentReceipt sizes; non-FILE values are zero."

[[attribute_semantic]]
name = "manifest_chain_sha256"
classification = "audit_digest"
rationale = "Deterministic source-build assembly audit chain; exact membership and terminal counters, never this digest, authorize sealing."

[[attribute_semantic]]
name = "start_manifest_chain_sha256"
classification = "audit_digest"
rationale = "Immutable pre-batch copy of the source-build assembly audit chain, never transition authority by itself."

[[attribute_semantic]]
name = "next_manifest_chain_sha256"
classification = "audit_digest"
rationale = "Database-derived post-batch source-build assembly audit chain, retained only for exact replay and diagnosis."

[[attribute_semantic]]
name = "singleton_id"
classification = "domain_identifier"
rationale = "Physical singleton slot; CHECK constraints restrict its sole value to one."

[[attribute_semantic]]
name = "source_identity_sha256"
classification = "domain_identifier"
