[canonical_digest_contract]
policy_relation = "canonical_digest_policy"
value_relation = "canonical_value_identity"
digest_attribute = "value_sha256"
allocation_relation = "canonical_value_allocation"
page_relation = "canonical_value_page"
descriptor_relation = "canonical_value_page_descriptor"
parent_relation = "canonical_value_page_parent"
root_attribute = "root_page_sha256"
byte_count_attribute = "byte_count"
algorithm = "SHA-256"
algorithm_version = 1
encoding = "opaque_bytes"
framing = "ascii('h2hdb-vnext-canonical-value\\0') || u32be(codec_version) || u32be(digest_domain_length) || digest_domain_ascii || u64be(payload_length) || payload"
collision_model = "collision_checked_stored_identity"
write_obligation = "resolve an exact registered stable ASCII digest_domain and obtain declared byte_count before hashing because the canonical wrapper places u64be(payload_length) before payload; the exact preimage deterministically yields its SHA-256 digest, while digest-to-preimage is only a stored relation FD established by UNIQUE, full-preimage byte comparison, rejection on mismatch, and the immutable final identity seal under the collision-checked stored-identity rule; if upstream length is unknown, pass zero uses an environment-owned durable bounded-I/O spool to count bytes; pass one frames declared byte_count, streams SHA-256 while verifying the consumed count and exact EOF, and rejects mismatch before allocation; pass two replays from offset zero into deterministic owner-scoped 32768-byte leaf chunks and fanout-256 pages in bounded transactions under canonical_value_allocation; byte-compare every idempotent page conflict; insert canonical_value_identity last only after exact tree validation; a crash may replay from zero in O(n) time but no database transaction or bind is unbounded"
read_obligation = "join through final canonical_value_identity and stream its owner-scoped page tree in exact offset order; recompute the domain-separated digest and exact byte_count incrementally, reject missing, duplicate, reordered, truncated, trailing, cross-owner, or noncanonical pages, and never reconstruct or compare identity from truncated or collation-folded text"

[canonical_value_page_contract]
codec_version = 1
prefix = "h2hdb-vnext-canonical-value-page\\0"
maximum_page_bytes = 65536
chunk_maximum_bytes = 32768
branch_capacity = 256
maximum_level = 8
maximum_byte_count = 9223372036854775807
framing = "ascii('h2hdb-vnext-canonical-value-page\\0') || u32be(version=1) || raw32(owner_value_sha256) || u8(node: LEAF=0,BRANCH=1) || u8(level=0..8) || u64be(page_position_int63) || u64be(subtree_byte_count_int63) || u32be(entry_count) || exact_records"
leaf_record = "u64be(byte_offset_int63) || u32be(chunk_length) || exact_chunk_bytes; leaf entry_count is one for nonempty values and zero only for the unique empty value leaf; offsets start zero and are contiguous; every nonfinal chunk is exactly 32768 bytes and final chunk is 1..32768 including an exact-multiple full final chunk"
branch_record = "raw32(child_page_sha256) || u64be(child_subtree_byte_count_int63); child digests are unique and same-owner child page level is parent level minus one"
canonical_tree_rule = "page_position is zero-based contiguous independently at every level; every nonfinal branch is full fanout 256, the final branch has 1..256 children, root height is minimal with no unary root wrapper, subtree counts use unbounded host arithmetic then signed-int63 without wrap, and the page frame includes owner_value_sha256 so pages cannot be shared across canonical values and every nonroot deterministic page has exactly one parent"
collision_obligation = "page_sha256 is raw SHA-256 of the exact owner-prefixed page frame; on every existing digest compare page bytes byte-for-byte and reject cross-owner reuse; any payload, decoded-coordinate, or subtree-count mismatch performs zero durable writes"
seal_obligation = "canonical_value_page_seal reverse-references the page anchor, collision-checked payload, true coordinate, and subtree-count fact so both historical page views expose exactly the same complete page family; canonical_value_identity(value_sha256,root_page_sha256) is inserted last only after allocation domain/count congruence, complete deterministic tree validation, exact root owner/count equality, and incremental recomputation of the canonical wrapper digest; identity seal alone retains the canonical_value_upload claim until the first retention-blocking external consumer handoff transaction; a phase-owned dictionary or type row alone never releases the claim; existing canonical foreign keys reference only completion seals"
cleanup_rule = "CANONICAL_VALUE cleanup is rooted at canonical_value_allocation_anchor; final-identity foreign keys and operational canonical_value_upload(generation,value_sha256), keyed only by that pair so multiple takeover generations may protect the same value, block cleanup; generation is SQL-bound to the ingest-generation owner; the first allocation family plus upload claim commits atomically under the exact live coordination head, owner, and lease; source_root_v1 is the sole pre-mapping exception because its final identity is required before source_scope, source_build_descriptor, and source_build_generation can exist, and the same live turn creates that mapping after sealing the root; every other digest domain requires its durable source_build_generation mapping before allocation or claim; a newer-generation resume exact-compares the existing allocation domain/count and every deterministic page conflict; every allocation fact, page family, and seal holds the shared canonical-value maintenance gate and rechecks the live head/owner/lease/claim, while a cleanup cycle holds its exclusive form; inserting or validating the final identity never releases its upload claim by itself; the first retention-blocking external consumer and deletion of only that generation claim commit atomically, while a phase-owned dictionary or type row alone never releases the claim; for source_root_v1 that handoff transaction inserts the wide source_scope row, source_build_descriptor, and source_build_generation before deleting the claim; source-scope ownership is reached through source_scope.source_root_sha256 = canonical_value_allocation_anchor.value_sha256, never through scope_key; if any source_build_descriptor or gallery_identity consumes any scope mapped to that root, all same-root scope rows and the canonical root remain retained, otherwise each unowned wide source_scope row is deleted in one bounded child-first statement before the canonical identity, page families, allocation facts, and allocation anchor; independent bounded cleanup removes residual claims only after their generation is completed or strictly superseded, including a crash after identity seal but before consumer handoff and a crashed source_root_v1 pre-mapping claim whose generation has no source_build_generation row, and only then may source-build cleanup delete a mapping that does exist; finally delete an unblocked identity, parent edges, page seals, page facts, allocation seal and facts, and allocation anchor child-first; owner-prefixed pages are never shared across allocations"

[source_locator_contract]
identity_relation = "source_locator_identity"
gallery_relation = "gallery_identity"
digest_attribute = "locator_sha256"
name_attribute = "source_gallery_name"
canonical_value_relation = "canonical_value_identity"
canonical_digest_attribute = "value_sha256"
digest_domain = "source_relative_locator_v1"
codec_version = 1
encoding = "exact_utf8_segments"
framing = "u32be(codec_version) || u32be(segment_count) || repeated(u32be(segment_length) || segment_utf8)"
write_obligation = "split the source-root-relative nested gallery directory into exact UTF-8 path segments; reject empty, dot, separator-containing, NUL-containing, or over-255-byte segments; frame every segment without normalization; two-pass stream the arbitrary-total-length frame through iter_source_relative_locator_payload and canonical_value_digest_parts under source_relative_locator_v1 without materializing the complete value; byte-compare on digest conflict; and require source_gallery_name to equal the exact final segment"
read_obligation = "resolve a gallery path only by joining gallery_identity.locator_sha256 through source_locator_identity and canonical_value_identity; first consume the complete immutable canonical page stream through validate_source_relative_locator_parts to verify framing, strict UTF-8, digest-bound receipt, and exact EOF without exposing a component; then replay the same sealed page root into a provisional bounded consumer whose effects commit only after replay completion; verify the digest domain and final-segment name, and never reconstruct identity from a leaf name alone; decode_source_relative_locator is a convenience oracle only"

[source_root_contract]
canonical_value_relation = "canonical_value_identity"
canonical_digest_attribute = "value_sha256"
digest_domain = "source_root_v1"
codec_version = 1
encoding = "absolute_posix_utf8_segments"
framing = "u32be(codec_version) || u32be(segment_count) || repeated(u32be(segment_utf8_byte_length) || strict_segment_utf8)"
root_rule = "the absolute POSIX root / is the unique zero-segment value; every non-root value is supplied as its exact already-parsed segment tuple"
segment_rule = "each segment is 1..255 strict UTF-8 bytes, contains no surrogate, NUL, or slash, and is neither . nor ..; do not normalize, casefold, resolve symlinks, call realpath, or rewrite spelling"
adapter_rule = "filesystem adapters alone parse an absolute POSIX path into the exact segment tuple; the canonical codec never accepts or interprets a path string"
write_obligation = "encode the exact absolute POSIX source-root segment tuple; two-pass stream the arbitrary-total-length frame through iter_source_root_payload, source_root_digest, and canonical_value_digest_parts without materializing the complete value; persist the payload through the registered source_root_v1 canonical digest wrapper, recompute source_root_sha256, and byte-compare the complete domain and payload on every digest conflict; readers first consume the complete immutable canonical page stream through validate_source_root_parts and require an exact EOF receipt before replay may expose a component; decode_source_root is a convenience oracle only"
