scope = "catalog.physical-domains"
relations = ["canonical_value_allocation", "canonical_value_page", "canonical_value_page_descriptor", "canonical_value_page_parent", "source_locator_identity", "file_name_identity", "tag_term", "publication_identity", "artifact_identity", "artifact_location", "gallery_observation_page", "gallery_observation_allocation_page", "gallery_observation_page_descriptor", "gallery_observation_page_key_bounds", "gallery_observation_page_child", "gallery_observation_discovery_fingerprint", "analysis_checkpoint", "publication_checkpoint", "prepared_artifact"]
covers = [
  "machine_contract.physical-domains",
  "byte_domain.source_gallery_name.runtime_obligation",
  "byte_domain.name_bytes.runtime_obligation",
  "byte_domain.namespace.runtime_obligation",
  "byte_domain.unicode_data_version.runtime_obligation",
  "byte_domain.role.runtime_obligation",
  "byte_domain.metadata_fingerprint.runtime_obligation",
  "byte_domain.cursor.runtime_obligation",
  "byte_domain.protection_token.runtime_obligation",
]
description = "Validate exact storage classes, fixed binary widths, bounded key bytes, the exact 40-byte discovery fingerprint, stage-specific cursors capped at 2048 bytes, artifact protection tokens capped at 512 bytes, unsigned logical counters, and the shared 0..2^63-1 Unix-microsecond timestamp domain on both backends; arbitrary publication and artifact-locator bytes appear only through canonical references."

[[semantic_obligation]]
id = "catalog.bootstrap.v1"
version = 1
class = "bootstrap_integrity"
lifecycle = "building_only"
ready_check = "catalog_refinement.check_bootstrap_v1"
writer_hook = "schema_epoch.write_catalog_bootstrap"
writer_hook_version = 1
scope = "catalog.bootstrap"
relations = ["canonical_digest_policy", "channel_registry", "source_provider_registry"]
covers = ["machine_contract.bootstrap"]
description = "During BUILDING only, insert and exact-validate the schema-owned canonical digest domains, the single default channel, and the single filesystem source provider; after READY these rows are ordinary immutable schema-version registry state, not recurring genesis assertions."

[[semantic_obligation]]
id = "catalog.retention.v1"
version = 1
class = "retention_protocol"
lifecycle = "ready_and_runtime"
ready_check = "catalog_refinement.check_retention_contract_v1"
writer_hook = "catalog_writer.validate_retention_transition"
writer_hook_version = 1
scope = "catalog.retention"
relations = ["source_head", "publication_head", "publication_candidate", "publication_receipt", "source_build", "analysis_run", "source_revision", "source_revision_provenance", "source_snapshot_manifest_identity", "canonical_value_allocation", "canonical_value_page", "canonical_value_page_descriptor", "canonical_value_page_parent", "canonical_value_identity", "gallery_observation_allocation", "gallery_observation", "gallery_observation_tree_root", "gallery_observation_page", "gallery_observation_allocation_page", "gallery_observation_page_descriptor", "gallery_observation_page_key_bounds", "gallery_observation_page_child", "catalog_revision"]
covers = ["machine_contract.retention", "canonical_value_page_contract.cleanup_rule", "gallery_observation_page_contract.cleanup_rule"]
description = "Validate active/working/pending-receipt/overlay-descendant blockers and enforce the exported child-first phase DAG before pruning any candidate, revision, analysis, or source-build state; delete source_revision_provenance as an ANALYSIS_RUN child while retaining the self-contained source revision and manifest."

