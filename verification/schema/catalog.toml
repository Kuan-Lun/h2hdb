  "selection_occurrence_sha256",
  "candidate_id",
  "gallery_id",
  "publication_key",
]
fds = [
  { determinant = ["selection_occurrence_sha256"], dependent = ["candidate_id", "gallery_id", "publication_key"] },
  { determinant = ["candidate_id", "publication_key"], dependent = ["selection_occurrence_sha256", "gallery_id"] },
]
projections = [
  { relation = "publication_selection_storage", attributes = ["selection_occurrence_sha256", "gallery_id"] },
  { relation = "publication_selection_occurrence_identity", attributes = ["selection_occurrence_sha256", "candidate_id", "publication_key"] },
]
rationale = "Split one selected winner into its physical candidate/gallery occurrence and collision-checked candidate/publication identity. The shared occurrence digest is a key of both projections, so the join is lossless and both candidate-scoped winner dependencies are preserved; the separately declared gallery_id -> publication_key chain supplies the global dependency without repeating it in either base."

