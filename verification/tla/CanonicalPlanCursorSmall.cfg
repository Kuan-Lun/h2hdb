\* Required finite safety profile.  The canonical plan and first-consumer
\* order deliberately differ, exercising a consumed non-prefix value whose
\* exact generation claim is deleted before the process-local plan cursor.
\* The profile also explores same-receipt preimage corruption and two
\* concurrently prepared sealed allocations, including a delayed commit after
\* the first consumer has deleted the winning claim.
\* TLC success is exhaustive only for these two values, two generations, and
\* two transaction statements.  It is bounded safety evidence.
\* This profile is not an unbounded proof and establishes neither liveness nor
\* implementation,
\* transaction-isolation, SQLite, or MariaDB refinement.
SPECIFICATION Spec

\* Identity view retains every modeled variable, including audit snapshots;
\* it cannot quotient away a replay, rollback, or stale-fence violation.
VIEW SafetyView

CONSTANTS
    FirstValue = value1
    SecondValue = value2
    NoValue = noValue
    NoAction = noAction
    RejectAction = rejectAction
    MaxGeneration = 2
    TxStatementCount = 2

INVARIANTS
    TypeOK
    DurableWorldsAgree
    ReferenceAndCursorSelectSameNextAction
    ReferenceAndCursorHaveSameTerminalResult
    PendingActionsAgree
    CursorPrefixIsFreshlyJustified
    ValidatedPositionsAreOneMonotonicPrefix
    SuccessfulProgressValidationWorkIsLinear
    SuccessfulRequiredAllocationsAreBounded
    EveryPreparedSealedAllocateWasFreshlyStreamed
    SameReceiptChangedPreimageIsRejected
    CurrentConsumerClaimDeletionAndCheckpointAreAtomic
    TransactionPrefixHasNoPublicationWrites
    StatementPrefixCrashRollsBack
    ResponseLossReplayIsObservational
    StaleFenceHasZeroPublicationWrites
    DelayedConsumedOrStaleAllocateHasZeroWrites
    DelayedAllocateAfterConsumerFenceIsExplicit
    ResponseLossHasExactReplayAuthority
