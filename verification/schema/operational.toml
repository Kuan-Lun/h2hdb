  { attributes = ["phase"], relation = "cleanup_phase", referenced_attributes = ["phase"] },
]
rationale = "One globally bounded checkpoint row per started phase stores both current poststate and the immediately preceding transition prestate. Receipt fields are either all NULL at generation one or all present after a page commit; generation, cursor_bytes, chain_sha256, and updated_at are the corresponding committed generation, next cursor, output chain, and commit time. This atomic BCNF row preserves exact latest retry and phase-transition replay without a separately orphanable receipt."
