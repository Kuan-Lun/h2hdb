ready_obligation = "full SchemaAdmin.check scans only the retained publication window to prove one exact contiguous node/successor chain ending at the maximum commit, successor equals predecessor plus one, no fork/gap/node beyond the tip, every commit generation is present, every active baseline/protection reference resolves, and the common head is the unique maximum tip; the chain may conservatively include an unreferenced prefix below the oldest commit after a crash between bounded commit and generation cleanup, and later maintenance removes it; the check never scans the high-cardinality content corpus or requires already deleted history; quick check_readiness remains an epoch-only O(1) probe and fresh publication/replay remain tip-local O(1)"

