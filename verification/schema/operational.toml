contract_version = 1
name = "h2hdb-vnext-operational"
description = "Logical vNext operational/control-plane contract. Data-plane snapshot, catalog, and artifact facts remain owned by catalog.toml."
scope = "operational_control_plane"
excluded_data_plane_components = [
  "immutable source observations and source snapshot membership",
  "analysis evidence, overlays, and resolved evaluator state",
  "source revision history and source head",
  "catalog publications, artifacts, catalog revision history, and publication head",
]

[fencing_contract]
model = "verification/tla/CatalogCore.tla"
head_relation = "ingest_coordination_head"
generation_relation = "ingest_generation"
owner_relation = "ingest_generation_owner"
lease_relation = "ingest_generation_lease"
build_authorization_relation = "source_build_generation"
authorization_rule = "current_generation_and_exact_owner_and_unexpired_lease"
takeover_rule = "strictly_greater_generation"
stale_rule = "no_mutation"
history_cleanup_rule = "under the exclusive maintenance gate, keyset-delete at most the fixed batch bound of ingest generations strictly older than the current head only after source_build_generation, canonical_value_upload, staging claims, handoff, and every live lease or owner resume authority are absent; delete handoff, lease, owner, then generation child-first with row-lock recheck, while current and completed head references always block"

[download_ingest_handoff_contract]
version = 1
download_generation_relation = "download_generation"
download_head_relation = "download_coordination_head"
download_owner_relation = "download_generation_owner"
download_lease_relation = "download_generation_lease"
handoff_relation = "download_ingest_handoff"
consumption_relation = "download_ingest_consumption"
completion_relation = "coordinated_ingest_completion"
ingest_generation_relation = "ingest_generation"
capability_bytes = 16
handoff_kinds = ["DOWNLOADER", "EXPIRED_TAKEOVER"]
lock_order_rule = "every transaction locks the download singleton and exact current download generation satellites before the ingest singleton and exact current ingest generation satellites; each authority transition uses an exact observed-state CAS, and stale or corrupt authority performs zero writes"
download_claim_rule = "the repository issues a fresh opaque 16-byte owner capability, creates a strictly greater download generation only while both download and ingest heads are quiescent, inserts exact owner and lease satellites, and CAS-advances the download current head; no new download generation may begin until the linked ingest completion has durably completed the prior download generation and advanced completed_generation"
handoff_rule = "only the exact current downloader owner with an unexpired lease may insert DOWNLOADER handoff; when its lease is expired, ingest may fail-closed insert EXPIRED_TAKEOVER; either transaction atomically copies the exact owner_token into immutable handoff history and deletes both owner and lease so no live downloader authority remains"
consumption_rule = "one immutable handoff is consumed by exactly one immutable ingest generation and each ingest generation consumes at most one handoff; handoff validation, ingest claim, and consumption insert commit in one transaction, and an existing different tuple rejects without mutation"
periodic_rule = "a periodic ingest generation is allowed only while download authority is quiescent and has no handoff or consumption claim; it has no fabricated download linkage, and its completion never changes the download generation or head"
completion_rule = "linked completion atomically inserts the exact durable coordinated completion receipt, completes the live ingest fence, sets download_generation.completed_at, and exact-CAS advances download_coordination_head.completed_generation; periodic completion inserts the same ingest-owner receipt and completes only the ingest fence"
replay_rule = "response-loss replay exact-compares every retained handoff, consumption, and coordinated completion field including handoff kind, both generations, owner capabilities, and timestamps; an exact replay performs zero writes and every mismatch fails closed"

[maintenance_gate_contract]
slot_count = 64
head_relation = "maintenance_gate_head"
generation_relation = "maintenance_gate_generation"
owner_relation = "maintenance_gate_owner"
holder_relation = "maintenance_gate_holder"
authorization_rule = "exact_holder_owner_and_owner_generation_equals_head_generation_and_unexpired_owner_lease"
shared_claim_rule = "current_shared_owner_holds_exactly_one_slot"
exclusive_claim_rule = "current_exclusive_owner_holds_every_slot_zero_through_sixty_three"
reclaim_rule = "replace_a_slot_only_by_transactional_cas_on_the_exact_observed_owner_after_its_generation_is_stale_or_its_lease_is_expired"
stale_rule = "stale_generation_or_expired_owner_authorizes_no_mutation"
canonical_value_rule = "every canonical-value allocation, upload-claim, bounded page, and final-seal transaction holds and rechecks one shared maintenance slot; CANONICAL_VALUE cleanup holds the exclusive generation for its complete multi-phase cycle, so no live producer can claim, write, or reseal between destructive phases"
history_cleanup_rule = "under a newer live exclusive gate generation, keyset-delete at most the fixed batch bound of expired non-head owners after their holder slots are absent, then delete an unreferenced non-head maintenance generation only after no owner or head references it; every batch row-locks and rechecks head, owner lease, and exact generation, so current or live shared and exclusive authority always blocks"

[bounded_work_contract]
cursor_authority = "server_owned_checkpoint"
page_commit = "decision_rows_and_receipt_and_checkpoint_cas_in_one_transaction"
terminal_rule = "empty_page_receipt_before_complete"
preparation_policy_relation = "operational_policy"
preparation_stream_relation = "operational_event_stream"
preparation_checkpoint_relation = "operational_preparation_checkpoint"
preparation_receipt_relation = "operational_preparation_batch_receipt"
preparation_effect_seal_relation = "operational_preparation_effect_seal"
preparation_event_relation = "operational_event"
preparation_effect_rule = "each bounded page locks the OPEN preparation and exact checkpoint generation, writes a contiguous coordinate range of base events and exactly one matching typed subtype per event, recomputes every event digest and the running chain, and commits those rows with the request receipt and checkpoint CAS; an empty terminal page proves no remaining work, after which one transaction inserts the exact effect seal last and marks the preparation COMPLETE without scanning prior event rows"
cleanup_policy_relation = "cleanup_job"
cleanup_checkpoint_relation = "cleanup_checkpoint"
cleanup_receipt_relation = "cleanup_batch_receipt"

[queue_history_contract]
deletion_generation_relation = "deletion_request_generation"
deletion_generation_head_relation = "deletion_request_generation_head"
deletion_attempt_relation = "deletion_request_attempt"
deletion_head_relation = "deletion_request_head"
deletion_url_relation = "deletion_request_url"
consumption_relation = "operational_deletion_consumption_event"
preparation_relation = "operational_preparation"
generation_rule = "generation zero is the real immutable empty-queue genesis fact, never a sentinel; every actual deletion-request authority mutation transactionally inserts exactly current_generation plus one into immutable history, applies the queue mutation, and exact-CAS advances the singleton head from the observed generation, while exhaustion at 2^63-1 fails closed"
publication_rule = "preparation records the exact FK-backed deletion generation it scanned; publication locks and compares that generation with the singleton head in O(1) and performs no activation when they differ"
retention_rule = "deletion generation history is retained indefinitely as immutable FK and audit authority; the current head and every preparation always reference an exact history row"
rule = "the per-gid current head may rotate or disappear without deleting immutable attempts referenced by consumption events; URL is an optional exact payload satellite, and every such authority mutation participates in the global generation insert-and-CAS transaction"

[canonical_hash_cache_contract]
canonical_value_relation = "canonical_value_identity"
canonical_allocation_relation = "canonical_value_allocation"
canonical_page_relation = "canonical_value_page"
canonical_digest_attribute = "value_sha256"
canonical_policy_attribute = "digest_domain"
canonical_byte_count_attribute = "byte_count"
canonical_root_attribute = "root_page_sha256"
observation_relation = "hash_cache_observation"
source_digest_attribute = "source_identity_sha256"
fingerprint_digest_attribute = "fingerprint_sha256"
source_domain = "filesystem_source_identity_v1"
fingerprint_domain = "filesystem_fingerprint_v1"
write_obligation = "under an exact live canonical_value_upload claim, use the registered distinct digest_domain, stream the exact versioned canonical preimage through bounded canonical_value_page rows, recompute SHA-256 and byte_count, reject every mismatch, and on digest or page conflict byte-compare the complete streamed page tree before accepting final canonical_value_identity; no database surrogate participates"
read_obligation = "join each digest to final canonical_value_identity and canonical_value_allocation, validate the expected registered domain and byte_count, stream and recompute the exact root page tree, and never accept a digest without that complete exact preimage authority"

[operational_event_integrity_contract]
stream_relation = "operational_event_stream"
preparation_relation = "operational_preparation"
seal_relation = "operational_preparation_effect_seal"
activation_relation = "operational_activation"
candidate_binding_relation = "publication_candidate_preparation"
base_relation = "operational_event"
removed_subtype_relation = "operational_removed_gid_event"
deletion_subtype_relation = "operational_deletion_consumption_event"
removed_event_type = "REMOVED_GID"
deletion_event_type = "DELETION_CONSUMPTION"
event_digest_codec = "SHA256(ASCII(h2hdb-operational-event-v1) || NUL || preparation_id[16] || u64be(sequence_no) || u16be(event_type_byte_count) || ASCII(event_type) || u32be(subtype_frame_byte_count) || subtype_frame), where REMOVED_GID subtype_frame is u64be(gid) || request_token[16] and DELETION_CONSUMPTION subtype_frame is u64be(gid) || deletion_request_token[16]"
chain_codec = "chain_0 = SHA256(ASCII(h2hdb-operational-event-chain-v1) || NUL); chain_(n+1) = SHA256(ASCII(h2hdb-operational-event-chain-link-v1) || NUL || chain_n[32] || event_sha256_n[32])"
empty_chain_sha256 = "e3963ad6e07ac045502ad95ddb3805ac57deea8ffbb038ddf7c538a816301e71"
stream_rule = "begin preparation resolves or allocates one preparation_id from the policy-qualified natural key, then inserts the durable event stream, preparation, and required initial checkpoints in one transaction; commit contains all roots or none, retry resolves the same preparation, and no standalone invisible stream is permitted"
subtype_rule = "every bounded event-page transaction inserts each base event and exactly one subtype whose type and exact canonical subtype frame agree with event_type, byte-compares an existing coordinate on retry, and advances the durable running chain only in the same receipt and checkpoint CAS"
seal_rule = "after an empty terminal work receipt, insert exactly one immutable seal with event_count equal to the next contiguous sequence number and final_chain_sha256 equal to the durable running chain, then mark the preparation COMPLETE in the same transaction; sequence numbers are exactly zero through event_count minus one, every event digest and subtype are exact, zero events require no event rows and the registered empty-chain digest, and publication trusts only this writer-produced seal without scanning events"
activation_rule = "one short publication transaction locks the exact COMPLETE preparation, its effect seal, matching operational policy, and singleton deletion-generation head; only when the preparation generation is current does it insert the unique preparation and operational-policy members into the common publication commit before its final seal, while reading or writing no event rows; operational_activation is a read-only projection of that sealed commit and readers expose an event only by joining its preparation_id through the derived activation"
candidate_binding_rule = "before publication_candidate may become SEALED, one transaction binds it to exactly one COMPLETE preparation and exact effect seal through publication_candidate_preparation; candidate_id and preparation_id are both candidate keys, both FKs are exact, and the preparation row pins the operational policy and retained deletion generation; final publication must use this bound preparation and must not search by build/generation/policy, LIMIT 2, caller identifier, or incidental uniqueness"
ack_head_relation = "operational_event_ack_head"
ack_rule = "one consumer high-water sequence per preparation advances monotonically only to an existing event in that preparation after joining an immutable activation for its public source revision; each bounded CAS inserts or verifies complete acknowledgement evidence for every next contiguous event after the prior head through the target, so prior evidence plus the bounded page proves the full prefix without a history scan"
cleanup_rule = "a COMPLETE preparation referenced by a sealed common commit may lose only its control rows while stream, seal, events, subtypes, derived activation, and acknowledgements remain; an uncommitted COMPLETE preparation is retained; an ABANDONED preparation with no commit member or acknowledgement authority is deleted child-first through subtypes, events, seal, preparation, and stream; OPEN and FAILED are retained and no invisible orphan stream may remain"

[source_build_generation_contract]
reservation_relation = "source_build_generation"
rule = "first begin or resume locks and verifies the exact current ingest head, matching owner, and unexpired lease, then transactionally reserves at most one build for that immutable ingest generation; a strictly greater live takeover generation may reserve the same build, a no-build generation has no row, and the mapping may outlive deletion of its completed owner and lease because authorization is a writer check rather than an FK"
cleanup_rule = "before SOURCE_BUILD cleanup creates a job and before every destructive batch, each mapped generation must be durably completed or strictly superseded by the current coordination head; an unfinished current generation or any owner, lease, or handoff resume authority blocks phase one, while completed or superseded mappings and their residual canonical uploads are bounded owned children and make progress"

[source_build_assembly_contract]
version = 1
discovery_checkpoint_relation = "source_build_discovery_checkpoint"
discovery_receipt_relation = "source_build_discovery_batch_receipt"
assembly_checkpoint_relation = "source_build_assembly_checkpoint"
assembly_receipt_relation = "source_build_assembly_batch_receipt"
expected_membership_relation = "source_build_expected_gallery"
observation_stat_relation = "gallery_observation_stat"
membership_relation = "source_build_gallery"
discovery_seal_relation = "source_build_discovery_seal"
build_seal_relation = "build_manifest_seal"
batch_rows_maximum = 256
empty_manifest_chain_sha256 = "121f20d26c10f4c5ce6e621dc5e41b7da2c4028af840caa7547265068f2458e3"
begin_rule = "the source-root canonical handoff accepts the repository-issued build_id attempt capability, obtains created_at only from the database clock, inserts source_build_anchor, exact scope, manifest-policy, OPEN-state and created-at facts, then source_build_descriptor_seal last, and also inserts source_build_generation plus both generation-one checkpoints with empty cursor, zero processed counters, OPEN state, and the exact empty manifest audit chain; all roots commit or roll back together, while build-id replay locks the narrow facts, exact-compares scope and policy, preserves the original database time, and returns their complete stored state without allocating a second build"
discovery_rule = "a filesystem adapter freezes one provider-private typed discovery spool outside database transactions, validates exact strict-UTF-8 source-relative locator frames, rejects duplicate locator bytes, and orders entries by exact unsigned locator_sha256 bytes; each maximum-256 short transaction locks the discovery checkpoint and current ingest fence, consumes the next contiguous spool positions, database-resolves or allocates gallery identity, inserts exact source_build_expected_gallery(build_id,position,gallery_id), writes the complete immutable pre/post receipt, and CAS-advances generation/cursor/processed_count; batch_key and every digest/count/cursor are retry fields only, exact replay field-compares the full tuple and writes nothing, and loss of the private spool fails or abandons the build rather than accepting reconstructed caller authority"
discovery_terminal_rule = "only a server-derived empty page writes terminal one, unchanged cursor/count, next_state COMPLETE, and committed_generation start plus one; that same transaction inserts source_build_discovery_anchor, all four non-null build-keyed members with gallery_count copied from next_processed_count and tree_observation_sha256 computed from the exact SHA-256 audit frame over ascii h2hdb-vnext-source-build-discovery-audit-v1 NUL, u64be gallery_count, and ordered raw32 locator_sha256 values, then inserts source_build_discovery_seal last; scan_attempt is the first 16 bytes of SHA-256 over ascii h2hdb-vnext-source-build-discovery-attempt-v1 NUL, u64be gallery_count, and raw32 tree_observation_sha256 so rebuilding the same complete disk snapshot resumes its exact checkpoint chain; scan_attempt and tree_observation_sha256 are audit-only and never authorize membership or sealing"
observation_stat_rule = "every FILE staging batch adds only database-verified FileContentReceipt size_bytes to gallery_observation_staging_checkpoint.processed_byte_count and its exact latest receipt pre/post fields, while every non-FILE checkpoint keeps the scalar zero; the empty terminal FILE authority supplies exact file_count and byte_count, and after exact FILE/root/parser checks the gallery seal transaction inserts gallery_observation_stat_anchor, both non-null keyed counter members, and gallery_observation_stat_seal last without COUNT or SUM over files or content blobs"
gallery_manifest_rule = "ASSEMBLY may consume a gallery only after GalleryObservationStagingRepository.seal has locked the final observation and manifest-policy seal, derived artifact_source_manifest_v1 exactly from the collision-checked observation_identity_sha256 plus manifest_algorithm_version and file_order_version without a FILE-row scan, inserted gallery_manifest anchor and digest plus database-clock computed_at facts, and inserted gallery_manifest_seal last; its terminal response-loss replay exact-compares the sealed family with zero writes, and no audit digest is identity authority"
assembly_rule = "ASSEMBLY starts only after discovery COMPLETE; each maximum-256 transaction locks its checkpoint and current ingest fence, streams the next source_build_expected_gallery positions, requires one exact source_build_gallery link and immutable gallery_observation_stat plus same-policy sealed gallery_manifest for every position, independently compares build and gallery scope, accumulates gallery/file/byte counts with checked int63 addition, advances the exact audit chain as SHA256(ascii h2hdb-vnext-source-build-manifest-audit-v1 NUL || raw32 prior_chain || u64be position || raw32 gallery_key || raw32 observation_identity_sha256 || raw32 gallery_manifest_sha256 || u64be file_count || u64be byte_count), writes one complete immutable pre/post receipt, and CAS-advances all fields in one transaction; schema FKs forbid extra membership and the evaluator proves no expected member is missing"
seal_rule = "only the server-derived empty ASSEMBLY page may write terminal one, unchanged cursor/counts/audit chain, next_state COMPLETE, and committed_generation start plus one; in that transaction require the sealed discovery gallery-count fact equals next_gallery_count, insert or exact-compare build_manifest_anchor, digest, file-count and byte-count facts, obtain sealed_at only from the database clock, insert source_build_sealed_at, CAS source_build_state OPEN to SEALED, and insert build_manifest_seal last so its reverse FKs also require discovery gallery count and source-build sealed time; build_manifest.gallery_count and computed_at are derived view columns rather than duplicate values; response-loss replay accepts only the exact COMPLETE checkpoint, terminal receipt, immutable sealed build-manifest family, and SEALED narrow build facts, and no caller timestamp, digest, manifest_sha256, scan digest, count, cursor, sequence, or receipt authorizes progress"
abandon_rule = "only the exact live ingest owner under the current fence may lock source_working_build and CAS source_build_state OPEN to ABANDONED while deleting that exact working slot in the same transaction; ABANDONED inserts no source_build_sealed_at, retains source_build_generation so the same generation cannot allocate a replacement, and becomes cleanup-eligible only after every existing retention root is absent; SEALED and ABANDONED are terminal and every mismatched or stale replay writes nothing"

[cleanup_attempt_contract]
job_relation = "cleanup_job"
attempt_attribute = "cycle_generation"
allocation_rule = "advance positive portable int63 cycle_generation monotonically on the one reusable job row per fixed shard under lock or exact CAS; fail closed before 2^63 and derive cleanup_id exactly as SHA256(h2hdb-cleanup-cycle-v1 NUL target_kind)[0:7] || u8(shard_no) || u64be(cycle_generation), atomically remove the prior completion when opening, require exact recomputed cleanup_id plus checkpoint generation on every mutation, require completion cycle_generation equals job cycle_generation and job state COMPLETE on replay, and reject every stale generation"

[cleanup_reachability_contract]
version = 1
target_registry_relation = "cleanup_target_kind"
sweep_registry_relation = "cleanup_sweep_target"
phase_registry_relation = "cleanup_phase"
job_relation = "cleanup_job"
checkpoint_relation = "cleanup_checkpoint"
target_key_bytes = 32
registry_rule = "target kinds and phases are exact provider-seeded rows; runtime dispatch is a closed-world map from registered IDs to versioned writer functions and never interpolates a relation, predicate, blocker, or phase from database text"
eligibility_rule = "under the maintenance gate and one transaction, decode the exact target key, lock the target when present, evaluate the registered eligibility predicate and every registered blocker, and create a cleanup job only when no retention root reaches the target"
phase_rule = "a checkpoint phase must belong to its jobs target kind; complete phases in strictly increasing phase_order; each batch deletes only the registered relation set child-first and commits rows, receipt, and checkpoint CAS atomically"
completion_rule = "a cleanup job becomes COMPLETE only after every registered phase has a durable empty terminal receipt, the target root phase completed, and a final blocker recheck still finds no reachable retention root"
compaction_rule = "each page commit atomically advances checkpoint generation and replaces the prior ambiguity receipt so at most one receipt per live checkpoint is retained; terminal transaction updates cleanup_job COMPLETE and completed_at, upserts the shard latest cleanup_completion generation/final chain/deleted count, deletes live receipts then checkpoints, and makes completion the response-loss replay authority; stale generations cannot resume"

[cleanup_sweep_protocol]
version = 1
shard_count = 256
target_key_codec = "target_kind_tag16_u64be_zero8_v1"
cleanup_id_codec = "target_kind_tag7_u8_shard_u64be_cycle_v1"
cleanup_id_domain = "h2hdb-cleanup-cycle-v1"
cycle_generation_minimum = 1
cycle_generation_overflow = "fail_closed_before_2^63"
active_receipts_per_checkpoint = 1
history_rule = "one reusable job and latest completion per fixed shard; long-lived audit history belongs in a separate append-only audit stream, not cleanup control tables"

[hash_cache_cleanup_contract]
version = 1
policy_relation = "cleanup_job"
max_age_attribute = "hash_cache_max_age_microseconds"
cycle_cutoff_attribute = "cycle_cutoff_at"
gate_rule = "exclusive maintenance gate excludes concurrent hash-cache readers and writers"
eligibility_rule = "observed_at <= cycle_cutoff_at - hash_cache_max_age_microseconds with checked nonnegative subtraction"

[[cleanup_target]]
target_kind = "SOURCE_BUILD"
mode = "SWEEP"
sweep_shard_count = 256
selection_order_id = "uuid_first_byte_then_uuid_v1"
root_relation = "source_build_anchor"
root_key = ["build_id"]
key_codec = "target_kind_tag16_u64be_zero8_v1"
eligible_predicate_id = "source_build_unreferenced_v1"
blocker_query_id = "source_build_retention_roots_v1"
writer_hook = "h2hdb.cleanup.source_build.v1"
retention_roots = ["analysis_run_build_id.build_id", "source_working_build.build_id", "operational_preparation.build_id", "gallery_observation_staging.build_id", "a source_build_generation mapping whose generation is neither completed nor strictly superseded", "a newer build's source_build_generation mapping while any differently mapped older build still retains one sole ABANDONED analysis retirement family; the newer mapping is released only after that older sole family disappears atomically at ANALYSIS_RUN AR_ROOT, so cleanup cannot erase the successor fence around partially removed valid retirement evidence, while illegal ABANDONED-plus-sibling families do not retain unrelated newer mappings"]
retained_fk_edges = [{ relation = "analysis_run_build_id", attributes = ["build_id"] }]
operational_blockers = [{ relation = "source_working_build", attributes = ["build_id"] }, { relation = "operational_preparation", attributes = ["build_id"] }, { relation = "gallery_observation_staging", attributes = ["build_id"] }]
phases = [
  { phase = "SB_CANONICAL_UPLOAD", order = 1, relations = ["source_build_discovery_batch_receipt", "source_build_assembly_batch_receipt", "canonical_value_upload"] },
  { phase = "SB_GALLERY", order = 2, relations = ["source_build_discovery_checkpoint", "source_build_assembly_checkpoint", "build_manifest_seal", "build_manifest_manifest_sha256", "build_manifest_file_count", "build_manifest_byte_count", "build_manifest_anchor", "source_build_gallery"] },
  { phase = "SB_DISCOVERY_SEAL", order = 3, relations = ["source_build_discovery_seal"] },
  { phase = "SB_DISCOVERY_VALUES", order = 4, relations = ["source_build_discovery_scan_attempt", "source_build_discovery_gallery_count", "source_build_discovery_tree_observation_sha256", "source_build_discovery_completed_at"] },
  { phase = "SB_DISCOVERY_ANCHOR", order = 5, relations = ["source_build_discovery_anchor"] },
  { phase = "SB_SATELLITES", order = 6, relations = ["source_build_expected_gallery", "source_build_base_publication_commit", "source_build_channel"] },
  { phase = "SB_GENERATION", order = 7, relations = ["source_build_generation"] },
  { phase = "SB_ROOT", order = 8, relations = ["source_build_sealed_at", "source_build_descriptor_seal", "source_build_state", "source_build_created_at", "source_build_manifest_policy_id", "source_build_scope_key", "source_build_anchor"] },
]
conditional_child_rules = [{ relation = "source_build_generation", upload_relation = "canonical_value_upload", generation_attribute = "generation", coordination_head_relation = "ingest_coordination_head", generation_relation = "ingest_generation", owner_relation = "ingest_generation_owner", handoff_relation = "ingest_generation_handoff", rule = "before job creation, phase one, and every destructive batch, lock and recheck every mapping for the selected build; any mapping not durably completed and not strictly superseded by the current coordination head blocks the whole job before deletion. For an eligible mapping, bounded cleanup deletes residual canonical_value_upload claims after the same completed-or-superseded recheck and finally deletes the mapping; current owner, lease, or handoff resume authority always rejects" }]
terminal_staging_rule = "every remaining staging FK blocks SOURCE_BUILD job creation. OPEN is a live blocker; SEALED and REUSED are pending work for the independent GALLERY_OBSERVATION_STAGING compactor, which preserves final membership and data facts. Therefore SB_GALLERY starts only after terminal control rows are compacted, eliminating the staging-to-membership cleanup cycle"

[[cleanup_target]]
target_kind = "ANALYSIS_RUN"
mode = "SWEEP"
sweep_shard_count = 256
selection_order_id = "uuid_first_byte_then_uuid_v1"
root_relation = "analysis_run_anchor"
root_key = ["analysis_id"]
key_codec = "target_kind_tag16_u64be_zero8_v1"
eligible_predicate_id = "analysis_run_unpublished_leaf_v1"
blocker_query_id = "analysis_descendant_reachability_v1"
writer_hook = "h2hdb.cleanup.analysis_run.v1"
retention_roots = ["publication_candidate_analysis_id.analysis_id", "analysis_baseline.base_analysis_id", "analysis_state_ancestry.ancestor_analysis_id", "the exact live analysis working root while state is OPEN", "source_build_base_publication_commit.base_receipt_id->publication_commit_source_revision.source_revision->source_revision_provenance.analysis_id while any retained source build pins that historical base", "the sole ABANDONED analysis of the globally latest source_build_generation until a newer mapping exists", "every analysis of any build containing both an ABANDONED analysis and a sibling run; this pre-sole-run-contract history is permanently retained for explicit whole-family repair so cleanup cannot launder it into a valid sole retirement proof"]
conditional_blockers = ["source_head.source_revision->source_revision_provenance.analysis_id when the revision is the active channel head", "a source-build base receipt retains its exact provenance analysis even after that receipt ceases to be the active head", "a latest-mapped sole ABANDONED run is released only by a strictly newer source-build mapping; any ABANDONED-plus-sibling family remains fail-closed and is never automatically released"]
retained_fk_edges = [{ relation = "analysis_baseline", attributes = ["base_analysis_id"] }, { relation = "analysis_state_ancestry", attributes = ["ancestor_analysis_id"] }, { relation = "publication_candidate_analysis_id", attributes = ["analysis_id"] }]
state_rule = "OPEN is never cleanup-eligible; only COMPLETE or ABANDONED may be selected. A valid OPEN-to-ABANDONED CAS requires the target to be the sole run for its build, the exact source working assignment to equal the build's database-owned created_at, and no catalog working candidate, snapshot binding, publication candidate, source-revision provenance, or operational preparation; it atomically removes that exact working root. Cleanup retains the globally latest sole ABANDONED proof until a successor mapping and permanently retains every illegal ABANDONED-plus-sibling family for explicit repair"
phases = [
