text = "for publication batches derive committed_generation as start_generation plus one and next_processed_count as start_processed_count plus row_count under int63 overflow preconditions; row_count is zero iff terminal and next_state COMPLETE, while nonterminal requires a strict codec successor and OPEN next state. A fresh batch inserts one complete wide current receipt and generation-CASes one complete wide checkpoint, deleting a safely acknowledged predecessor receipt in the same bounded transaction; the latest retained current receipt poststate equals the exact checkpoint. Exact replay of retained batch_key or start_generation compares every derived field with zero DML; retry after successor/projection safe acknowledgement and pruning returns stale/not-found with zero DML"
