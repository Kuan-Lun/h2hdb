revision_relation = "catalog_revision"
head_relation = "publication_head"
finalization_stage = "FINALIZE_ARTIFACTS"
selection_rule = "BUILD_SELECTION streams every immutable source_build_gallery member of candidate.analysis_id in unsigned positive gallery_id keyset order and inserts a row if and only if the gallery is its analysis_content_owner_resolved owner for its nonexcluded effective CONTENT digest, treating a gallery with no nonexcluded CONTENT digest as its own owner, and the same gallery is the analysis_gid_winner_resolved winner for its exact metadata GID; derive publication_key only with publication-key.v1 from that positive GID; publication_selection stores no audit digest; VALIDATE_SELECTION independently streams the same predicate, exact merge-compares candidate_id, gallery_id, and publication_key against the materialization, and only its empty terminal receipt owns publication_count"
cursor_codec_rule = "publication_gallery_v1 is empty at genesis or u64be(positive gallery_id); publication_key_v1 is empty at genesis or raw32(publication_key); publication_catalog_child_v1 is empty at genesis or u8(version=1) || u8(child_kind: PUBLICATION=0,ORDER=1,TITLE=2,CONTENT=3,CONTRIBUTOR=4,SUBJECT=5,ARTIFACT=6) || raw32(publication_key) || u16be(subkey_length) || bounded subkey, where subkey is empty for singleton publication/title/content/artifact and u64be(position) for order/contributor/subject; exact EOF is required; gallery IDs compare unsigned integers and every other key compares unsigned bytes; the locked registered stage selects the codec and caller cursor bytes never select or alter a query"
batch_rule = "the provider registry remains exactly seventeen ordered stages, but initialize candidate-owned checkpoints only for the first sixteen stages with generation one, empty cursor, processed_count zero, and OPEN state; FINALIZE_ARTIFACTS has no candidate-owned checkpoint and instead uses the permanent receipt-owned finalization family; stages 2 through 16 require the immediately preceding stage COMPLETE and BUILD_SELECTION additionally requires the graph-derived candidate OPEN plus its COMPLETE five-seal analysis; every hard-capped maximum-128 candidate batch locks one checkpoint, derives the next exact keyset page server-side, writes the compact start-generation-keyed receipt anchor, batch-key coordinate, five stored fact members, and seal last, then CAS-advances the checkpoint generation last in one transaction; the read-only historical receipt view derives committed_generation as start_generation plus one, next_processed_count as start_processed_count plus row_count, and terminal/next_state from row_count; exact retry by batch_key or start_generation field-compares and returns the complete derived tuple without writes; terminal is one if and only if the server-derived page is empty with row_count zero, unchanged cursor/count, and next_state COMPLETE, while nonterminal means positive row_count and next_state OPEN; no caller stage, cursor, count, state, terminal, digest, sequence, or receipt is authority"
projection_seal_rule = "after VALIDATE_DUPLICATE_LOSER becomes COMPLETE, one short certification transaction locks the candidate definition seal and terminal checkpoints for VALIDATE_SELECTION, VALIDATE_CATALOG_PROJECTION, VALIDATE_ARTIFACT_INPUT_DELTA, VALIDATE_PREPARED_ARTIFACT, VALIDATE_CREATE, VALIDATE_REBUILD, VALIDATE_DELETE, VALIDATE_UNCHANGED, VALIDATE_NEW_GALLERY, VALIDATE_CHANGED_GALLERY, VALIDATE_REMOVED_GALLERY, and VALIDATE_DUPLICATE_LOSER; require VALIDATE_CATALOG_PROJECTION terminal COMPLETE after its independent exact child merge but never compare its child processed_count with publication count; take publication_count only from terminal VALIDATE_SELECTION, require prepared_artifact_count equals create_count plus rebuild_count, and require artifact_input_count equals create_count plus rebuild_count plus unchanged_count; insert only the PK-only publication_candidate_projection_seal certification marker after all equations hold, so graph-derived candidate lifecycle becomes SEALED; the logical projection derives only create_count, rebuild_count, delete_count, new_galleries, and changed_galleries by fixed O(1) terminal-receipt joins, while every other receipt-owned count remains derived at its authority; never copy terminal validation scalars; never SUM receipts or child relations, trust an audit digest, or seal from a BUILD stage"
finalization_rule = "after the pointer transaction exposes the sealed commit as derived publication_receipt state DB_COMMITTED, never mass-update prepared_artifact and never use the transient candidate checkpoint or receipt; the commit-owned permanent FINALIZE_ARTIFACTS checkpoint is initialized before publication_commit_seal and uses an exact publication_key keyset cursor, processed_count, monotone generation, and OPEN or COMPLETE state. For each maximum-128 page, an issue read transaction reads the exact checkpoint generation and contiguous PREPARED rows plus protection tokens without mutation; the caller releases those exact protection tokens idempotently outside every database transaction; a separate commit transaction locks and exact-revalidates the same checkpoint generation/cursor and release acknowledgements, advances only acknowledged rows to COMMITTED, inserts the permanent receipt_id/start_generation response family with seal last, and CAS-advances cursor/count/generation together. Exact batch_key or start_generation replay joins the permanent sealed receipt and returns the byte-for-byte response without writes even after candidate cleanup or response loss. An empty terminal page alone writes terminal=1, row_count zero, next_state COMPLETE, checkpoint COMPLETE, and the PK-only publication_commit_finalization marker in the same commit transaction, with processed_count equal to the terminal VALIDATE_PREPARED_ARTIFACT receipt count; the marker, exact COMPLETE checkpoint generation, and congruent permanent terminal receipt derive publication_receipt PROJECTION_FINALIZED and finalized_at from that receipt committed_at, never from a stored marker timestamp, MAX, or an arbitrary terminal row"
runtime_obligation = "in one fenced publication protocol, validate the exact selected publication child set and publication_count; assign every selected publication exactly one contiguous zero-based catalog_publication_order position under the exact registered title-sort bytes with publication_key as the stable tie break, and require the order-row count to equal publication_count; stream the exact strict-UTF-8 METADATA comment bytes without normalization or trimming through catalog_summary_digest_parts into catalog_summary_utf8_v1; select catalog_language_utf8_v1 from the nonempty exact tag-value bytes at the minimum gallery tag position whose namespace is the case-sensitive UTF-8 bytes language, or use the exact ASCII bytes und when absent, without normalization or trimming, and stream through catalog_language_digest_parts; build both canonical trees under the live generation upload claim; validate all six exactly-once artifact input component kinds and exact canonical payload bytes, artifact old/new delta classification, prepared artifact byte digest/size/member plan/exact ZIP comment and bounded protection token; validate the complete artifact_locator_bytes_v1 frame is at most 4096 bytes before exposing or storing any segment, stream it through iter_artifact_locator_payload and canonical_value_digest_parts exactly as u32be(codec_version=1) || u32be(segment_count) || repeated(u32be(segment_utf8_length) || strict_utf8_segment), rejecting empty/dot/NUL/separator segments, and store its canonical locator reference; readers validate exact EOF within the same 4096-byte cap before exposing a segment; the monolithic digest helpers are bounded convenience oracles and never the production write path for arbitrary summary/language bytes; before graph-derived candidate lifecycle SEALED, bounded stage receipts plus an independent full evaluator must validate exact selection, order, every reserved-revision catalog child, artifact delta, artifact input, and prepared coverage, then insert only the PK-only publication_candidate_projection_seal after exact publication_count, artifact_input_count, prepared_artifact_count, CREATE/REBUILD/DELETE/UNCHANGED counts, and new_galleries/changed_galleries/removed_galleries/duplicate_losers equations hold; derive the five logical projection counts only through fixed terminal-receipt joins; the final pointer transaction joins candidate.analysis_id through analysis_snapshot_manifest to the exact source_revision snapshot, joins the unique publication_candidate_preparation to its COMPLETE matching-policy current-generation effect seal, and compares only O(1) certification, terminal receipt, catalog_revision, and publication_receipt scalars before activation and head CAS, never COUNT or SUM over child rows; compare every immutable revision child field and digest/count before sealing the projection; publish only by compare-and-swap from the candidate-pinned base head to the reserved revision, never trust a caller/audit digest or guessed scalar, never expose a partial revision, and never perform an unbounded bind"

