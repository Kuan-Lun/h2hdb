name: Formal verification

on:
  workflow_dispatch:
    inputs:
      deep:
        description: Run the larger finite TLC profiles
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  required-formal-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install checksum-pinned Elan and repository-pinned Lean
        shell: bash
        env:
          ELAN_VERSION: "4.2.3"
          ELAN_SHA256: "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2"
        run: |
          set -euo pipefail
          elan_archive="${RUNNER_TEMP}/elan-${ELAN_VERSION}.tar.gz"
          elan_home="${RUNNER_TEMP}/elan-home"
          curl --proto '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            --output "${elan_archive}" \
            "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "${ELAN_SHA256}" "${elan_archive}" \
            | sha256sum --check --strict
          tar --extract --gzip \
            --file "${elan_archive}" \
            --directory "${RUNNER_TEMP}"
          ELAN_HOME="${elan_home}" "${RUNNER_TEMP}/elan-init" \
            -y \
            --default-toolchain none \
            --no-modify-path
          echo "ELAN_HOME=${elan_home}" >> "${GITHUB_ENV}"
          echo "${elan_home}/bin" >> "${GITHUB_PATH}"
          lean_toolchain="$(tr -d '\r\n' < lean-toolchain)"
          ELAN_HOME="${elan_home}" "${elan_home}/bin/elan" \
            toolchain install "${lean_toolchain}"
          ELAN_HOME="${elan_home}" "${elan_home}/bin/lean" --version

      - name: Install exact formal-test runtime
        run: |
          python -m pip install \
            pytest==9.1.1 \
            hypothesis==6.165.10 \
            pydantic==2.13.4 \
            mysql-connector-python==26.7.0
          python -m pip install --no-deps -e .

      - name: Validate coverage contract (not production readiness)
        run: |
          python scripts/verify-formal.py coverage --validate-only
          python -m pytest -q tests/test_verification_coverage.py

      - name: Exercise schema and refinement negative controls
        run: >-
          python -m pytest -q
          tests/test_verification_schema.py
          tests/test_verification_schema_properties.py
          tests/test_verification_schema_refinement.py
          tests/test_verification_operational_schema.py

      - name: Check schema contracts and every generated artifact for drift
        run: python scripts/verify-formal.py schema

      - name: Check generated runtime provider artifact for drift
        run: python scripts/generate-vnext-schema-provider.py --check

      - name: Check Lean proofs without warnings
        run: python scripts/verify-formal.py lean

      - name: Exercise schema epoch faults and generated provider
        run: >-
          python -m pytest -q
          tests/test_schema_epoch.py
          tests/test_schema_epoch_mariadb.py
          tests/test_schema_admin.py
          tests/test_vnext_schema_provider_generation.py

  required-tlc-small:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Fetch checksum-pinned TLC
        run: python scripts/fetch-formal-tools.py

      - name: Model-check finite catalog lifecycle
        run: >-
          python scripts/verify-formal.py tla
          --tla-runtime docker
          --tla-jar .formal-tools/tla2tools-1.7.4.jar

  deep-tlc-manual:
    if: inputs.deep == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Fetch checksum-pinned TLC
        run: python scripts/fetch-formal-tools.py

      - name: Model-check larger finite catalog lifecycle profiles
        run: >-
          python scripts/verify-formal.py tla
          --deep
          --tla-runtime docker
          --tla-jar .formal-tools/tla2tools-1.7.4.jar
