[canonical_digest_protocol]
policy_relation = "canonical_digest_policy"
value_relation = "canonical_value_identity"
digest_attribute = "value_sha256"
allocation_relation = "canonical_value_allocation"
page_relation = "canonical_value_page"
descriptor_relation = "canonical_value_page_descriptor"
parent_relation = "canonical_value_page_parent"
root_attribute = "root_page_sha256"
byte_count_attribute = "byte_count"
algorithm = "SHA-256"
framing = "ascii('h2hdb-vnext-canonical-value\\0') || u32be(codec_version) || u32be(digest_domain_length) || digest_domain_ascii || u64be(payload_length) || payload"
enforcement = "bounded_stream_recompute_tree_validate_and_collision_compare"

[canonical_value_page_protocol]
codec_version = 1
prefix = "h2hdb-vnext-canonical-value-page\\0"
maximum_page_bytes = 65536
chunk_maximum_bytes = 32768
branch_capacity = 256
maximum_level = 8
maximum_byte_count = 9223372036854775807
framing = "ascii('h2hdb-vnext-canonical-value-page\\0') || u32be(version=1) || raw32(owner_value_sha256) || u8(node: LEAF=0,BRANCH=1) || u8(level=0..8) || u64be(page_position_int63) || u64be(subtree_byte_count_int63) || u32be(entry_count) || exact_records"
enforcement = "raw_sha256_exact_page_compare_and_owner_tree_seal"

[source_locator_protocol]
identity_relation = "source_locator_identity"
gallery_relation = "gallery_identity"
digest_attribute = "locator_sha256"
name_attribute = "source_gallery_name"
canonical_value_relation = "canonical_value_identity"
