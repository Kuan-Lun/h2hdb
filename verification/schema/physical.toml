text = "for permanent commit-owned finalization batches derive committed_generation as start_generation plus one and next_processed_count as start_processed_count plus row_count under int63 overflow preconditions; row_count is zero iff terminal and next_state COMPLETE, while nonterminal requires a strict codec successor and OPEN next state. After external acknowledgement is exact-revalidated, the commit transaction inserts one complete wide current receipt, generation-CASes one complete wide checkpoint, and deletes its safely acknowledged predecessor in the same bounded transaction; the latest retained current receipt poststate equals the exact checkpoint. Exact replay of retained batch_key or start_generation returns the same derived response with zero DML; pruned retries return stale/not-found, while the terminal current receipt remains retained as publication finalization timestamp authority"
semantic_obligation_id = "catalog.publication-atomicity.v1"

