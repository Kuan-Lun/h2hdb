name: Windows pytest process supervision

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-pytest-process-supervision:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install isolated pytest runtime
        run: python -m pip install pytest==9.1.1

      - name: Verify Windows Job Object process-tree ownership
        run: >-
          python -m pytest --noconftest -o addopts= -o required_plugins=
          -q tests/test_pytest_budget_runner_windows.py
