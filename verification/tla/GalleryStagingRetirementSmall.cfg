\* Required finite profile for shared-fenced implicit ACK, RETIRING states,
\* seven-phase child-first retirement, and exact emergency-budget accounting.
\* TLC success remains bounded to these constants and is not SQL refinement.
SPECIFICATION Spec

CONSTANTS
    MaxBudget = 2
    MaxGeneration = 2

INVARIANTS
    TypeOK
    BudgetExactlyMatchesRetainedRequests
    RetiringRequiresDeliveredImplicitAck
    ImplicitAckUsesSharedFence
    RecoveryPrecedesAck
    OldRetryCannotMutateRetiring
    OneBuildSlotRejectsConcurrentBegin
    DeletionIsChildFirst
    RootDeletionRequiresEmptyChildren
