[publication_atomic_contract]
candidate_relation = "publication_candidate"
selection_relation = "publication_selection"
artifact_input_relation = "artifact_input"
artifact_component_relation = "artifact_semantic_input"
operation_relation = "artifact_operation"
prepared_artifact_relation = "prepared_artifact"
stage_relation = "publication_stage"
projection_seal_relation = "publication_candidate_projection_seal"
checkpoint_relation = "publication_checkpoint"
batch_receipt_relation = "publication_batch_receipt"
source_manifest_binding_relation = "analysis_snapshot_manifest"
revision_relation = "catalog_revision"
head_relation = "publication_head"
finalization_stage = "FINALIZE_ARTIFACTS"
selection_rule = "BUILD_SELECTION streams every immutable source_build_gallery member of candidate.analysis_id in unsigned positive gallery_id keyset order and inserts a row if and only if the gallery is its analysis_content_owner_resolved owner for its nonexcluded effective CONTENT digest, treating a gallery with no nonexcluded CONTENT digest as its own owner, and the same gallery is the analysis_gid_winner_resolved winner for its exact metadata GID; derive publication_key only with publication-key.v1 from that positive GID; publication_selection stores no audit digest; VALIDATE_SELECTION independently streams the same predicate, exact merge-compares candidate_id, gallery_id, and publication_key against the materialization, and only its empty terminal receipt owns publication_count"
cursor_codec_rule = "publication_gallery_v1 is empty at genesis or u64be(positive gallery_id); publication_key_v1 is empty at genesis or raw32(publication_key); publication_resource_v2 is empty at genesis or exact raw32(publication_key) || u8(registered resource-kind tag, acquisition=0 and thumbnail=1), ordered by publication_key then resource_kind and round-tripped through the public typed cursor; publication_catalog_child_v2 is empty at genesis or u8(version=2) || u8(child_kind: PUBLICATION=0,ORDER=1,TITLE=2,CONTENT=3,CONTRIBUTOR=4,SUBJECT=5,ARTIFACT=6,DOWNLOAD_TIME=7,SEARCH_DOCUMENT=8,SEARCH_POSTING=9,TITLE_SEARCH_POSTING=10,LANGUAGE_FACET=11,SUBJECT_FACET=12,CONTRIBUTOR_FACET=13,DISCOVERY_SEAL=14) || raw32(publication_key) || u16be(subkey_length) || bounded subkey, where subkey is empty for singleton publication/title/content/artifact/download-time/search-document/discovery-seal, raw32(value_sha256) for search/title-search postings, and u64be(position) for order/contributor/subject/facets; exact EOF is required; gallery IDs compare unsigned integers and every other key compares unsigned bytes; the locked registered stage selects the codec and caller cursor bytes never select or alter a query"
batch_rule = "the registry remains exactly seventeen ordered stages, with candidate-owned wide checkpoints only for the first sixteen; FINALIZE_ARTIFACTS uses the permanent receipt-owned checkpoint. Every maximum-128 candidate batch locks one wide checkpoint, derives the next exact server-side keyset page, inserts one immutable wide current receipt under both generation and batch candidate keys, generation-CASes the complete wide checkpoint, and deletes the safely acknowledged predecessor receipt in the same bounded transaction. The read-only current receipt projection derives committed_generation, next_processed_count, terminal and next_state; exact retained batch-key or generation replay compares every field with zero DML. Once an exact successor or terminal projection handoff is durable, the superseded receipt is pruned and an older retry returns stale/not-found with zero DML; no time-based replay window or lifetime history is retained. Terminal is exactly an empty page with unchanged cursor/count and COMPLETE next state; every nonterminal page has positive row_count and OPEN next state; caller values never authorize mutation"
projection_seal_rule = "after VALIDATE_DUPLICATE_LOSER becomes COMPLETE, one short certification transaction locks the candidate definition seal and terminal checkpoints for VALIDATE_SELECTION, VALIDATE_CATALOG_PROJECTION, VALIDATE_ARTIFACT_INPUT_DELTA, VALIDATE_PREPARED_ARTIFACT, VALIDATE_CREATE, VALIDATE_REBUILD, VALIDATE_DELETE, VALIDATE_UNCHANGED, VALIDATE_NEW_GALLERY, VALIDATE_CHANGED_GALLERY, VALIDATE_REMOVED_GALLERY, and VALIDATE_DUPLICATE_LOSER; require VALIDATE_CATALOG_PROJECTION terminal COMPLETE after its independent exact child merge but never compare its child processed_count with publication count; take publication_count only from terminal VALIDATE_SELECTION, require prepared_artifact_count equals create_count plus rebuild_count, and require artifact_input_count equals create_count plus rebuild_count plus unchanged_count; insert only the PK-only publication_candidate_projection_seal certification marker after all equations hold, so graph-derived candidate lifecycle becomes SEALED; the logical projection derives only create_count, rebuild_count, delete_count, new_galleries, and changed_galleries by fixed O(1) terminal-receipt joins, while every other receipt-owned count remains derived at its authority; never copy terminal validation scalars; never SUM receipts or child relations, trust an audit digest, or seal from a BUILD stage"
finalization_rule = "after the initial pointer transaction inserts a reader-invisible DB_COMMITTED successor without changing the common head, the external library adapter activates adapter-issued opaque storage-object pages in batches of at most 128 and reconciles at most 128 installs or removals per call until its durable checkpoint reports READY. Only then FINALIZE_ARTIFACTS uses the permanent receipt-owned checkpoint and typed publication_resource_v2 cursor: issue exact-loads the sealed immutable prepared-resource set in (publication_key, resource_kind) order with LIMIT 129, returns at most 128 resources without mutation, and proves every returned token, key, digest, size and generation from durable authority; external token release is idempotent; commit exact-revalidates acknowledgements, compare-and-swaps each acknowledged resource, advances the typed cursor, inserts one immutable current finalization receipt, generation-CASes the checkpoint, and deletes its safely acknowledged predecessor in one bounded transaction. No publication-count scalar is reinterpreted as a resource count. Terminal is authorized only when the locked cursor suffix contains zero resources after all prior pages completed their per-resource atomic CAS; that empty transaction writes the COMPLETE checkpoint and PUBLISHED marker, CASes the common head, and exact-deletes both working roots atomically. Retained batch-key or start-generation replay returns the exact derived response with zero DML; pruned retries return stale/not-found; the retained terminal receipt owns finalized_at and response loss resumes cleanup without republishing."
runtime_obligation = "in one fenced publication protocol, validate the exact selected publication child set and publication_count; publish the selected observation download_time as one immutable occurrence-key child for every selected publication and independently exact-compare it before sealing; assign every selected publication exactly one contiguous zero-based catalog_publication_order position under the exact registered title-sort bytes with publication_key as the stable tie break, and require the order-row count to equal publication_count; stream the exact strict-UTF-8 METADATA comment bytes without normalization or trimming through catalog_summary_digest_parts into catalog_summary_utf8_v1; select catalog_language_utf8_v1 from the nonempty exact tag-value bytes at the minimum gallery tag position whose namespace is the case-sensitive UTF-8 bytes language, or use the exact ASCII bytes und when absent, without normalization or trimming, and stream through catalog_language_digest_parts; build both canonical trees under the live generation upload claim; validate all six exactly-once artifact input component kinds and exact canonical payload bytes plus artifact old/new delta classification; consume only adapter-issued neutral render evidence, establish the core-recomputed resource byte digest/size from a bounded core-owned destination, persist prepared_resource_blob authority before external protection, and exact-validate each acquisition plus optional thumbnail bundle, dense page_index sequence, and every extent end within its sealed storage object; derive each bounded protection token from locked resource facts; obtain every adapter-issued storage key through the storage-object-key v2 framing, require the complete frame to be at most 4096 bytes, encode u32be(segment_count) plus length-prefixed strict_utf8_segment values, and reject unsafe segments, malformed framing, trailing bytes, or any non-exact EOF; confirm each protected resource only after its exact object digest/size matches the pre-protection blob authority; before graph-derived candidate lifecycle SEALED, bounded stage receipts plus an independent full evaluator must validate exact selection, order, every reserved-revision catalog child, artifact delta, artifact input, and prepared coverage, then insert only the PK-only publication_candidate_projection_seal after exact publication_count, artifact_input_count, prepared_artifact_count, CREATE/REBUILD/DELETE/UNCHANGED counts, and new_galleries/changed_galleries/removed_galleries/duplicate_losers equations hold; derive the five logical projection counts only through fixed terminal-receipt joins; the initial pointer transaction joins candidate.analysis_id through analysis_snapshot_manifest to the exact source_revision snapshot, joins the unique publication_candidate_preparation to its COMPLETE matching-policy current-generation effect seal, compares only O(1) certification, terminal receipt, catalog_revision, and publication_receipt scalars, and inserts an immutable reader-invisible DB_COMMITTED successor without head CAS, never COUNT or SUM over child rows; after bounded library activation READY, typed resource-cursor finalization exact-compares every immutable resource, compares the candidate-pinned base head, CASes the PUBLISHED revision, and deletes the exact working roots; never trust a caller/audit digest or guessed scalar, never expose a partial revision, and never perform an unbounded bind"

