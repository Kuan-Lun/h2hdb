name: Publish to PyPI

on:
  push:
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  validate:
    if: >-
      ${{ github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install version parser
        run: python -m pip install --upgrade packaging

      - name: Check version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          from packaging.version import Version


          def project_version(document: str) -> Version:
              return Version(str(tomllib.loads(document)["project"]["version"]))


          def document_at(revision: str) -> str:
              shown = subprocess.run(
                  ["git", "show", f"{revision}:pyproject.toml"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if shown.returncode == 0:
                  return shown.stdout

              fetched = subprocess.run(
                  ["git", "fetch", "--no-tags", "--depth=1", "origin", revision],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if fetched.returncode != 0:
                  detail = fetched.stderr.strip() or fetched.stdout.strip()
                  raise SystemExit(
                      f"cannot fetch the pre-push revision {revision}: {detail}"
                  )
              return subprocess.run(
                  ["git", "show", f"{revision}:pyproject.toml"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout


          current = project_version(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          before = os.environ["BEFORE_SHA"]
          previous = (
              None
              if before and set(before) == {"0"}
              else project_version(document_at(before))
          )
          if previous is not None and current < previous:
              raise SystemExit(
                  f"project.version decreased from {previous} to {current}"
              )

          # Creating or seeding the default branch is not a version transition.
          bumped = previous is not None and current > previous
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              print(f"current={current}", file=output)
              print(f"previous={previous or ''}", file=output)
              print(f"bumped={'true' if bumped else 'false'}", file=output)
          PY

      - name: Install project runtime and build tools
        if: steps.version.outputs.bumped == 'true'
        run: python -m pip install build .

      - name: Build and smoke-test distributions
        if: steps.version.outputs.bumped == 'true'
        run: |
          python scripts/build-and-verify-distributions.py \
            --output-directory dist

      - name: Store distributions
        if: steps.version.outputs.bumped == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: validate
    if: needs.validate.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
