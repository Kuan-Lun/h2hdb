[mypy]
python_version = 3.14
mypy_path = src
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
warn_return_any = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_reexport = True

[mypy-testcontainers.*]
ignore_missing_imports = True

# The cross-repository smoke program is type-checked by the core finalizer even
# though a normal core-only environment intentionally does not install sibling
# applications.  Treat those optional imports as external here; the disposable
# integration environment exercises their real public APIs.
[mypy-h2h_galleryinfo_parser,h2h_galleryinfo_parser.*,h2hdb_downloader,h2hdb_downloader.*,hbrowser,hbrowser.*,fastapi,fastapi.*,h2hdb_ingest,h2hdb_ingest.*,h2hdb_komga,h2hdb_komga.*,h2hdb_opds,h2hdb_opds.*,httpx,httpx.*,PIL,PIL.*]
ignore_missing_imports = True
