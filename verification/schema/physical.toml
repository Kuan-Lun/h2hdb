text = "canonical_value_identity(value_sha256,root_page_sha256) is inserted last only after allocation domain/count congruence, complete deterministic tree validation, exact root owner/count equality, and incremental recomputation of the canonical wrapper digest; identity seal alone retains the canonical_value_upload claim until the first retention-blocking external consumer handoff transaction; a phase-owned dictionary or type row alone never releases the claim; existing canonical foreign keys reference only this final seal"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "canonical_value_page_contract.cleanup_rule"
text = "CANONICAL_VALUE cleanup is rooted at canonical_value_allocation; final-identity foreign keys and operational canonical_value_upload(generation,value_sha256), keyed only by that pair so multiple takeover generations may protect the same value, block cleanup; generation is SQL-bound to the ingest-generation owner; the first allocation plus upload claim commits atomically under the exact live coordination head, owner, and lease; source_root_v1 is the sole pre-mapping exception because its final identity is required before source_scope, source_build, and source_build_generation can exist, and the same live turn creates that mapping after sealing the root; every other digest domain requires its durable source_build_generation mapping before allocation or claim; a newer-generation resume exact-compares the existing allocation domain/count and every deterministic page conflict; every allocation, page, and seal holds the shared canonical-value maintenance gate and rechecks the live head/owner/lease/claim, while a cleanup cycle holds its exclusive form; inserting or validating the final identity never releases its upload claim by itself; the first retention-blocking external consumer and deletion of only that generation claim commit atomically, while a phase-owned dictionary or type row alone never releases the claim; for source_root_v1 that handoff transaction inserts source_scope, source_build, and source_build_generation before deleting the claim; independent bounded cleanup removes residual claims only after their generation is completed or strictly superseded, including a crash after identity seal but before consumer handoff and a crashed source_root_v1 pre-mapping claim whose generation has no source_build_generation row, and only then may source-build cleanup delete a mapping that does exist; finally delete an unblocked identity, parent edges, descriptors, owner pages, and allocation child-first; owner-prefixed pages are never shared across allocations"
semantic_obligation_id = "catalog.retention.v1"

[[runtime_obligation_binding]]
path = "source_root_contract.write_obligation"
text = "encode the exact absolute POSIX source-root segment tuple; two-pass stream the arbitrary-total-length frame through iter_source_root_payload, source_root_digest, and canonical_value_digest_parts without materializing the complete value; persist the payload through the registered source_root_v1 canonical digest wrapper, recompute source_root_sha256, and byte-compare the complete domain and payload on every digest conflict; readers first consume the complete immutable canonical page stream through validate_source_root_parts and require an exact EOF receipt before replay may expose a component; decode_source_root is a convenience oracle only"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "source_locator_contract.write_obligation"
text = "split the source-root-relative nested gallery directory into exact UTF-8 path segments; reject empty, dot, separator-containing, NUL-containing, or over-255-byte segments; frame every segment without normalization; two-pass stream the arbitrary-total-length frame through iter_source_relative_locator_payload and canonical_value_digest_parts under source_relative_locator_v1 without materializing the complete value; byte-compare on digest conflict; and require source_gallery_name to equal the exact final segment"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "source_locator_contract.read_obligation"
text = "resolve a gallery path only by joining gallery_identity.locator_sha256 through source_locator_identity and canonical_value_identity; first consume the complete immutable canonical page stream through validate_source_relative_locator_parts to verify framing, strict UTF-8, digest-bound receipt, and exact EOF without exposing a component; then replay the same sealed page root into a provisional bounded consumer whose effects commit only after replay completion; verify the digest domain and final-segment name, and never reconstruct identity from a leaf name alone; decode_source_relative_locator is a convenience oracle only"
semantic_obligation_id = "catalog.canonical-reference-domains.v1"

[[runtime_obligation_binding]]
path = "source_scope_identity_contract.write_obligation"
text = "derive scope_key by domain-separated SHA-256 over the exact registered source_provider bytes, canonical source_root_sha256, and identity_policy_version; reject caller-supplied keys; recompute on every write; and on digest conflict require exact natural-tuple equality"
semantic_obligation_id = "catalog.identity-codecs.v1"

[[runtime_obligation_binding]]
path = "source_scope_identity_contract.seal_obligation"
text = "before a source build seals, require source_build.scope_key to equal every joined gallery_identity.scope_key in source_build_gallery, verify every locator digest and exact framed nested locator payload, and reject cross-scope membership"
semantic_obligation_id = "catalog.source-baseline-channel.v1"

[[runtime_obligation_binding]]
path = "file_identity_contract.write_obligation"
text = "derive file_key by SHA-256 over the exact versioned framed name_bytes, reject caller-supplied keys, byte-compare exact name_bytes on digest conflict, and classify file_role as METADATA if and only if name_bytes is the exact ASCII byte sequence galleryinfo.txt; every other valid direct-child dirent is CONTENT"
