\* Finite catalog read-layout and discovery-bundle safety profile.
\* TLC success is bounded to three monotonically advancing revisions and is
\* not connector, Python, SQL, SQLite, or MariaDB refinement evidence.
SPECIFICATION Spec

CONSTANTS
    MaxRevision = 3

INVARIANTS
    TypeOK
    ConnectorLayoutsAgree
    BundleUsesOnePinnedSnapshot
    StableIndependentReadsMatchPinned
    SuccessfulBundleEqualsFourStableReads
    FreshFenceControlsOutcome
    HeadAdvancementHasZeroStaleSuccess
    SuccessfulReadHasExactFreshHead
    SuccessfulReadHadStableHead
