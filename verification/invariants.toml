coverage_version = 1
invariant_sources = [
  "verification/schema/catalog.toml",
  "verification/schema/operational.toml",
]

# Proof engines are pinned by repository-owned lock files.  pytest is pinned
# explicitly in the required CI workflow which executes the runtime evidence.
[tools]
python = "3.14.6"
lean_toolchain = "lean-toolchain"
tlc_lock = "verification/tools.lock.toml"
pytest = "9.1.1"
ci_workflow = ".github/workflows/verify.yml"

