# FD-sensitive names are classified explicitly.  In particular, an audit or
# observational digest is not assumed injective and therefore implies no FD.
# Only canonical_identity_digest and payload_digest carry identity semantics.
[[attribute_semantic]]
name = "analysis_id"
classification = "surrogate_identifier"
rationale = "Opaque identifier for one analysis run; uniqueness is declared only by relation keys."

[[attribute_semantic]]
name = "anchor_analysis_id"
classification = "domain_identifier"
rationale = "Reference to the depth-zero compacted analysis that anchors one bounded overlay chain."

[[attribute_semantic]]
name = "ancestor_analysis_id"
classification = "domain_identifier"
rationale = "Reference to one explicitly materialized ancestor at an exact bounded depth."

[[attribute_semantic]]
name = "artist_count"
classification = "aggregate_count"
rationale = "Derived cardinality scoped by the owning relation key; it is not an identifier."

[[attribute_semantic]]
name = "artist_tag_id"
classification = "domain_identifier"
rationale = "Role-qualified reference to tag_id; its FDs arise only from declared foreign and candidate keys."

[[attribute_semantic]]
name = "artifact_sha256"
classification = "payload_digest"
rationale = "Domain-separated digest of immutable artifact bytes; artifact_blob is the sole digest-to-size authority."

[[attribute_semantic]]
name = "artifact_input_id"
classification = "surrogate_identifier"
rationale = "Opaque identifier for one candidate-scoped desired artifact input; no digest injectivity is assumed."

[[attribute_semantic]]
name = "artifact_semantics_sha256"
classification = "canonical_identity_digest"
rationale = "Domain-separated collision-checked identity of the exact ordered six-component artifact semantic tuple."

[[attribute_semantic]]
name = "source_manifest_component_sha256"
classification = "payload_reference_digest"
rationale = "Canonical exact-byte identity of the versioned artifact source-manifest component."

[[attribute_semantic]]
name = "member_plan_component_sha256"
classification = "payload_reference_digest"
rationale = "Canonical exact-byte identity of the complete ordered artifact member plan, including excluded entries."

[[attribute_semantic]]
name = "effective_content_component_sha256"
classification = "payload_reference_digest"
rationale = "Canonical exact-byte identity of the ordered repeated effective-content digest sequence."

[[attribute_semantic]]
name = "artifact_policy_id"
classification = "surrogate_identifier"
rationale = "Opaque artifact-policy identifier with the exact natural key (artifact_algorithm_version, max_image_short_side). The algorithm version names a registered complete byte-producer bundle; the independently configurable resize bound remains explicit."

[[attribute_semantic]]
name = "artifact_id"
classification = "domain_identifier"
rationale = "Catalog-facing artifact identity whose uniqueness is revision-scoped by exact alternate keys."

[[attribute_semantic]]
name = "artifact_name"
classification = "natural_key"
rationale = "User-facing artifact leaf name; uniqueness is candidate- or revision-scoped by declared keys."

[[attribute_semantic]]
name = "batch_key"
classification = "idempotency_key"
rationale = "Stage-scoped retry key and not a globally unique identifier."

[[attribute_semantic]]
name = "base_analysis_id"
classification = "domain_identifier"
rationale = "Optional reference to the prior completed analysis used as the exact old side of an incremental delta."

[[attribute_semantic]]
name = "build_id"
classification = "surrogate_identifier"
rationale = "Opaque source-build identifier; global uniqueness is declared where it is a candidate key."

[[attribute_semantic]]
name = "byte_count"
classification = "aggregate_count"
rationale = "Build-scoped derived byte total; it determines no row outside its declared key."

[[attribute_semantic]]
name = "candidate_id"
classification = "surrogate_identifier"
rationale = "Opaque publication-candidate identifier."

[[attribute_semantic]]
name = "candidate_sha256"
classification = "audit_digest"
rationale = "Comparator-input checksum for audit/replay; no injectivity or reverse FD is assumed."

[[attribute_semantic]]
name = "selected_component_sha256"
classification = "payload_reference_digest"
rationale = "Canonical exact-byte identity of the selected publication/gallery/item tuple."

[[attribute_semantic]]
name = "digest_domain"
classification = "domain_identifier"
rationale = "Registered exact ASCII semantic domain for canonical payload bytes; it is part of the policy natural key so unrelated encoders cannot share identity space."

[[attribute_semantic]]
name = "owner_component_sha256"
classification = "payload_reference_digest"
rationale = "Canonical exact-byte identity of the content-owner and GID-winner decision tuple."

[[attribute_semantic]]
name = "policy_component_sha256"
classification = "payload_reference_digest"
rationale = "Canonical exact-byte identity of the artifact byte-production policy tuple."

[[attribute_semantic]]
name = "gallery_key"
classification = "canonical_identity_digest"
rationale = "Stable domain-separated identity of the exact source scope and full relative locator, independent of database allocation."

[[attribute_semantic]]
name = "value_sha256"
classification = "canonical_identity_digest"
rationale = "Domain-separated SHA-256 identity of exact bytes under canonical_digest_policy; collision-free identity is an explicit contract assumption and writes must compare exact payload on conflict."

[[attribute_semantic]]
name = "source_root_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to the exact unbounded source-root bytes in canonical_value_identity."

[[attribute_semantic]]
name = "locator_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to the exact version-framed arbitrary-depth source-root-relative gallery locator in canonical_value_identity; source_locator_identity validates its typed final segment."

[[attribute_semantic]]
name = "tag_value_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to exact, unbounded, byte-preserving tag value payload."

[[attribute_semantic]]
name = "source_title_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to an exact, unbounded source-title byte value."

[[attribute_semantic]]
name = "title_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to an exact, unbounded display-title byte value."

[[attribute_semantic]]
name = "sort_title_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to an exact, unbounded frozen title-sort byte value."

[[attribute_semantic]]
name = "contributor_name_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to exact, unbounded contributor-name bytes."

[[attribute_semantic]]
name = "sort_as_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to exact, unbounded contributor sort-as bytes."

[[attribute_semantic]]
name = "content_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to the canonical exact effective_content_v1 preimage: version, count, and the ordered duplicate-preserving non-excluded CONTENT file digests. Runtime recomputes and byte-compares collisions before this value may group candidates or identify historical content."

[[attribute_semantic]]
name = "decision_sha256"
classification = "audit_digest"
rationale = "Winner-decision checksum; it is not assumed injective and does not identify the winner independently."

[[attribute_semantic]]
name = "directory_entry_count"
classification = "aggregate_count"
rationale = "Exact entry count captured with one immutable directory observation."

[[attribute_semantic]]
name = "directory_observation_sha256"
classification = "observational_digest"
rationale = "Order-independent directory observation checksum used for revalidation; no injectivity is assumed."

[[attribute_semantic]]
name = "evidence_sha256"
classification = "audit_digest"
rationale = "Checksum of exclusion evidence; it is not assumed injective and implies no reverse FD."

[[attribute_semantic]]
name = "file_count"
classification = "aggregate_count"
rationale = "Build-scoped derived file total."

[[attribute_semantic]]
name = "file_key"
classification = "canonical_identity_digest"
rationale = "Canonical digest of filename bytes; file_name_identity declares both digest and bytes as alternate keys."

[[attribute_semantic]]
name = "file_sha256"
classification = "payload_digest"
rationale = "Domain-separated digest of immutable file bytes; content_blob is the sole digest-to-size authority."

[[attribute_semantic]]
name = "gallery_count"
classification = "aggregate_count"
rationale = "Build-scoped derived gallery total."

[[attribute_semantic]]
name = "gallery_id"
classification = "surrogate_identifier"
rationale = "Opaque surrogate for one filesystem location identity. gallery_identity declares its exact equivalence with (scope_key, locator_sha256); move or rename is remove-plus-add, never an in-place identity mutation."

[[attribute_semantic]]
name = "input_manifest_sha256"
classification = "audit_digest"
rationale = "Pinned analysis-input checksum; it is intentionally not treated as a globally injective manifest identity."

[[attribute_semantic]]
name = "item_sha256"
classification = "audit_digest"
rationale = "Publication-item checksum; no global uniqueness or injectivity is assumed."

[[attribute_semantic]]
name = "artifact_locator_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to the exact artifact storage locator bytes under artifact_locator_bytes_v1. The v1 storage adapter caps the complete encoded locator at 4096 bytes, validates exact EOF before exposing any segment, and revalidates storage-root containment before access."

[[attribute_semantic]]
name = "summary_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to the exact arbitrary-length publication summary UTF-8 bytes streamed from the sealed METADATA comment."

[[attribute_semantic]]
name = "language_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to the exact arbitrary-length publication language UTF-8 bytes selected from the sealed tag tree or the exact default value."

[[attribute_semantic]]
name = "manifest_policy_id"
classification = "surrogate_identifier"
rationale = "Opaque manifest-policy identifier with a separately declared natural policy tuple key."

[[attribute_semantic]]
name = "manifest_sha256"
classification = "audit_digest"
rationale = "Canonicalization checksum retained for comparison; without a typed payload relation it is not assumed injective."

[[attribute_semantic]]
name = "snapshot_manifest_sha256"
classification = "canonical_identity_digest"
rationale = "Retained domain-separated identity of the exact resolved source snapshot, natural analysis-policy tuple, and validated aggregate counts."

[[attribute_semantic]]
name = "maximum_gallery_artist_count"
classification = "aggregate_count"
rationale = "Maximum distinct artist count contributed by any one gallery for a file hash; it is exact threshold evidence, not an identifier."

[[attribute_semantic]]
name = "metadata_sha256"
classification = "audit_digest"
rationale = "Gallery metadata checksum; no reverse FD is assumed without a canonical metadata payload relation."

[[attribute_semantic]]
name = "observation_id"
classification = "surrogate_identifier"
rationale = "Gallery-scoped immutable observation identifier; only (gallery_id, observation_id) is globally meaningful."

[[attribute_semantic]]
name = "observation_identity_sha256"
classification = "payload_reference_digest"
rationale = "Foreign-key reference to the canonical exact gallery_observation_v1 preimage over every immutable semantic and filesystem child fact; runtime revalidates the complete preimage before cross-build reuse."

[[attribute_semantic]]
name = "page_sha256"
classification = "payload_digest"
rationale = "Raw SHA-256 identity of one exact already-domain-prefixed bounded gallery observation page frame; the page relation declares the digest and exact bytes as collision-checked candidate keys."

[[attribute_semantic]]
name = "parent_sha256"
classification = "payload_reference_digest"
rationale = "Reference to the exact decoded parent branch page whose ordered materialized child position is being recorded."

[[attribute_semantic]]
name = "child_sha256"
classification = "payload_reference_digest"
rationale = "Reference to one exact child page digest copied from the collision-checked decoded parent branch frame."

[[attribute_semantic]]
name = "root_page_sha256"
classification = "payload_reference_digest"
rationale = "Reference to the exact root page of one staged FILE, TAG, or DIRECTORY observation tree."

[[attribute_semantic]]
name = "subtree_item_count"
classification = "aggregate_count"
rationale = "Exact child subtree cardinality decoded from a canonical branch page and bounded to signed-int63."

[[attribute_semantic]]
name = "first_key"
classification = "ordering_key"
rationale = "Nullable exact encoded lower ordering boundary derived from the decoded page; absence is legal only for the unique empty component leaf."

[[attribute_semantic]]
name = "last_key"
classification = "ordering_key"
rationale = "Nullable exact encoded upper ordering boundary derived from the decoded page and used by bounded staging checkpoints without repeating hidden semantic values."

[[attribute_semantic]]
name = "occurrence_count"
classification = "aggregate_count"
rationale = "Key-scoped multiplicity derived from exact occurrence rows."

[[attribute_semantic]]
name = "owner_gallery_id"
classification = "domain_identifier"
rationale = "Reference to the selected owner gallery, unique only under the decision relation key."

[[attribute_semantic]]
name = "page_count"
classification = "aggregate_count"
rationale = "Observed gallery page count stored only when the scanner supplies that fact."

[[attribute_semantic]]
name = "policy_id"
classification = "surrogate_identifier"
rationale = "Opaque analysis-policy identifier with a separately declared natural policy tuple key."

[[attribute_semantic]]
name = "priority_key"
classification = "ordering_key"
rationale = "Deterministic comparator value scoped by a candidate; equal values do not imply candidate identity."

[[attribute_semantic]]
name = "publication_id"
classification = "domain_identifier"
rationale = "Stable catalog-facing publication identifier; publication_identity declares its exact equivalence with GID and publication_key."

[[attribute_semantic]]
name = "display_title_policy_id"
classification = "surrogate_identifier"
rationale = "Opaque identity for the deterministic source-title fallback policy used to freeze public display titles."

[[attribute_semantic]]
name = "title_sort_policy_id"
classification = "surrogate_identifier"
rationale = "Opaque identity for one exact casefold algorithm and Unicode Character Database version; display_title_policy pins it for every historical publication."

[[attribute_semantic]]
name = "publication_count"
classification = "aggregate_count"
rationale = "Exact immutable number of public catalog publications in one catalog revision."

[[attribute_semantic]]
name = "publication_key"
classification = "canonical_identity_digest"
rationale = "Canonical SHA-256 identity digest of publication_id; publication_identity declares it as a global alternate key, while candidate and revision relations reference that retained identity."

[[attribute_semantic]]
name = "receipt_id"
classification = "surrogate_identifier"
rationale = "Opaque durable receipt identifier."

[[attribute_semantic]]
name = "raw_content_sha256"
classification = "comparator_key"
rationale = "Order-independent raw-content grouping digest; absence represents no content files and no injectivity is assumed."

[[attribute_semantic]]
name = "row_count"
classification = "aggregate_count"
rationale = "Batch-scoped affected-row total."

[[attribute_semantic]]
name = "scope_key"
classification = "canonical_identity_digest"
rationale = "Domain-separated SHA-256 identity of the exact version-framed (source_provider, source_root_sha256, identity_policy_version) tuple. source_scope declares both digest and natural tuple keys; runtime recomputes and compares the full tuple on collision."

[[attribute_semantic]]
name = "source_revision"
classification = "domain_identifier"
rationale = "Monotonic immutable source-snapshot revision; source_revision declares it as a candidate key and source_head selects one per channel."

[[attribute_semantic]]
name = "scan_observation_sha256"
classification = "observational_digest"
rationale = "Order-independent scanner observation checksum; it is not the canonical manifest and implies no payload FD."

[[attribute_semantic]]
name = "source_file_count"
classification = "aggregate_count"
rationale = "Durable exact file count sealed with one immutable gallery scan observation."

[[attribute_semantic]]
name = "tag_id"
