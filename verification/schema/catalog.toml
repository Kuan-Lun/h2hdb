gid_build_membership_relation = "source_build_gallery"
gid_metadata_relation = "gallery_observation_metadata"
gid_order_attributes = ["prefer_not_already_uploaded", "title_scalar_count", "download_time", "scope_key", "locator_sha256"]
gid_ordering_rule = "within each immutable metadata GID group select the unsigned lexicographically greatest tuple (prefer_not_already_uploaded, title_scalar_count, download_time, scope_key, locator_sha256), all descending; candidate rows store membership only, winner rows store only the selected gallery, and GID is derived through the analysis-pinned build metadata and frozen impacted-GID keyset"
already_uploaded_marker_rule = "the marker is exact ASCII bytes already uploaded; compare every exact strict-UTF-8 tag value after mapping only ASCII A-Z bytes to a-z, ignoring namespace; do not apply Unicode casefold, normalization, locale, collation, or trimming; any marker match encodes zero and absence encodes one"
runtime_obligation = "production streams exact canonical title pages through StrictUtf8ScalarCounter; content candidates persist and replay only content_sha256, prefer_not_already_uploaded, title_scalar_count, and download_time and derive gid/scope_key/locator_sha256 from immutable sealed authority at comparison time; GID candidates persist membership only, winner selection persists only winner_gallery_id, and bounded set queries derive the exact GID group and five-field maximum from the analysis-pinned build, resolved content atoms, gallery identity coordinates, and impacted-GID keyset; reject monolithic title bytes, packed comparator bytes, allocation order, collation, truncation, caller comparator bytes, or any audit digest as authority"

[analysis_impacted_key_contract]
version = 1
maximum_page_galleries = 128
maximum_provenance_rows = 257
witness_rule = "witness.gallery_id = MIN(provenance.gallery_id) for the same analysis/key"
append_rule = "population pages are strictly increasing by gallery_id; first insert fixes the final minimum witness; after base-row insertion only provenance may append and every appended gallery_id must be greater than the witness"
replay_rule = "exact-compare the complete old/new key set for every selected gallery, reject missing or extra provenance and any witness change, and perform zero DML"
cleanup_rule = "base_then_provenance"

