  { relation = "gallery_observation_scan_observation_version", key_attributes = ["gallery_id", "observation_id"], value_attribute = "scan_observation_version", join = { source_relation = "gallery_observation_scan_seal", source_attributes = ["gallery_id", "observation_id"], member_attributes = ["gallery_id", "observation_id"] }, project = true },
