framing = "ascii('h2hdb-vnext-source-snapshot-manifest\\0') || u32be(codec_version) || u32be(analysis_algorithm_version) || u64be(spam_artist_threshold) || u64be(spam_occurrence_threshold) || u32be(content_owner_rule_version) || u32be(gid_winner_rule_version) || u64be(gallery_count) || u64be(file_count) || u64be(byte_count) || u64be(gallery_entry_count) || repeated(raw32(gallery_key) || raw32(observation_identity_sha256) || u8(content_present) || if_present(raw32(content_sha256)) || u64be(gid)) || u64be(file_hash_decision_count) || repeated(raw32(file_sha256) || u64be(occurrence_count) || u64be(artist_count) || u64be(maximum_gallery_artist_count) || u8(excluded_flag)) || u64be(content_owner_count) || repeated(raw32(content_sha256) || raw32(owner_gallery_key)) || u64be(gid_winner_count) || repeated(u64be(gid) || raw32(winner_gallery_key))"
canonical_order = "gallery entries by gallery_key; file-hash decisions by file_sha256; content owners by content_sha256; GID winners by unsigned gid; every repeated section count equals its exact row count and duplicate keys are forbidden"
decision_predicate = "excluded_flag = 1 iff occurrence_count >= spam_occurrence_threshold AND maximum_gallery_artist_count > 0 AND artist_count > spam_artist_threshold * maximum_gallery_artist_count, evaluated in unbounded integers; otherwise excluded_flag = 0"
write_obligation = "construct the payload only from one OPEN snapshot-ready analysis whose exact policy natural tuple and all five immutable component seals freeze its fully resolved snapshot; component rows are immutable once the fifth seal exists even while canonical preparation runs; join gallery_id surrogates through gallery_identity.gallery_key; require every gallery entry to carry its exact observation identity, positive GID, and an explicit content_present byte where zero encodes an empty or metadata-only gallery and is distinct from every 32-byte digest; include every resolved spam decision as the exact occurrence_count, artist_count, maximum_gallery_artist_count, and derived excluded_flag fields; include every content owner and GID winner exactly once as its group key plus stable winner gallery_key, deriving every winner only from exact membership and atomic comparator facts without any persisted audit digest; require owner/winner gallery keys to be members of the same snapshot; validate the three declared aggregate counts against the encoded snapshot; obtain exact section counts, payload_byte_count, order, membership, and aggregate evidence in a bounded preflight/keyset receipt, then replay through iter_source_snapshot_manifest_payload_rows_ordered and source_snapshot_manifest_digest_ordered into canonical_value_digest_parts without materializing the snapshot; recompute the canonical digest and byte-compare the complete payload on collision"
handoff_obligation = "analysis completion accepts only a database-owned private typed canonical snapshot plan derived from the OPEN snapshot-ready analysis; after bounded canonical upload seals the source_snapshot_manifest_identity family, one transaction locks and validates that typed plan, the same OPEN analysis and all five immutable component seals, the sealed canonical identity, and the live-generation canonical_value_upload claim, inserts analysis_snapshot_manifest(analysis_id,snapshot_manifest_sha256), deletes exactly that claim, and CAS-transitions analysis_run from OPEN to COMPLETE with completed_at; all three mutations commit or roll back together; the production AnalysisRepository.handoff_snapshot_manifest COMPLETE response-loss replay resolves by the analysis_id natural key, requires the analysis to remain COMPLETE and its digest to remain a live source-working or live publication-candidate semantic pin, exact-compares the binding digest and all three sealed snapshot count facts, streams and validates collision-checked canonical page bytes, requires the claim absent, and performs zero writes; once no live semantic pin remains, the compact binding is opaque audit only and missing canonical payload fails closed; no caller digest, input_manifest_sha256, audit digest, count, or receipt is output authority"
publication_obligation = "source publication and catalog publication join publication_candidate.analysis_id through analysis_snapshot_manifest to source_revision.snapshot_manifest_sha256 and require exact equality in the pointer transaction; source_revision_provenance alone is audit provenance and never proves which canonical output the analysis produced"
retention = "source_revision_descriptor and analysis_snapshot_manifest retain compact opaque audit digests without payload foreign keys and never independently retain source_snapshot_manifest_identity or canonical page bytes; payload remains protected only by a current publication_commit_head_receipt source digest, a live source-working analysis digest, an uncommitted or operationally live publication-candidate digest, or an active canonical_value_upload claim; CANONICAL_VALUE cleanup holds the exclusive maintenance gate, rechecks every dynamic semantic pin before each bounded child-first batch, deletes reproducible title caches and the snapshot identity family before otherwise-unreferenced canonical pages, and leaves historical audit digests intact"

[retention_contract]
version = 2
indefinitely_retained_relations = [
  "analysis_stage",
  "publication_stage",
]
batch_receipt_retention_mode = "state_based_current_only"
batch_receipt_safe_ack_rule = "retain the current response-loss replay row while its checkpoint poststate has no durable successor; committing an exact successor proves acknowledgement of the predecessor and deletes it in that same bounded transaction; retain a terminal row only until its component/projection handoff is durably certified, except the commit-owned finalization terminal row that remains the current scalar authority for its publication receipt"
batch_receipt_stale_retry_rule = "after safe acknowledgement and bounded pruning, retry of an older batch_key or start_generation returns stale/not-found with zero DML; no wall-clock grace period or historical replay guarantee exists"
cleanup_fixed_point_rule = "the serialized pipeline runs bounded child-first cleanup to a fixed point before admitting the next workflow, so retained receipt families are bounded by active current state rather than elapsed time or lifetime throughput"
published_analysis_baseline_prune_rule = "the terminal PUBLISHED transaction exact-deletes the published COMPLETE depth-zero run's one working baseline after validating its self-only ancestry and durable commit/provenance/snapshot lineage; this releases the old depth-16 chain at each compaction boundary, while positive-depth baseline rows remain ancestry authority and a non-genesis first handoff with a missing row fails closed"
publication_history_mode = "current_head_plus_reachable_working_window"
publication_history_rule = "retain the current common-head commit and only commits/descriptors reachable from active work, pending effects, finalization, or explicit protection claims; the terminal successor activation consumes its one-shot candidate predecessor CAS row in the same transaction as the PUBLISHED head swap, so that row cannot retain the replaced commit after the transition it authorized; after the exact consuming source-build analyses have COMPLETE or ABANDONED terminal state and every COMPLETE analysis has its own newer PUBLISHED current-head handoff, release that builds predecessor receipt pin in the first publication-commit cleanup phase; then exact-delete the commit-owned candidate/preparation binding and COMPLETE preparation control family after every working or artifact-protection root is absent, delete the publication-owned transient typed event snapshot child-first, and atomically delete the commit, effect seal, and event stream before its finalization checkpoint and anchor; because commit-family deletion and generation cleanup are separate bounded transactions, a crash may conservatively retain an unreferenced but exact contiguous generation prefix below the oldest commit; later maintenance must compact the unreachable prefix to a fixed point and treat the oldest retained generation as the compacted floor rather than preserving intentional genesis-to-head history"
publication_parent_selector = "before deleting an eligible publication_commit, capture its exact revision, source_revision and generation under the cleanup fence; after commit-family deletion, delete the now-unreferenced catalog_revision_descriptor, source_revision_descriptor and incoming publication_generation_successor edge by those captured candidate keys, then delete orphan generation nodes while preserving the compacted floor and every current/baseline/protection-reachable node"
publication_parent_cleanup_order = ["catalog_revision_descriptor", "source_revision_descriptor", "publication_generation_successor", "publication_generation_node"]
active_head_relation = "source_head"
revision_relation = "source_revision"
provenance_relation = "source_revision_provenance"
analysis_relation = "analysis_run_descriptor"
build_relation = "source_build_descriptor"
semantic_obligation_id = "catalog.retention.v2"
source_history_rule = "retain source_revision_descriptor only for the current common head or an active/reachable working baseline; after a replacement head is PUBLISHED and all dynamic pins release, delete old provenance, descriptor, snapshot identity and canonical payload child-first instead of preserving source history"
catalog_history_rule = "retain catalog_revision_descriptor and catalog payload only for the current common head or an active/reachable working baseline; after replacement finalization and pin release, delete every non-head payload, descriptor and commit through bounded child-first cleanup"
current_catalog_rule = "catalog readers accept only the current publication head revision (or a pinned descriptor that still equals that same head) and recheck it before returning; explicit historical revisions fail closed before reading payload; a head advance alone never authorizes deletion, because every prior revision remains retained while the new current receipt is DB_COMMITTED or otherwise not PUBLISHED, and only a PUBLISHED current head makes finalized prior payload eligible for CATALOG_PUBLICATION cleanup after bounded live candidate/build predecessor pins release"
active_source_rule = "every source_head.source_revision resolves through the one publication_commit_head receipt and sealed publication_commit and must have exactly one source_revision_provenance row whose analysis_run and source_build remain sealed/complete and reachable as the exact next-run delta base"
inactive_source_rule = "after the replacement common head is PUBLISHED, source_revision_provenance is an ANALYSIS_RUN cleanup child; once every baseline/protection pin releases, delete the inactive analysis/build, source descriptor, catalog descriptor, commit/finalization rows and compacted generation prefix, then delete unreferenced snapshot identity and canonical payload; an old retry is stale/not-found rather than a history read"

